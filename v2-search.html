<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Search</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1050px;margin:auto;padding:24px}.search{display:flex;gap:8px;margin:18px 0}input{flex:1;background:#10151a;color:#fff;border:1px solid #303942;border-radius:9px;padding:14px;font-size:17px}.btn{background:#df3329;color:#fff;border:0;border-radius:8px;padding:12px 20px;font-weight:bold;cursor:pointer}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.muted{color:#89959e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:9px}.item{background:#0b0f12;border:1px solid #29323a;border-radius:8px;padding:12px}.link{color:#fff;text-decoration:none}.link:hover{text-decoration:underline}.tag{font-size:11px;color:#f2b84b;text-transform:uppercase;font-weight:bold}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Shop Search</h1><p class="muted">Search customers, vehicles, VINs and repair orders from one place.</p><div class="search"><input id="q" autofocus placeholder="Name, phone, email, VIN, vehicle or RO #"><button class="btn" onclick="run()">Search</button></div><div id="results"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));q.addEventListener('keydown',e=>{if(e.key==='Enter')run()});async function run(){if(q.value.trim().length<2)return;const r=await fetch('/api/v2/search?q='+encodeURIComponent(q.value.trim())),d=await r.json();if(!r.ok){results.textContent=d.error||'Search failed';return}const group=(title,items,render)=>`<section class="card"><h2>${title} <span class="muted">(${items.length})</span></h2><div class="grid">${items.map(render).join('')||'<span class="muted">No matches</span>'}</div></section>`;results.innerHTML=group('Repair Orders',d.repair_orders,x=>`<div class="item"><div class="tag">RO #${x.id}</div><b>${esc(x.customer_name)}</b><div>${esc([x.year,x.make,x.model].filter(Boolean).join(' '))}</div><div class="muted">${esc(x.workflow_status||x.status||'')}</div><a class="link" href="v2-timeline.html?ro=${x.id}">Open timeline →</a></div>`)+group('Customers',d.customers,x=>`<div class="item"><div class="tag">Customer #${x.id}</div><b>${esc(x.name)}</b><div class="muted">${esc(x.phone||'')} ${esc(x.email||'')}</div><a class="link" href="v2-customer-history.html?customer=${x.id}">Open history →</a></div>`)+group('Vehicles',d.vehicles,x=>`<div class="item"><div class="tag">Vehicle</div><b>${esc([x.year,x.make,x.model].filter(Boolean).join(' '))}</b><div>${esc(x.customer_name)}</div><div class="muted">VIN ${esc(x.vin||'—')}</div></div>`)}</script></body></html>
