<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Parts Requests</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.muted{color:#89959e}.form{display:grid;grid-template-columns:110px 1fr 100px auto;gap:8px}input,select{background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:10px}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}.btn.secondary{background:#27313a}.btn:disabled{opacity:.55;cursor:not-allowed}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#0b0f12;border:1px solid #27313a;border-radius:9px;padding:12px}.metric b{display:block;font-size:22px;margin-top:4px}.row{display:grid;grid-template-columns:1.5fr .8fr 1.15fr 1fr;gap:12px;padding:14px 0;border-bottom:1px solid #283139}.status{font-weight:bold;text-transform:uppercase;font-size:11px}.requested{color:#f2b84b}.ordered{color:#69a9ff}.received{color:#58c87b}.overdue{border-left:3px solid #df3329;padding-left:12px}.danger{color:#ff655d;font-weight:bold}.editor{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.editor .btn{grid-column:1/-1}.msg{margin-top:10px;min-height:18px}.ok{color:#58c87b}.error{color:#ff655d}@media(max-width:750px){.form,.row,.summary{display:block}.form>*{width:100%;margin:5px 0}.row>*{margin:8px 0}.metric{margin:8px 0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Parts Requests</h1><p class="muted">Technician-to-parts workflow from request through install. Ordered parts require a vendor and ETA.</p><section class="card"><div class="form"><input id="ro" type="number" min="1" placeholder="RO #"><input id="description" maxlength="1000" placeholder="Part needed"><input id="qty" type="number" min=".01" max="10000" step=".01" value="1"><button id="addBtn" class="btn" onclick="add()">Request Part</button></div><div id="message" class="msg muted"></div></section><section class="summary"><div class="metric"><span class="muted">Requested</span><b id="requestedCount">0</b></div><div class="metric"><span class="muted">Ordered</span><b id="orderedCount">0</b></div><div class="metric"><span class="muted">Received</span><b id="receivedCount">0</b></div><div class="metric"><span class="muted">Overdue</span><b id="overdueCount">0</b></div></section><section class="card"><div id="rows"><p class="muted">Loading parts requests…</p></div></section></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const allowedNext={requested:['requested','ordered','cancelled'],ordered:['ordered','received','cancelled'],received:['received','installed','cancelled']};
const fmtDate=value=>{if(!value)return 'No ETA';const d=new Date(value);return Number.isNaN(d.getTime())?String(value):d.toLocaleString()};
const inputDate=value=>{if(!value)return '';const d=new Date(value);if(Number.isNaN(d.getTime()))return '';const pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
function setMessage(text,type='muted'){message.className='msg '+type;message.textContent=text||''}
function counts(data){requestedCount.textContent=data.filter(x=>x.status==='requested').length;orderedCount.textContent=data.filter(x=>x.status==='ordered').length;receivedCount.textContent=data.filter(x=>x.status==='received').length;overdueCount.textContent=data.filter(x=>Number(x.overdue)===1).length}
async function load(){try{const r=await fetch('/api/v2/parts-requests',{headers:{Accept:'application/json'}}),d=await r.json();if(!r.ok){rows.textContent=d.error||'Unable to load parts';return}counts(d);rows.innerHTML=d.length?d.map(x=>{const next=allowedNext[x.status]||[x.status];return `<div class="row ${Number(x.overdue)===1?'overdue':''}"><div><b>RO #${x.repair_order_id} · ${esc(x.description)} × ${esc(x.quantity)}</b><div class="muted">${esc(x.customer_name)} · ${esc([x.year,x.make,x.model].filter(Boolean).join(' '))}</div>${Number(x.overdue)===1?'<div class="danger">ETA overdue</div>':''}</div><div><span class="status ${esc(x.status)}">${esc(x.status)}</span><div><select id="status-${x.id}" onchange="toggleEditor(${x.id},this.value)">${next.map(s=>`<option value="${s}" ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></div></div><div><div>${esc(x.vendor||'Vendor not set')}</div><div class="muted">${x.eta?'ETA '+esc(fmtDate(x.eta)):'No ETA'}</div><div id="edit-${x.id}" class="editor" style="display:${x.status==='ordered'?'grid':'none'}"><input id="vendor-${x.id}" maxlength="300" placeholder="Vendor" value="${esc(x.vendor||'')}"><input id="eta-${x.id}" type="datetime-local" value="${esc(inputDate(x.eta))}"><button class="btn secondary" onclick="save(${x.id})">Save Change</button></div></div><div class="muted">Requested by ${esc(x.requested_by_name||'Employee')}<br>${esc(fmtDate(x.requested_at))}</div></div>`}).join(''):'<p class="muted">No active parts requests.</p>'}catch(e){rows.textContent='Unable to load parts requests.'}}
function toggleEditor(id,status){const box=document.getElementById('edit-'+id);if(box)box.style.display=status==='ordered'?'grid':'none';if(status!=='ordered')save(id)}
async function add(){const id=Number(ro.value),desc=description.value.trim(),quantity=Number(qty.value);if(!Number.isInteger(id)||id<1)return setMessage('Enter a valid repair order number.','error');if(!desc)return setMessage('Enter the part that is needed.','error');if(!Number.isFinite(quantity)||quantity<=0||quantity>10000)return setMessage('Enter a valid quantity.','error');addBtn.disabled=true;setMessage('Saving…');try{const r=await fetch('/api/v2/repair-orders/'+id+'/parts-requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({description:desc,quantity})}),d=await r.json();if(!r.ok)return setMessage(d.error||'Unable to request part','error');description.value='';qty.value=1;setMessage('Part request added.','ok');await load()}catch(e){setMessage('Unable to request part.','error')}finally{addBtn.disabled=false}}
async function save(id){const status=document.getElementById('status-'+id)?.value,vendor=document.getElementById('vendor-'+id)?.value.trim()||'',eta=document.getElementById('eta-'+id)?.value||null;if(status==='ordered'&&(!vendor||!eta))return setMessage('Vendor and ETA are required before a part can be marked ordered.','error');setMessage('Saving…');try{const r=await fetch('/api/v2/parts-requests/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,vendor,eta})}),d=await r.json();if(!r.ok){setMessage(d.error||'Unable to update part','error');return load()}setMessage('Parts request updated.','ok');await load()}catch(e){setMessage('Unable to update parts request.','error');await load()}}
load();setInterval(load,60000);
</script></body></html>
