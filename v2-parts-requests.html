<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Parts Requests</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1150px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.muted{color:#89959e}.form{display:grid;grid-template-columns:100px 1fr 90px auto;gap:8px}input,select{background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:10px}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:12px;padding:13px 0;border-bottom:1px solid #283139}.status{font-weight:bold;text-transform:uppercase;font-size:11px}.requested{color:#f2b84b}.ordered{color:#69a9ff}.received{color:#58c87b}@media(max-width:750px){.form,.row{display:block}.form>*{width:100%;margin:5px 0}.row>*{margin:7px 0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Parts Requests</h1><p class="muted">Technician-to-parts workflow from request through install.</p><section class="card"><div class="form"><input id="ro" type="number" placeholder="RO #"><input id="description" placeholder="Part needed"><input id="qty" type="number" step=".01" value="1"><button class="btn" onclick="add()">Request Part</button></div></section><section class="card"><div id="rows"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const states=['requested','ordered','received','installed','cancelled'];async function load(){const r=await fetch('/api/v2/parts-requests'),d=await r.json();if(!r.ok){rows.textContent=d.error||'Unable to load parts';return}rows.innerHTML=d.length?d.map(x=>`<div class="row"><div><b>RO #${x.repair_order_id} · ${esc(x.description)} × ${x.quantity}</b><div class="muted">${esc(x.customer_name)} · ${esc([x.year,x.make,x.model].filter(Boolean).join(' '))}</div></div><div><span class="status ${x.status}">${esc(x.status)}</span><select onchange="update(${x.id},this.value,'${esc(x.vendor||'')}','${x.eta||''}')">${states.map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></div><div>${esc(x.vendor||'Vendor not set')}<div class="muted">${x.eta?'ETA '+esc(x.eta):'No ETA'}</div></div><div class="muted">Requested by ${esc(x.requested_by_name||'Employee')}<br>${esc(x.requested_at)}</div></div>`).join(''):'<p class="muted">No active parts requests.</p>'}async function add(){const r=await fetch('/api/v2/repair-orders/'+ro.value+'/parts-requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({description:description.value,quantity:Number(qty.value)})}),d=await r.json();if(!r.ok)return alert(d.error||'Unable to request part');description.value='';qty.value=1;load()}async function update(id,status,vendor,eta){const r=await fetch('/api/v2/parts-requests/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,vendor,eta})}),d=await r.json();if(!r.ok)alert(d.error||'Unable to update');load()}load();setInterval(load,60000);</script></body></html>
