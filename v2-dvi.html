<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 DVI</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090c0f;color:#eee;font:14px Arial,sans-serif}header,.wrap{padding:20px;max-width:1240px;margin:auto}header{max-width:none;background:#101419;border-bottom:1px solid #29323a;display:flex;justify-content:space-between;gap:15px;align-items:center}.g{color:#f33}.panel{background:#11161a;border:1px solid #29323a;border-radius:10px;padding:18px;margin-top:16px}.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) auto auto;gap:10px;align-items:center}.row{display:grid;grid-template-columns:1fr 1.35fr 140px 1.8fr 110px 110px 52px;gap:8px;padding:10px 0;border-bottom:1px solid #283139}.row:last-child{border-bottom:0}input,select,textarea{box-sizing:border-box;width:100%;background:#090d10;color:#fff;border:1px solid #35404a;border-radius:6px;padding:10px}textarea{min-height:42px;resize:vertical}button{background:#e53228;color:#fff;border:0;border-radius:6px;padding:11px 16px;font-weight:bold;cursor:pointer}button.secondary{background:#27313a}button.danger{background:#55201d;padding:8px}button:disabled{opacity:.5;cursor:not-allowed}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.summary b{padding:12px 16px;border-radius:7px}.green{background:#153c29}.yellow{background:#4b3d10}.red{background:#4b1919}.total{background:#24313d}.muted{color:#9eabb5}.notice{margin-left:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hidden{display:none}.sent{border-color:#276b43}.error{color:#ff8d87}.ok{color:#82e3a7}@media(max-width:850px){header{align-items:flex-start;flex-direction:column}.toolbar,.row,.summary{grid-template-columns:1fr}.notice{margin:8px 0 0}.row{padding:14px 0}.actions button{width:100%}}
</style></head><body>
<header><div><b class="g">G</b> <b>GARAVEX V2 · DIGITAL VEHICLE INSPECTION</b></div><div class="muted">Technician inspection workflow</div></header>
<main class="wrap">
 <div class="panel"><div class="toolbar"><input id="ro" inputmode="numeric" placeholder="Repair Order #"><button id="startBtn" onclick="startInspection()">Start Inspection</button><button class="secondary" onclick="resetInspection()">New / Reset</button></div><div id="status" class="notice muted">Enter a repair order number to begin.</div></div>
 <div class="summary"><b class="green">GREEN <span id="gc">0</span></b><b class="yellow">YELLOW <span id="yc">0</span></b><b class="red">RED <span id="rc">0</span></b><b class="total">EST. <span id="total">$0.00</span></b></div>
 <div id="inspectionPanel" class="panel"><h2>Inspection Findings</h2><p class="muted">Mark each item green, yellow, or red. Yellow/red recommendations can include estimated parts and labor for customer review.</p><div id="items"></div><div class="actions"><button class="secondary" id="addBtn" onclick="addRow()" disabled>+ Add Item</button><button id="saveBtn" onclick="saveInspection()" disabled>Save Inspection</button><button id="sendBtn" onclick="sendInspection()" disabled>Send to Customer</button></div></div>
</main>
<script>
let iid=null,saved=false,sent=false,busy=false;
const $=id=>document.getElementById(id);
async function api(u,o={}){const r=await fetch(u,{credentials:'same-origin',...o});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||`Request failed (${r.status})`);return d}
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(n){return '$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function setStatus(text,type='muted'){const s=$('status');s.textContent=text;s.className='notice '+type}
function setBusy(value){busy=value;['startBtn','addBtn','saveBtn','sendBtn'].forEach(id=>{const el=$(id);if(el)el.disabled=value||(!iid&&id!=='startBtn')||sent})}
function addRow(name='',category='Inspection',condition='green',notes='',parts=0,labor=0){if(!iid||sent)return;const d=document.createElement('div');d.className='row';d.innerHTML=`<input class="cat" maxlength="120" value="${esc(category)}" placeholder="Category"><input class="name" maxlength="250" value="${esc(name)}" placeholder="Item"><select class="cond"><option value="green">Green</option><option value="yellow">Yellow</option><option value="red">Red</option></select><textarea class="notes" maxlength="2000" placeholder="Finding / recommendation">${esc(notes)}</textarea><input class="parts" type="number" min="0" max="1000000" step="0.01" value="${parts||''}" placeholder="Parts $"><input class="labor" type="number" min="0" max="1000000" step="0.01" value="${labor||''}" placeholder="Labor $"><button class="danger" type="button" title="Remove" onclick="this.parentElement.remove();dirty();counts()">×</button>`;d.querySelector('.cond').value=condition;d.querySelectorAll('input,select,textarea').forEach(x=>x.addEventListener('input',dirty));$('items').appendChild(d);counts()}
function dirty(){if(!iid||sent)return;saved=false;$('sendBtn').disabled=true;setStatus(`Inspection #${iid} has unsaved changes.`,'muted');counts()}
function counts(){const rows=[...document.querySelectorAll('.row')];for(const c of ['green','yellow','red'])$(c[0]+'c').textContent=rows.filter(r=>r.querySelector('.cond').value===c).length;const t=rows.reduce((n,r)=>n+(Number(r.querySelector('.parts').value)||0)+(Number(r.querySelector('.labor').value)||0),0);$('total').textContent=money(t)}
function resetInspection(){iid=null;saved=false;sent=false;$('ro').value='';$('items').innerHTML='';setStatus('Enter a repair order number to begin.');setBusy(false);$('addBtn').disabled=true;$('saveBtn').disabled=true;$('sendBtn').disabled=true;counts()}
async function startInspection(){if(busy)return;const roId=Number($('ro').value);if(!Number.isInteger(roId)||roId<=0)return setStatus('Enter a valid repair order number.','error');try{setBusy(true);setStatus('Starting inspection…');const d=await api('/api/v2/dvi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({repair_order_id:roId})});iid=d.id;saved=false;sent=false;$('items').innerHTML='';['Tires','Front Brakes','Rear Brakes','Engine Oil / Fluids','Battery / Charging','Exterior Lights','Steering / Suspension'].forEach(name=>addRow(name));setStatus(`Inspection #${iid} started. Complete the findings and save.`,'ok')}catch(e){setStatus(e.message,'error')}finally{setBusy(false)}}
async function saveInspection(){if(!iid||busy||sent)return;const rows=[...document.querySelectorAll('.row')];if(!rows.length)return setStatus('Add at least one inspection item.','error');for(const r of rows)if(!r.querySelector('.name').value.trim())return setStatus('Every inspection row needs an item name.','error');try{setBusy(true);setStatus('Saving inspection…');for(let i=0;i<rows.length;i++){const r=rows[i];await api(`/api/v2/dvi/${iid}/items`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:r.querySelector('.cat').value,item_name:r.querySelector('.name').value,condition:r.querySelector('.cond').value,notes:r.querySelector('.notes').value,recommendation:r.querySelector('.notes').value,parts:Number(r.querySelector('.parts').value)||0,labor:Number(r.querySelector('.labor').value)||0,sort_order:i})})}saved=true;setStatus(`Inspection #${iid} saved. It is ready to send to the customer.`,'ok')}catch(e){setStatus(e.message,'error')}finally{setBusy(false);$('sendBtn').disabled=!saved||sent}}
async function sendInspection(){if(!iid||!saved||busy||sent)return;try{setBusy(true);setStatus('Securing customer review link…');const d=await api(`/api/v2/dvi/${iid}/send`,{method:'POST'});sent=true;document.querySelectorAll('.row input,.row select,.row textarea,.row button').forEach(x=>x.disabled=true);$('inspectionPanel').classList.add('sent');setStatus(`Inspection #${iid} sent and locked for customer review.`,'ok');if(d.customer_url){const a=document.createElement('a');a.href=d.customer_url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=' Open customer review';a.style.marginLeft='8px';$('status').appendChild(a)}}catch(e){setStatus(e.message,'error')}finally{setBusy(false);$('addBtn').disabled=sent;$('saveBtn').disabled=sent;$('sendBtn').disabled=true}}
resetInspection();
</script></body></html>
