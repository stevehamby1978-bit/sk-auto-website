<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 DVI</title><style>body{margin:0;background:#090c0f;color:#eee;font:14px Arial}header,.wrap{padding:20px;max-width:1200px;margin:auto}header{max-width:none;background:#101419;border-bottom:1px solid #29323a}.g{color:#f33}.panel{background:#11161a;border:1px solid #29323a;border-radius:10px;padding:18px;margin-top:16px}.row{display:grid;grid-template-columns:1fr 1fr 140px 2fr 100px 100px;gap:8px;padding:10px 0;border-bottom:1px solid #283139}input,select,textarea{box-sizing:border-box;width:100%;background:#090d10;color:#fff;border:1px solid #35404a;border-radius:6px;padding:10px}button{background:#e53228;color:#fff;border:0;border-radius:6px;padding:11px 16px;font-weight:bold}.summary{display:flex;gap:10px;margin:15px 0}.summary b{padding:10px 16px;border-radius:7px}.green{background:#153c29}.yellow{background:#4b3d10}.red{background:#4b1919}@media(max-width:800px){.row{grid-template-columns:1fr}}</style></head><body><header><b class="g">G</b> <b>GARAVEX V2 · DIGITAL VEHICLE INSPECTION</b></header><main class="wrap"><div class="panel"><input id="ro" placeholder="Repair Order #"><button onclick="start()">Start Inspection</button><span id="status"></span></div><div class="summary"><b class="green">GREEN <span id="gc">0</span></b><b class="yellow">YELLOW <span id="yc">0</span></b><b class="red">RED <span id="rc">0</span></b></div><div class="panel"><h2>Inspection Findings</h2><div id="items"></div><button onclick="addRow()">+ Add Item</button> <button onclick="save()">Save</button> <button onclick="send()">Send to Customer</button></div></main><script>let iid=null;async function api(u,o){const r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function addRow(name=''){let d=document.createElement('div');d.className='row';d.innerHTML=`<input class="cat" value="Inspection"><input class="name" value="${name}" placeholder="Item"><select class="cond" onchange="counts()"><option value="green">Green</option><option value="yellow">Yellow</option><option value="red">Red</option></select><textarea class="notes" placeholder="Finding / recommendation"></textarea><input class="parts" type="number" placeholder="Parts $"><input class="labor" type="number" placeholder="Labor $">`;items.appendChild(d);counts()}function counts(){['green','yellow','red'].forEach(c=>document.getElementById(c[0]+'c').textContent=[...document.querySelectorAll('.cond')].filter(x=>x.value===c).length)}async function start(){try{let d=await api('/api/v2/dvi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({repair_order_id:+ro.value})});iid=d.id;status.textContent=' Inspection #'+iid;items.innerHTML='';['Tires','Brakes','Fluids','Battery','Lights','Suspension'].forEach(addRow)}catch(e){alert(e.message)}}async function save(){if(!iid)return alert('Start inspection first');for(const r of document.querySelectorAll('.row'))await api('/api/v2/dvi/'+iid+'/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:r.querySelector('.cat').value,item_name:r.querySelector('.name').value,condition:r.querySelector('.cond').value,notes:r.querySelector('.notes').value,recommendation:r.querySelector('.notes').value,parts:+r.querySelector('.parts').value||0,labor:+r.querySelector('.labor').value||0})});status.textContent=' Saved'}async function send(){if(!iid)return alert('Start inspection first');await api('/api/v2/dvi/'+iid+'/send',{method:'POST'});status.textContent=' Ready for customer review'}addRow()</script></body></html>
