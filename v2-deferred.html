<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Deferred Services</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:end}.muted{color:#89959e}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px}.metric b{display:block;font-size:28px;margin-top:7px}.filters{display:flex;gap:8px;margin:14px 0}.filters button{background:#151b20;color:#bbb;border:1px solid #303942;border-radius:7px;padding:9px 12px;cursor:pointer}.filters button.active{background:#df3329;color:white;border-color:#df3329}.row{display:grid;grid-template-columns:1.3fr 1.6fr .7fr .8fr 1fr;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #283139}.row select,.row input{background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:6px;padding:9px;width:100%}.money{font-weight:bold}.empty{padding:30px;text-align:center;color:#89959e}@media(max-width:760px){.metrics{grid-template-columns:1fr}.row{display:block}.row>*{margin:7px 0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><div class="top"><div><h1>Deferred Service Recovery</h1><div class="muted">Turn declined work into future appointments instead of losing it.</div></div></div><section class="metrics" id="metrics"></section><div class="filters"><button class="active" data-filter="open">Open</button><button data-filter="deferred">Deferred</button><button data-filter="scheduled">Scheduled</button><button data-filter="all">All</button></div><section class="card"><div class="row muted"><b>Customer / Vehicle</b><b>Recommendation</b><b>Value</b><b>Follow-up</b><b>Status</b></div><div id="rows"></div></section></main><script>let data=[],filter='open';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'$'+Number(n||0).toFixed(2);async function api(u,o){const r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function render(){const open=data.filter(x=>['deferred','scheduled'].includes(x.status)),due=open.filter(x=>x.follow_up_date&&x.follow_up_date<=new Date().toISOString().slice(0,10)),value=open.reduce((s,x)=>s+Number(x.estimated_total||0),0);metrics.innerHTML=[['Open Opportunities',open.length],['Follow-ups Due',due.length],['Recoverable Value',money(value)]].map(x=>`<div class="card metric"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');const show=data.filter(x=>filter==='all'||filter==='open'&&['deferred','scheduled'].includes(x.status)||x.status===filter);rows.innerHTML=show.length?show.map(x=>`<div class="row"><div><b>${esc(x.customer_name)}</b><div class="muted">${esc([x.year,x.make,x.model].filter(Boolean).join(' '))}</div></div><div>${esc(x.description)}</div><div class="money">${money(x.estimated_total)}</div><div><input type="date" value="${esc(x.follow_up_date||'')}" onchange="save(${x.id},null,this.value)"></div><div><select onchange="save(${x.id},this.value,null)"><option value="deferred" ${x.status==='deferred'?'selected':''}>Deferred</option><option value="scheduled" ${x.status==='scheduled'?'selected':''}>Scheduled</option><option value="completed" ${x.status==='completed'?'selected':''}>Completed</option><option value="dismissed" ${x.status==='dismissed'?'selected':''}>Dismissed</option></select></div></div>`).join(''):'<div class="empty">No deferred services in this view.</div>'}async function save(id,status,date){const current=data.find(x=>x.id===id);try{await api('/api/v2/deferred/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:status||current.status,follow_up_date:date===null?current.follow_up_date:date})});await load()}catch(e){alert(e.message)}}async function load(){try{data=await api('/api/v2/deferred');render()}catch(e){rows.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});load();</script></body></html>
