<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Purchasing</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:24px}.muted{color:#89959e}.grid{display:grid;grid-template-columns:.9fr 1.6fr;gap:14px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin-bottom:14px}input,select,textarea{width:100%;padding:10px;margin:5px 0;background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px}textarea{min-height:82px;resize:vertical}.btn{background:#df3329;color:#fff;border:0;padding:10px 14px;border-radius:7px;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.55}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.metric{background:#10151a;border:1px solid #29323a;border-radius:10px;padding:14px}.metric b{display:block;font-size:23px;margin-top:5px}.row{border-bottom:1px solid #283139;padding:13px 0}.row:last-child{border-bottom:0}.pohead{display:flex;justify-content:space-between;gap:10px;align-items:center}.status{font-size:11px;text-transform:uppercase;font-weight:bold}.draft{color:#9aa5ad}.ordered{color:#69a9ff}.partial{color:#f2b84b}.received{color:#58c87b}.cancelled{color:#ff655d}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px}.msg{min-height:18px;margin-top:8px}.ok{color:#58c87b}.error{color:#ff655d}@media(max-width:800px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}@media(max-width:500px){.summary,.toolbar{display:block}.metric{margin:8px 0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Parts Purchasing</h1><p class="muted">Vendor management and purchase orders tied to repair orders.</p><section class="summary"><div class="metric"><span class="muted">Vendors</span><b id="vendorCount">0</b></div><div class="metric"><span class="muted">Open POs</span><b id="openCount">0</b></div><div class="metric"><span class="muted">Ordered</span><b id="orderedCount">0</b></div><div class="metric"><span class="muted">Partial</span><b id="partialCount">0</b></div></section><div class="grid"><div><section class="card"><h2>Add Vendor</h2><input id="vname" maxlength="300" placeholder="Vendor name"><input id="vphone" maxlength="100" placeholder="Phone"><input id="vemail" maxlength="300" type="email" placeholder="Email"><button id="vendorBtn" class="btn" onclick="addVendor()">Add Vendor</button><div id="vendorMsg" class="msg muted"></div></section><section class="card"><h2>Vendors</h2><input id="vendorSearch" placeholder="Search vendors" oninput="renderVendors()"><div id="vendors"></div></section></div><div><section class="card"><h2>Create Purchase Order</h2><select id="vendor"><option value="">No vendor</option></select><input id="ro" type="number" min="1" placeholder="Repair order # (optional)"><textarea id="notes" maxlength="2000" placeholder="PO notes"></textarea><button id="poBtn" class="btn" onclick="createPO()">Create Purchase Order</button><div id="poMsg" class="msg muted"></div></section><section class="card"><div class="toolbar"><input id="poSearch" placeholder="Search PO number, vendor or RO" oninput="renderPOs()"><select id="statusFilter" onchange="renderPOs()"><option value="">All statuses</option><option value="draft">Draft</option><option value="ordered">Ordered</option><option value="partial">Partial</option><option value="received">Received</option><option value="cancelled">Cancelled</option></select></div><div id="pos"></div></section></div></div></main><script>
let vendorData=[],poData=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o){const r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function msg(el,text,type='muted'){el.className='msg '+type;el.textContent=text||''}function metrics(){vendorCount.textContent=vendorData.length;openCount.textContent=poData.filter(p=>!['received','cancelled'].includes(String(p.status))).length;orderedCount.textContent=poData.filter(p=>p.status==='ordered').length;partialCount.textContent=poData.filter(p=>p.status==='partial').length}function renderVendors(){const q=vendorSearch.value.trim().toLowerCase(),data=vendorData.filter(v=>!q||[v.name,v.phone,v.email].some(x=>String(x||'').toLowerCase().includes(q)));vendors.innerHTML=data.length?data.map(v=>`<div class="row"><b>${esc(v.name)}</b><div class="muted">${esc(v.phone||'No phone')}${v.email?' · '+esc(v.email):''}</div></div>`).join(''):'<div class="muted">No vendors match this view.</div>';const selected=vendor.value;vendor.innerHTML='<option value="">No vendor</option>'+vendorData.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('');if([...vendor.options].some(o=>o.value===selected))vendor.value=selected}function renderPOs(){const q=poSearch.value.trim().toLowerCase(),sf=statusFilter.value;const data=poData.filter(p=>(!sf||p.status===sf)&&(!q||[p.po_number,p.vendor_name,p.repair_order_id].some(x=>String(x||'').toLowerCase().includes(q))));pos.innerHTML=data.length?data.map(p=>`<div class="row"><div class="pohead"><div><b>${esc(p.po_number)}</b> · ${esc(p.vendor_name||'No vendor')}</div><span class="status ${esc(p.status)}">${esc(p.status)}</span></div><div class="muted">${p.repair_order_id?'RO #'+esc(p.repair_order_id):'Not tied to an RO'}${p.notes?' · '+esc(p.notes):''}</div><select aria-label="Change PO status" onchange="statusPO(${p.id},this.value)"><option value="">Change status…</option><option value="ordered">Ordered</option><option value="partial">Partial</option><option value="received">Received</option><option value="cancelled">Cancelled</option></select></div>`).join(''):'<div class="muted" style="padding:12px 0">No purchase orders match this view.</div>'}async function load(){try{[vendorData,poData]=await Promise.all([api('/api/v2/vendors'),api('/api/v2/purchase-orders')]);metrics();renderVendors();renderPOs()}catch(e){msg(poMsg,e.message,'error')}}async function addVendor(){const name=vname.value.trim(),email=vemail.value.trim();if(!name)return msg(vendorMsg,'Vendor name is required.','error');if(email&&!vemail.checkValidity())return msg(vendorMsg,'Enter a valid email address.','error');vendorBtn.disabled=true;msg(vendorMsg,'Saving…');try{await api('/api/v2/vendors',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone:vphone.value.trim(),email})});vname.value=vphone.value=vemail.value='';msg(vendorMsg,'Vendor added.','ok');await load()}catch(e){msg(vendorMsg,e.message,'error')}finally{vendorBtn.disabled=false}}async function createPO(){const roValue=ro.value.trim();if(roValue&&(!Number.isInteger(Number(roValue))||Number(roValue)<1))return msg(poMsg,'Enter a valid repair order number.','error');poBtn.disabled=true;msg(poMsg,'Creating…');try{const d=await api('/api/v2/purchase-orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({vendor_id:vendor.value||null,repair_order_id:roValue||null,notes:notes.value.trim()})});ro.value=notes.value='';msg(poMsg,'Created '+d.po_number+'.','ok');await load()}catch(e){msg(poMsg,e.message,'error')}finally{poBtn.disabled=false}}async function statusPO(id,status){if(!status)return;msg(poMsg,'Updating…');try{await api('/api/v2/purchase-orders/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});msg(poMsg,'Purchase order updated.','ok');await load()}catch(e){msg(poMsg,e.message,'error');await load()}}load();setInterval(load,60000);
</script></body></html>
