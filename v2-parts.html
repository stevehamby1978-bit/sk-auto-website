<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Parts Purchasing</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f5f6f7;font:14px Arial}.wrap{max-width:1200px;margin:auto;padding:25px}a{color:#ddd}.grid{display:grid;grid-template-columns:1fr 2fr;gap:14px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px}input,select,textarea{width:100%;padding:10px;margin:5px 0;background:#0b0f12;color:white;border:1px solid #303942;border-radius:6px}.btn{background:#df3329;color:white;border:0;padding:11px 14px;border-radius:6px;font-weight:bold;cursor:pointer}.row{border-bottom:1px solid #283139;padding:12px 0}.muted{color:#89959e}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="v2-dashboard.html">← V2 Operations</a><h1>Parts Purchasing</h1><div class="grid"><section class="card"><h2>Add Vendor</h2><input id="vname" placeholder="Vendor name"><input id="vphone" placeholder="Phone"><input id="vemail" placeholder="Email"><button class="btn" onclick="addVendor()">Add Vendor</button><h2>Vendors</h2><div id="vendors"></div></section><section class="card"><h2>Create Purchase Order</h2><select id="vendor"></select><input id="ro" type="number" placeholder="Repair order # (optional)"><textarea id="notes" placeholder="PO notes"></textarea><button class="btn" onclick="createPO()">Create Purchase Order</button><h2>Purchase Orders</h2><div id="pos"></div></section></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o){const r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){const vs=await api('/api/v2/vendors');vendors.innerHTML=vs.map(v=>`<div class="row"><b>${esc(v.name)}</b><div class="muted">${esc(v.phone||'')} ${esc(v.email||'')}</div></div>`).join('')||'<div class="muted">No vendors.</div>';vendor.innerHTML='<option value="">No vendor</option>'+vs.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('');const ps=await api('/api/v2/purchase-orders');pos.innerHTML=ps.map(p=>`<div class="row"><b>${esc(p.po_number)}</b> · ${esc(p.vendor_name||'No vendor')} <span class="muted">${esc(p.status)}</span>${p.repair_order_id?` · RO #${p.repair_order_id}`:''}<div><select onchange="statusPO(${p.id},this.value)"><option>Change status…</option><option value="ordered">Ordered</option><option value="partial">Partial</option><option value="received">Received</option><option value="cancelled">Cancelled</option></select></div></div>`).join('')||'<div class="muted">No purchase orders.</div>'}async function addVendor(){try{await api('/api/v2/vendors',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:vname.value,phone:vphone.value,email:vemail.value})});vname.value=vphone.value=vemail.value='';load()}catch(e){alert(e.message)}}async function createPO(){try{const d=await api('/api/v2/purchase-orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({vendor_id:vendor.value,repair_order_id:ro.value,notes:notes.value})});alert('Created '+d.po_number);ro.value=notes.value='';load()}catch(e){alert(e.message)}}async function statusPO(id,status){if(status==='Change status…')return;try{await api('/api/v2/purchase-orders/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}catch(e){alert(e.message)}}load();</script></body></html>
