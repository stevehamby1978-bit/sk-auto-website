<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Reports</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:26px}.muted{color:#89959e}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:19px}.card small{color:#89959e}.card strong{display:block;font-size:28px;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;padding:11px 0;border-bottom:1px solid #283139}.bar{height:9px;background:#242c32;border-radius:20px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#df3329}.good{color:#58c87b}@media(max-width:800px){.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.row{grid-template-columns:1.5fr 1fr 1fr}}</style></head><body><main class="wrap"><a style="color:#ddd" href="v2-dashboard.html">← V2 Operations</a><h1>Owner Reports</h1><p class="muted">Profitability, technician utilization and work waiting to be recovered.</p><section class="metrics" id="metrics"></section><section class="grid"><div class="card"><h2>Technician Performance</h2><div class="row muted"><b>Technician</b><b>Jobs</b><b>Actual</b><b>Billed</b></div><div id="techs"></div></div><div class="card"><h2>Deferred Opportunity</h2><div id="deferred"></div></div></section></main><script>const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u){const r=await fetch(u),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load report');return d}async function load(){try{const p=await api('/api/v2/profitability');metrics.innerHTML=[['Sales',money(p.sales)],['Gross Profit',money(p.gross_profit)],['Gross Margin',Number(p.gross_margin||0).toFixed(1)+'%'],['Parts Profit',money(Number(p.parts_sales)-Number(p.parts_cost))]].map(x=>`<div class="card"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');const t=await api('/api/v2/technician-performance');techs.innerHTML=t.map(x=>`<div class="row"><b>${esc(x.name)}</b><span>${x.jobs}</span><span>${(Number(x.actual_minutes)/60).toFixed(1)}h</span><span>${Number(x.billed_hours||0).toFixed(1)}h</span></div>`).join('')||'<p class="muted">No technician time recorded yet.</p>';const d=await api('/api/v2/deferred'),open=d.filter(x=>x.status==='deferred'||x.status==='scheduled'),total=open.reduce((s,x)=>s+Number(x.estimated_total||0),0);deferred.innerHTML=`<strong style="font-size:28px">${money(total)}</strong><p class="muted">open recommended work</p>`+open.slice(0,12).map(x=>`<div style="padding:10px 0;border-bottom:1px solid #283139"><b>${esc(x.customer_name)}</b><div>${esc(x.description)}</div><span class="good">${money(x.estimated_total)}</span></div>`).join('')}catch(e){document.body.insertAdjacentHTML('beforeend','<p>'+esc(e.message)+'</p>')}}load();</script></body></html>
