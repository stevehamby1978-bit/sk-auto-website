<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Audit History</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px}.muted{color:#89959e}.toolbar{display:flex;gap:8px;margin:18px 0}.toolbar input{flex:1;background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:11px}.row{display:grid;grid-template-columns:1fr 1.2fr 1fr 2fr;gap:12px;padding:12px 0;border-bottom:1px solid #283139}.tag{display:inline-block;background:#252d34;padding:4px 8px;border-radius:20px;font-size:11px}@media(max-width:700px){.row{display:block}.row>*{margin:5px 0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Audit History</h1><p class="muted">Owner visibility into important V2 changes made by the team.</p><div class="toolbar"><input id="search" placeholder="Filter by employee, action or record…"></div><section class="card"><div class="row muted"><b>When / Employee</b><b>Action</b><b>Record</b><b>Details</b></div><div id="rows">Loading…</div></section></main><script>let data=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=search.value.trim().toLowerCase(),show=data.filter(x=>!q||[x.employee_name,x.action,x.entity_type,x.entity_id,x.details].some(v=>String(v??'').toLowerCase().includes(q)));rows.innerHTML=show.length?show.map(x=>`<div class="row"><div>${esc(x.created_at)}<div class="muted">${esc(x.employee_name||'System')}</div></div><div><span class="tag">${esc(x.action)}</span></div><div>${esc(x.entity_type||'—')} ${x.entity_id?'#'+x.entity_id:''}</div><div class="muted">${esc(x.details||'')}</div></div>`).join(''):'<div style="padding:25px" class="muted">No matching audit events.</div>'}async function load(){const r=await fetch('/api/v2/audit'),d=await r.json();if(!r.ok){rows.textContent=d.error||'Unable to load audit history';return}data=d;render()}search.oninput=render;load();</script></body></html>
