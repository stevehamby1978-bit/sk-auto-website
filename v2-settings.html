<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Shop Setup</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1100px;margin:auto;padding:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:20px}input,textarea{width:100%;padding:11px;margin:6px 0;background:#0b0f12;color:white;border:1px solid #303942;border-radius:6px}.btn{background:#df3329;color:#fff;border:0;border-radius:6px;padding:11px 15px;font-weight:bold}.row{padding:11px 0;border-bottom:1px solid #29323a}.muted{color:#89959e}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a style="color:#ddd" href="v2-dashboard.html">← V2 Operations</a><h1>V2 Shop Configuration</h1><div class="grid"><section class="card"><h2>Pricing Defaults</h2><label>Default labor rate</label><input id="labor" type="number" step=".01"><label>Default parts markup %</label><input id="markup" type="number" step=".01"><button class="btn" onclick="saveSettings()">Save Shop Defaults</button><p class="muted">Used by V2 estimating, profitability and canned services.</p></section><section class="card"><h2>Create Canned Job</h2><input id="name" placeholder="Job name"><input id="category" placeholder="Category"><textarea id="description" placeholder="Description"></textarea><input id="hours" type="number" step=".1" placeholder="Labor hours"><input id="parts" type="number" step=".01" placeholder="Parts price"><button class="btn" onclick="addJob()">Add Canned Job</button></section></div><section class="card" style="margin-top:14px"><h2>Canned Jobs</h2><div id="jobs">Loading…</div></section></main><script>async function api(u,o){const r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const s=await api('/api/v2/settings');labor.value=s.default_labor_rate||0;markup.value=s.parts_markup_percent||0;const j=await api('/api/v2/canned-jobs');jobs.innerHTML=j.map(x=>`<div class="row"><b>${esc(x.name)}</b> · ${esc(x.category||'General')}<div class="muted">${Number(x.labor_hours||0).toFixed(1)} hr · $${Number(x.parts_price||0).toFixed(2)} parts</div></div>`).join('')||'<div class="muted">No canned jobs yet.</div>'}async function saveSettings(){try{await api('/api/v2/settings',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({default_labor_rate:labor.value,parts_markup_percent:markup.value})});alert('Saved')}catch(e){alert(e.message)}}async function addJob(){try{await api('/api/v2/canned-jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,category:category.value,description:description.value,labor_hours:hours.value,parts_price:parts.value})});name.value=category.value=description.value=hours.value=parts.value='';load()}catch(e){alert(e.message)}}load();</script></body></html>
