<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex Invoice</title>
<style>
body{margin:0;background:#f3f5f7;color:#1e293b;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:35px auto;padding:0 16px}.card{background:#fff;border-radius:12px;box-shadow:0 4px 18px #0001;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #e5e7eb;padding-bottom:18px}.brand h1{margin:0;font-size:28px}.muted{color:#64748b}.status{font-weight:700;padding:7px 11px;border-radius:999px;background:#fee2e2;color:#991b1b;display:inline-block}.status.paid{background:#dcfce7;color:#166534}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:22px 0}.box{background:#f8fafc;padding:15px;border-radius:8px}.table{width:100%;border-collapse:collapse;margin-top:18px}.table th,.table td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left}.table th:nth-child(n+2),.table td:nth-child(n+2){text-align:right}.totals{margin-left:auto;max-width:340px;margin-top:20px}.row{display:flex;justify-content:space-between;padding:7px 0}.grand{font-size:21px;font-weight:800;border-top:2px solid #111827;margin-top:7px;padding-top:12px}.pay{width:100%;padding:15px;border:0;border-radius:8px;background:#16a34a;color:#fff;font-size:18px;font-weight:800;cursor:pointer;margin-top:22px}.pay:disabled{opacity:.6;cursor:not-allowed}.msg{padding:12px;border-radius:8px;margin:15px 0;display:none}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}@media(max-width:650px){.top,.grid{display:block}.top>div+div,.grid>.box+ .box{margin-top:15px}.card{padding:18px}}
</style></head><body><div class="wrap"><div class="card"><div id="message" class="msg"></div><div class="top"><div class="brand"><h1 id="shopName">Invoice</h1><div id="shopContact" class="muted"></div></div><div><strong>Invoice <span id="invoiceNo"></span></strong><br><span id="paymentStatus" class="status">UNPAID</span></div></div><div class="grid"><div class="box"><strong>Bill To</strong><div id="customer"></div></div><div class="box"><strong>Vehicle</strong><div id="vehicle"></div></div></div><table class="table"><thead><tr><th>Description</th><th>Parts</th><th>Labor</th><th>Total</th></tr></thead><tbody id="items"></tbody></table><div class="totals"><div class="row"><span>Subtotal</span><span id="subtotal"></span></div><div class="row"><span>Tax</span><span id="tax"></span></div><div class="row grand"><span>Total</span><span id="total"></span></div><div class="row"><span>Paid</span><span id="paid"></span></div><div class="row grand"><span>Balance Due</span><span id="balance"></span></div></div><button id="payBtn" class="pay" type="button">Pay Invoice Securely</button></div></div>
<script>
const qs=new URLSearchParams(location.search); let token=qs.get('token')||''; const id=qs.get('id')||''; const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n||0));
const msg=(text,ok=false)=>{const e=document.getElementById('message');e.textContent=text;e.className='msg '+(ok?'ok':'err');e.style.display='block'};
async function resolveToken(){if(token)return token;if(!id)throw new Error('This invoice link is missing its secure token.');const r=await fetch('/api/repair-orders/'+encodeURIComponent(id)+'/invoice-token',{method:'POST'});const d=await r.json();if(!r.ok||!d.token)throw new Error(d.error||'Unable to create invoice link.');token=d.token;history.replaceState(null,'','/invoice.html?id='+encodeURIComponent(id)+'&token='+encodeURIComponent(token));return token}
async function confirmStripe(){const sid=qs.get('session_id');if(qs.get('stripe')!=='success'||!sid)return;const r=await fetch('/api/stripe/confirm-checkout-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,session_id:sid})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to verify payment.');msg('Payment received. Thank you!',true);history.replaceState(null,'','/invoice.html?token='+encodeURIComponent(token));}
async function load(){try{await resolveToken();await confirmStripe();const r=await fetch('/api/customer-invoice/'+encodeURIComponent(token),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load invoice.');const o=d.invoice,sh=o.shop||{};document.getElementById('shopName').textContent=sh.name||'Garavex Invoice';document.getElementById('shopContact').textContent=[sh.phone,sh.email,[sh.address,sh.city,sh.state,sh.zip].filter(Boolean).join(', ')].filter(Boolean).join(' • ');document.getElementById('invoiceNo').textContent='#'+o.id;document.getElementById('customer').textContent=o.customer_name||'Customer';const v=o.vehicle||{};document.getElementById('vehicle').textContent=[v.year,v.make,v.model].filter(Boolean).join(' ') + (v.vin?' • VIN '+v.vin:'');document.getElementById('items').innerHTML=(o.items||[]).map(x=>`<tr><td>${esc(x.description||'Service')}</td><td>${money(x.parts)}</td><td>${money(x.labor)}</td><td>${money(Number(x.parts||0)+Number(x.labor||0))}</td></tr>`).join('');['subtotal','tax','total','amount_paid','balance'].forEach(k=>document.getElementById(k==='amount_paid'?'paid':k).textContent=money(o[k]));const st=document.getElementById('paymentStatus');st.textContent=(o.payment_status||'unpaid').toUpperCase();if(o.payment_status==='paid'){st.classList.add('paid');document.getElementById('payBtn').style.display='none'}else if(!o.stripe_payments_enabled){const b=document.getElementById('payBtn');b.disabled=true;b.textContent='Online card payments are not enabled for this shop'} }catch(e){msg(e.message)}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('payBtn').onclick=async()=>{const b=document.getElementById('payBtn');try{b.disabled=true;b.textContent='Opening secure Stripe checkout…';const r=await fetch('/api/stripe/create-checkout-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const d=await r.json();if(!r.ok||!d.url)throw new Error(d.error||'Unable to start payment.');location.assign(d.url)}catch(e){msg(e.message);b.disabled=false;b.textContent='Pay Invoice Securely'}};load();
</script></body></html>
