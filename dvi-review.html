<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex Vehicle Inspection</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f5f7f8;font:15px Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:24px}header{padding:22px 0;border-bottom:1px solid #273039}h1{margin:8px 0}.muted{color:#8e9aa3}.vehicle{background:#10151a;border:1px solid #29323a;border-radius:12px;padding:18px;margin:22px 0}.item{background:#10151a;border:1px solid #29323a;border-left:5px solid #39b86a;border-radius:10px;padding:18px;margin:12px 0}.item.yellow{border-left-color:#e0a925}.item.red{border-left-color:#e23b32}.tag{font-size:11px;font-weight:bold;text-transform:uppercase}.price{font-size:18px;font-weight:bold}.actions{display:flex;gap:8px;margin-top:14px}.actions button{border:0;border-radius:7px;padding:10px 15px;font-weight:bold;cursor:pointer}.approve{background:#32a65d;color:white}.decline{background:#282f35;color:#ddd}.chosen{outline:2px solid white}footer{text-align:center;color:#68747c;padding:35px}</style></head><body><main class="wrap"><header><div class="muted">GARAVEX DIGITAL VEHICLE INSPECTION</div><h1 id="shop">Vehicle Inspection</h1><div id="customer" class="muted"></div></header><div class="vehicle" id="vehicle">Loading inspection…</div><section id="items"></section><footer>Powered by GARAVEX Automotive Shop Management</footer></main><script>const p=new URLSearchParams(location.search),token=p.get('token'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'$'+Number(n||0).toFixed(2);async function load(){const r=await fetch('/api/v2/public/dvi/'+encodeURIComponent(token||'')),d=await r.json();if(!r.ok){vehicle.textContent=d.error||'Inspection unavailable';return}shop.textContent=d.shop_name+' Vehicle Inspection';customer.textContent='Prepared for '+d.customer_name;vehicle.innerHTML=`<b>${esc(d.year)} ${esc(d.make)} ${esc(d.model)}</b>${d.vin?`<div class="muted">VIN ${esc(d.vin)}</div>`:''}`;items.innerHTML=d.items.map(i=>`<article class="item ${esc(i.condition)}"><div class="tag">${esc(i.category)} · ${esc(i.condition)}</div><h2>${esc(i.item_name)}</h2>${i.notes?`<p>${esc(i.notes)}</p>`:''}${i.recommendation?`<p><b>Recommendation:</b> ${esc(i.recommendation)}</p>`:''}<div class="price">${money(Number(i.parts)+Number(i.labor))}</div>${i.condition==='green'&&!i.recommendation?'':`<div class="actions"><button class="approve ${i.customer_decision==='approved'?'chosen':''}" onclick="decide(${i.id},'approved')">Approve</button><button class="decline ${i.customer_decision==='declined'?'chosen':''}" onclick="decide(${i.id},'declined')">Decline / Defer</button></div>`}</article>`).join('')}async function decide(id,decision){const r=await fetch(`/api/v2/public/dvi/${encodeURIComponent(token)}/items/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision})}),d=await r.json();if(!r.ok)return alert(d.error||'Unable to save');load()}load();</script></body></html>
