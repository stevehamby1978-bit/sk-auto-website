<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Garavex Vehicle Inspection</title><style>
*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f5f7f8;font:15px Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:24px}header{padding:22px 0;border-bottom:1px solid #273039}h1{margin:8px 0}.muted{color:#8e9aa3}.vehicle,.notice{background:#10151a;border:1px solid #29323a;border-radius:12px;padding:18px;margin:22px 0}.item{background:#10151a;border:1px solid #29323a;border-left:5px solid #39b86a;border-radius:10px;padding:18px;margin:12px 0}.item.yellow{border-left-color:#e0a925}.item.red{border-left-color:#e23b32}.tag{font-size:11px;font-weight:bold;text-transform:uppercase}.price{font-size:18px;font-weight:bold}.actions{display:flex;gap:8px;margin-top:14px}.actions button{border:0;border-radius:7px;padding:10px 15px;font-weight:bold;cursor:pointer}.actions button:disabled{opacity:.55;cursor:not-allowed}.approve{background:#32a65d;color:white}.decline{background:#282f35;color:#ddd}.chosen{outline:2px solid white}.decision{margin-top:12px;font-weight:bold}.error{border-color:#71302c;color:#ffaaa4}.ok{border-color:#276b43;color:#9ce8b7}footer{text-align:center;color:#68747c;padding:35px}@media(max-width:600px){.wrap{padding:16px}.actions{flex-direction:column}.actions button{width:100%}}</style></head><body><main class="wrap"><header><div class="muted">GARAVEX DIGITAL VEHICLE INSPECTION</div><h1 id="shop">Vehicle Inspection</h1><div id="customer" class="muted"></div></header><div class="vehicle" id="vehicle">Loading inspection…</div><div id="notice" class="notice hidden" hidden></div><section id="items"></section><footer>Powered by GARAVEX Automotive Shop Management</footer></main><script>(()=>{'use strict';const p=new URLSearchParams(location.search),token=String(p.get('token')||'').trim().toLowerCase(),shop=document.getElementById('shop'),customer=document.getElementById('customer'),vehicle=document.getElementById('vehicle'),items=document.getElementById('items'),notice=document.getElementById('notice'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>{const v=Number(n);return Number.isFinite(v)?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(v):'$0.00'};let locked=false;function showNotice(text,type=''){notice.hidden=false;notice.textContent=text;notice.className='notice '+type}function unavailable(text){vehicle.textContent=text||'This inspection is unavailable or no longer accepting decisions.';items.innerHTML='';showNotice('Please contact your repair shop if you need a new inspection link.','error')}async function request(url,options={}){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...options});let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d.error||'Unable to complete request.');e.status=r.status;throw e}return d}function render(d){shop.textContent=String(d.shop_name||'Repair Shop')+' Vehicle Inspection';customer.textContent=d.customer_name?'Prepared for '+String(d.customer_name):'';const title=[d.year,d.make,d.model].filter(Boolean).map(esc).join(' ');vehicle.innerHTML=`<b>${title||'Vehicle'}</b>${d.vin?`<div class="muted">VIN ${esc(d.vin)}</div>`:''}`;const rows=Array.isArray(d.items)?d.items:[];items.innerHTML=rows.map(i=>{const condition=['green','yellow','red'].includes(String(i.condition).toLowerCase())?String(i.condition).toLowerCase():'green',decision=String(i.customer_decision||'pending').toLowerCase(),actionable=condition!=='green'||Boolean(i.recommendation),decided=decision==='approved'||decision==='declined';return `<article class="item ${condition}"><div class="tag">${esc(i.category)} · ${esc(condition)}</div><h2>${esc(i.item_name)}</h2>${i.notes?`<p>${esc(i.notes)}</p>`:''}${i.recommendation?`<p><b>Recommendation:</b> ${esc(i.recommendation)}</p>`:''}<div class="price">${money((Number(i.parts)||0)+(Number(i.labor)||0))}</div>${actionable?`<div class="actions"><button class="approve ${decision==='approved'?'chosen':''}" data-id="${Number(i.id)}" data-decision="approved" ${decided?'disabled':''}>${decision==='approved'?'Approved ✓':'Approve'}</button><button class="decline ${decision==='declined'?'chosen':''}" data-id="${Number(i.id)}" data-decision="declined" ${decided?'disabled':''}>${decision==='declined'?'Deferred ✓':'Decline / Defer'}</button></div>${decided?`<div class="decision">Decision recorded: ${decision==='approved'?'Approved':'Deferred'}</div>`:''}`:''}</article>`}).join('')||'<div class="notice">No inspection items are available.</div>';items.querySelectorAll('button[data-id]').forEach(b=>b.addEventListener('click',()=>decide(Number(b.dataset.id),b.dataset.decision)));const pending=rows.filter(i=>{const c=String(i.condition).toLowerCase(),decision=String(i.customer_decision||'pending').toLowerCase();return (c!=='green'||Boolean(i.recommendation))&&!['approved','declined'].includes(decision)}).length;if(pending===0&&rows.length)showNotice('Your inspection decisions are complete. Thank you.','ok')}async function load(){if(!/^[a-f0-9]{64}$/.test(token)){unavailable('This inspection link is invalid.');return}try{const d=await request('/api/v2/public/dvi/'+encodeURIComponent(token));render(d);try{history.replaceState(null,'',location.pathname)}catch{}}catch(e){unavailable(e.message)}}async function decide(id,decision){if(locked||!Number.isInteger(id)||id<=0)return;locked=true;const buttons=[...items.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);showNotice(decision==='approved'?'Saving approval…':'Saving deferred decision…');try{const d=await request(`/api/v2/public/dvi/${encodeURIComponent(token)}/items/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision})});if(d.inspection_completed)showNotice('All inspection decisions have been recorded. Thank you.','ok');else showNotice('Your decision was saved.','ok');await load()}catch(e){if(e.status===409)showNotice('This item already has a recorded decision. Reloading the inspection…','error');else showNotice(e.message,'error');try{await load()}catch{}}finally{locked=false}}load()})();</script></body></html>
