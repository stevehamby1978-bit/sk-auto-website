<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Customer Contact</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:12px 0}.muted{color:#89959e}.form{display:grid;grid-template-columns:90px 120px 110px 1fr auto;gap:8px}input,select{background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:10px}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:bold}.resolve{background:#246c3b}.row{display:grid;grid-template-columns:120px 1fr 120px;gap:12px;padding:14px 0;border-bottom:1px solid #29323a}.urgent{color:#ff655d}.high{color:#f2b84b}.tag{text-transform:uppercase;font-size:11px;font-weight:bold}@media(max-width:700px){.form,.row{display:block}.form>*{width:100%;margin:4px 0}.row>*{margin:7px 0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Customer Contact Queue</h1><p class="muted">Every promised callback, approval request and customer update has an ownerable place.</p><section class="card"><div class="form"><input id="ro" type="number" placeholder="RO #"><select id="type"><option>call</option><option>text</option><option>email</option><option>approval</option><option>update</option></select><select id="priority"><option>normal</option><option>high</option><option>urgent</option></select><input id="reason" placeholder="Why does the customer need contacted?"><button class="btn" onclick="add()">Add</button></div></section><section class="card"><div id="queue"></div></section></main><script>const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/v2/customer-requests'),d=await r.json();if(!r.ok)return;queue.innerHTML=d.length?d.map(x=>`<div class="row"><div><span class="tag ${e(x.priority)}">${e(x.priority)}</span><br>${e(x.request_type)}</div><div><b>${e(x.customer_name)} · RO #${x.repair_order_id}</b><div>${e([x.year,x.make,x.model].filter(Boolean).join(' '))}</div><div>${e(x.reason)}</div><div class="muted">${e(x.phone||'')} ${e(x.email||'')}</div></div><button class="btn resolve" onclick="resolve(${x.id})">Resolved</button></div>`).join(''):'<p class="muted">No customers waiting for contact.</p>'}async function add(){const r=await fetch('/api/v2/customer-requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({repair_order_id:Number(ro.value),request_type:type.value,priority:priority.value,reason:reason.value})}),d=await r.json();if(!r.ok)return alert(d.error||'Unable to add request');reason.value='';load()}async function resolve(id){const resolution=prompt('Resolution / result:','Customer contacted');if(resolution===null)return;const r=await fetch('/api/v2/customer-requests/'+id+'/resolve',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({resolution})}),d=await r.json();if(!r.ok)return alert(d.error||'Unable to resolve');load()}load();</script></body></html>
