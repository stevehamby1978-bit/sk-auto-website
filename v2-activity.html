<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Shop Activity</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px}.muted{color:#89959e}.event{display:grid;grid-template-columns:150px 180px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid #283139}.tag{display:inline-block;background:#252d34;border-radius:20px;padding:5px 9px;font-size:11px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.btn{background:#252d34;color:#fff;border:1px solid #37414a;border-radius:6px;padding:8px 11px;cursor:pointer}@media(max-width:650px){.event{display:block}.event>*{margin:5px 0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Shop Activity</h1><p class="muted">A live operational timeline of important actions inside this shop.</p><section class="card"><div class="toolbar"><span class="muted" id="stamp">Loading…</span><button class="btn" onclick="load()">Refresh</button></div><div id="events"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function summary(x){const d=x.details||{},a=x.action||'';if(a==='vehicle.checkin')return `Checked in vehicle on RO #${x.entity_id}`;if(a==='quality.approved')return `Final QC approved for RO #${x.entity_id}`;if(a==='deferred.followup_text')return `Sent deferred-service follow-up`;if(a==='comeback.create')return `Recorded comeback tied to RO #${d.original_repair_order_id||''}`;if(a==='comeback.update')return `Updated comeback to ${d.status||'new status'}`;return a.replaceAll('.',' · ').replaceAll('_',' ')}async function load(){const r=await fetch('/api/v2/activity?limit=60'),d=await r.json();if(!r.ok){events.textContent=d.error||'Unable to load activity';return}stamp.textContent='Updated '+new Date().toLocaleTimeString();events.innerHTML=d.length?d.map(x=>`<div class="event"><div class="muted">${esc(x.created_at)}</div><div><b>${esc(x.employee_name||'System')}</b><br><span class="tag">${esc(x.entity_type||'activity')}</span></div><div>${esc(summary(x))}</div></div>`).join(''):'<div class="muted" style="padding:20px">No V2 activity recorded yet.</div>'}load();setInterval(load,60000);</script></body></html>
