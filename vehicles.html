<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Garavex | Vehicles</title>
<style>*{box-sizing:border-box}:root{--bg:#0e1114;--panel:#171b20;--line:#323a43;--text:#f5f7f9;--muted:#aeb7c1;--accent:#ef3e23}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}.page{max-width:1200px;margin:auto;min-height:100vh}.header{background:#15191e;border-bottom:3px solid var(--accent);padding:20px 26px}.header h1{margin:0;font-size:29px}.header p{margin:5px 0 0;color:var(--muted)}.content{padding:26px 18px 50px}.toolbar{display:flex;gap:11px;align-items:center;margin-bottom:20px;flex-wrap:wrap}.search{flex:1;min-width:260px;padding:12px 13px;font-size:15px;border:1px solid #46505a;border-radius:7px;background:#171b20;color:#fff}.btn{padding:11px 15px;background:#303841;color:#fff;text-decoration:none;border-radius:7px;font-weight:700}.count{margin-bottom:14px;font-weight:bold;color:var(--muted)}.list{display:grid;gap:12px}.vehicle{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:18px;display:flex;justify-content:space-between;gap:20px;align-items:center}.vehicle h2{margin:0 0 8px;font-size:20px}.vehicle p{margin:4px 0;color:#c2c9d0}.view{display:inline-block;padding:11px 15px;background:var(--accent);color:#fff;text-decoration:none;border-radius:7px;font-weight:700;white-space:nowrap}.message{background:var(--panel);border:1px solid var(--line);padding:25px;border-radius:9px;text-align:center;color:var(--muted)}@media(max-width:650px){.vehicle{flex-direction:column;align-items:stretch}.view{text-align:center}.toolbar>*{width:100%}}</style></head>
<body><script src="v2-navigation.js"></script><div class="page"><div class="header"><h1>Garavex Vehicles</h1><p>Shop vehicle directory</p></div><div class="content"><div class="toolbar"><input id="search" class="search" placeholder="Search year, make, model, VIN, plate or customer..."><a class="btn" href="customers.html">Customers</a><a class="btn" href="dashboard.html">Dashboard</a></div><div id="count" class="count"></div><div id="list" class="list"><div class="message">Loading vehicles...</div></div></div></div>
<script>
let vehicles=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function getJson(url){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});if(r.status===401){location.href='/login.html';throw Error('Authentication required')}const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function render(list){document.getElementById('count').textContent=`${list.length} ${list.length===1?'vehicle':'vehicles'}`;const box=document.getElementById('list');if(!list.length){box.innerHTML='<div class="message">No vehicles found.</div>';return}box.innerHTML=list.map(v=>`<div class="vehicle"><div><h2>${esc([v.year,v.make,v.model].filter(Boolean).join(' ')||'Vehicle')}</h2><p><strong>Customer:</strong> ${esc(v.customer_name||'Unknown')}</p><p><strong>VIN:</strong> ${esc(v.vin||'Not entered')}</p><p><strong>Plate:</strong> ${esc(v.license_plate||v.plate||'Not entered')}</p>${v.mileage?`<p><strong>Mileage:</strong> ${esc(v.mileage)}</p>`:''}</div><a class="view" href="customer.html?id=${encodeURIComponent(v.customer_id)}">View Vehicle / Customer</a></div>`).join('')}
async function load(){try{const customers=await getJson('/api/customers');const profiles=await Promise.all(customers.map(async c=>{try{return await getJson('/api/customers/'+encodeURIComponent(c.id))}catch{return null}}));vehicles=profiles.filter(Boolean).flatMap(c=>(Array.isArray(c.vehicles)?c.vehicles:[]).map(v=>({...v,customer_id:c.id,customer_name:c.name})));render(vehicles)}catch(e){console.error(e);document.getElementById('list').innerHTML='<div class="message">Unable to load vehicles.</div>'}}
document.getElementById('search').addEventListener('input',function(){const q=this.value.toLowerCase().trim();render(vehicles.filter(v=>[v.year,v.make,v.model,v.vin,v.license_plate,v.plate,v.customer_name].some(x=>String(x||'').toLowerCase().includes(q))))});load();
</script></body></html>
