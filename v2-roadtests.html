<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Road Tests</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.muted{color:#89959e}.form{display:grid;grid-template-columns:90px 160px 130px 1fr auto;gap:8px}input,select{background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:10px}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}.test{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:12px;padding:14px 0;border-bottom:1px solid #283139}.active{color:#f2b84b}.passed{color:#58c87b}.failed{color:#f06b62}@media(max-width:750px){.form,.test{display:block}.form>*{width:100%;margin:5px 0}.test>*{margin:7px 0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Road Tests</h1><p class="muted">Document diagnostic and post-repair test drives so verification does not live in someone's memory.</p><section class="card"><div class="form"><input id="ro" type="number" placeholder="RO #"><select id="phase"><option value="diagnostic">Diagnostic</option><option value="pre_repair">Pre-Repair</option><option value="post_repair" selected>Post-Repair</option></select><input id="miles" type="number" placeholder="Start mileage"><input id="note" placeholder="What needs to be verified?"><button class="btn" onclick="start()">Start Test</button></div></section><section class="card"><div id="tests"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/v2/road-tests'),d=await r.json();if(!r.ok){tests.textContent=d.error||'Unable to load road tests';return}tests.innerHTML=d.length?d.map(x=>`<div class="test"><div><b>RO #${x.repair_order_id} · ${esc(x.customer_name)}</b><div class="muted">${esc([x.year,x.make,x.model].filter(Boolean).join(' '))} · ${esc(x.employee_name||'Employee')}</div><p>${esc(x.notes||'')}</p></div><div><b>${esc(x.phase.replaceAll('_',' '))}</b><div class="${x.status==='in_progress'?'active':esc(x.result||'')}">${x.status==='in_progress'?'IN PROGRESS':esc((x.result||'completed').toUpperCase())}</div><div class="muted">Start: ${esc(x.start_mileage||'—')} · End: ${esc(x.end_mileage||'—')}</div></div><div>${x.status==='in_progress'?`<input id="end${x.id}" type="number" placeholder="End mileage" style="width:100%"><select id="result${x.id}" style="width:100%;margin-top:5px"><option value="passed">Passed</option><option value="failed">Failed</option><option value="inconclusive">Inconclusive</option></select><button class="btn" style="width:100%;margin-top:5px" onclick="completeTest(${x.id})">Complete</button>`:`<span class="muted">Completed ${esc(x.completed_at||'')}</span>`}</div></div>`).join(''):'<p class="muted">No road tests recorded.</p>'}async function start(){const r=await fetch('/api/v2/repair-orders/'+ro.value+'/road-tests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phase:phase.value,start_mileage:Number(miles.value),notes:note.value})}),d=await r.json();if(!r.ok)return alert(d.error||'Unable to start');ro.value=miles.value=note.value='';load()}async function completeTest(id){const r=await fetch('/api/v2/road-tests/'+id+'/complete',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({end_mileage:Number(document.getElementById('end'+id).value),result:document.getElementById('result'+id).value})}),d=await r.json();if(!r.ok)return alert(d.error||'Unable to complete');load()}load();</script></body></html>
