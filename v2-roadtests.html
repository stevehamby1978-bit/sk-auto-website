<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Road Tests</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1150px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.muted{color:#89959e}.form{display:grid;grid-template-columns:90px 160px 140px 1fr auto;gap:8px}input,select,textarea{background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:10px;width:100%}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.55}.test{display:grid;grid-template-columns:1.5fr .9fr 1.1fr;gap:14px;padding:14px 0;border-bottom:1px solid #283139}.test:last-child{border-bottom:0}.active{color:#f2b84b}.passed{color:#58c87b}.failed{color:#f06b62}.inconclusive{color:#f2b84b}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#10151a;border:1px solid #29323a;border-radius:10px;padding:14px}.metric b{display:block;font-size:24px;margin-top:5px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.msg{min-height:18px;margin-top:8px}.ok{color:#58c87b}.error{color:#ff655d}.completion>*{margin-top:6px}.notes{white-space:pre-wrap}.stamp{font-size:12px}.warning{border-left:3px solid #f06b62;padding-left:10px}@media(max-width:750px){.form,.test{display:block}.form>*,.test>*{margin:7px 0}.summary{grid-template-columns:1fr 1fr}.toolbar{display:block}.toolbar>*{margin:6px 0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Road Tests</h1><p class="muted">Document diagnostic and post-repair verification before a vehicle is marked ready.</p><section class="summary"><div class="metric"><span class="muted">In Progress</span><b id="activeCount">0</b></div><div class="metric"><span class="muted">Passed</span><b id="passedCount">0</b></div><div class="metric"><span class="muted">Failed</span><b id="failedCount">0</b></div><div class="metric"><span class="muted">Inconclusive</span><b id="inconclusiveCount">0</b></div></section><section class="card"><h2>Start Road Test</h2><div class="form"><input id="ro" type="number" min="1" placeholder="RO #"><select id="phase"><option value="diagnostic">Diagnostic</option><option value="pre_repair">Pre-Repair</option><option value="post_repair" selected>Post-Repair</option></select><input id="miles" type="number" min="0" step="1" placeholder="Start mileage"><input id="note" maxlength="3000" placeholder="What needs to be verified?"><button id="startBtn" class="btn" onclick="startTest()">Start Test</button></div><div id="message" class="msg muted"></div></section><section class="card"><div class="toolbar"><input id="search" placeholder="Search RO, customer, vehicle or technician" oninput="render()"><select id="filter" onchange="render()"><option value="">All tests</option><option value="in_progress">In progress</option><option value="passed">Passed</option><option value="failed">Failed</option><option value="inconclusive">Inconclusive</option></select></div><div id="tests"></div></section></main><script>
let rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o){const r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function msg(text,type='muted'){message.className='msg '+type;message.textContent=text||''}function dt(v){if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleString()}function metrics(){activeCount.textContent=rows.filter(x=>x.status==='in_progress').length;passedCount.textContent=rows.filter(x=>x.result==='passed').length;failedCount.textContent=rows.filter(x=>x.result==='failed').length;inconclusiveCount.textContent=rows.filter(x=>x.result==='inconclusive').length}function render(){const q=search.value.trim().toLowerCase(),f=filter.value,data=rows.filter(x=>{const state=x.status==='in_progress'?'in_progress':x.result;return(!f||state===f)&&(!q||[x.repair_order_id,x.customer_name,x.year,x.make,x.model,x.employee_name,x.notes].some(v=>String(v||'').toLowerCase().includes(q)))});tests.innerHTML=data.length?data.map(x=>{const state=x.status==='in_progress'?'in_progress':(x.result||'completed'),needsNotes=x.status==='in_progress';return `<div class="test ${x.result&&x.result!=='passed'?'warning':''}"><div><b>RO #${esc(x.repair_order_id)} · ${esc(x.customer_name)}</b><div class="muted">${esc([x.year,x.make,x.model].filter(Boolean).join(' ')||'Vehicle')} · ${esc(x.employee_name||'Employee')}</div><p class="notes">${esc(x.notes||'No test notes entered.')}</p><div class="muted stamp">Started ${esc(dt(x.started_at))}${x.completed_at?' · Completed '+esc(dt(x.completed_at)):''}</div></div><div><b>${esc(String(x.phase||'').replaceAll('_',' '))}</b><div class="${state==='in_progress'?'active':esc(state)}">${state==='in_progress'?'IN PROGRESS':esc(state.toUpperCase())}</div><div class="muted">Start: ${x.start_mileage==null?'—':esc(x.start_mileage)} · End: ${x.end_mileage==null?'—':esc(x.end_mileage)}</div>${x.start_mileage!=null&&x.end_mileage!=null?`<div class="muted">Driven: ${esc(Number(x.end_mileage)-Number(x.start_mileage))} mi</div>`:''}</div><div>${x.status==='in_progress'?`<div class="completion"><input id="end${x.id}" type="number" min="${x.start_mileage??0}" step="1" placeholder="End mileage"><select id="result${x.id}" onchange="toggleNotes(${x.id})"><option value="passed">Passed</option><option value="failed">Failed</option><option value="inconclusive">Inconclusive</option></select><textarea id="notes${x.id}" maxlength="3000" rows="3" placeholder="Completion notes (required if failed/inconclusive)">${esc(x.notes||'')}</textarea><button id="complete${x.id}" class="btn" style="width:100%" onclick="completeTest(${x.id})">Complete Test</button></div>`:'<span class="muted">Verification recorded.</span>'}</div></div>`}).join(''):'<p class="muted">No road tests match this view.</p>'}function toggleNotes(id){const result=document.getElementById('result'+id).value,n=document.getElementById('notes'+id);n.placeholder=result==='passed'?'Completion notes (optional)':'Completion notes (required for this result)'}async function load(){try{rows=await api('/api/v2/road-tests');metrics();render()}catch(e){msg(e.message,'error')}}async function startTest(){const roId=Number(ro.value),raw=miles.value,startMileage=raw===''?null:Number(raw);if(!Number.isInteger(roId)||roId<1)return msg('Enter a valid repair order number.','error');if(startMileage!==null&&(!Number.isInteger(startMileage)||startMileage<0))return msg('Enter a valid whole-number starting mileage.','error');startBtn.disabled=true;msg('Starting road test…');try{await api('/api/v2/repair-orders/'+roId+'/road-tests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phase:phase.value,start_mileage:startMileage,notes:note.value.trim()})});ro.value=miles.value=note.value='';msg('Road test started.','ok');await load()}catch(e){msg(e.message,'error');await load()}finally{startBtn.disabled=false}}async function completeTest(id){const test=rows.find(x=>x.id===id),endEl=document.getElementById('end'+id),result=document.getElementById('result'+id).value,notes=document.getElementById('notes'+id).value.trim(),raw=endEl.value,end=raw===''?null:Number(raw);if(end!==null&&(!Number.isInteger(end)||end<0))return msg('Enter a valid whole-number ending mileage.','error');if(test?.start_mileage!=null&&end!=null&&end<Number(test.start_mileage))return msg('Ending mileage cannot be lower than starting mileage.','error');if(result!=='passed'&&!notes)return msg('Notes are required for a failed or inconclusive road test.','error');const btn=document.getElementById('complete'+id);btn.disabled=true;try{const d=await api('/api/v2/road-tests/'+id+'/complete',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({end_mileage:end,result,notes})});msg(d.workflow_blocked?'Road test recorded and the repair order is blocked until resolved.':'Road test passed and verification was recorded.','ok');await load()}catch(e){msg(e.message,'error');await load()}finally{if(document.getElementById('complete'+id))document.getElementById('complete'+id).disabled=false}}load();setInterval(load,60000);
</script></body></html>
