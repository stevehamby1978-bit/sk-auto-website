<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | RO Timeline</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.muted{color:#89959e}.form{display:grid;grid-template-columns:100px 140px 1fr auto;gap:8px}input,select,textarea{background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:10px}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 15px;font-weight:bold;cursor:pointer}.timeline{border-left:2px solid #303942;margin:12px 0 0 8px;padding-left:22px}.event{position:relative;padding:3px 0 20px}.event:before{content:'';position:absolute;left:-28px;top:6px;width:10px;height:10px;border-radius:50%;background:#df3329}.type{font-size:11px;text-transform:uppercase;color:#f2b84b;font-weight:bold}.details{white-space:pre-wrap;margin-top:5px}@media(max-width:700px){.form{display:block}.form>*{width:100%;margin:5px 0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Repair Order Timeline</h1><p class="muted">A chronological record of what happened to the vehicle and when.</p><section class="card"><div class="form"><input id="ro" type="number" placeholder="RO #"><select id="type"><option value="note">Note</option><option value="customer">Customer</option><option value="technician">Technician</option><option value="parts">Parts</option><option value="status">Status</option><option value="quality">Quality</option></select><input id="title" placeholder="Event title"><button class="btn" onclick="add()">Add Event</button></div><textarea id="details" rows="3" placeholder="Optional details" style="width:100%;margin-top:8px"></textarea><button class="btn" style="margin-top:8px" onclick="load()">Load Timeline</button></section><section class="card"><div id="timeline" class="timeline"><span class="muted">Enter a repair order number.</span></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){if(!ro.value)return;const r=await fetch('/api/v2/repair-orders/'+ro.value+'/timeline'),d=await r.json();if(!r.ok){timeline.innerHTML='<span>'+esc(d.error||'Unable to load')+'</span>';return}timeline.innerHTML=d.length?d.map(x=>`<div class="event"><div class="type">${esc(x.event_type)}</div><b>${esc(x.title)}</b><div class="details">${esc(x.details||'')}</div><div class="muted">${esc(x.employee_name||'System')} · ${esc(x.created_at)}</div></div>`).join(''):'<span class="muted">No timeline events yet.</span>'}async function add(){if(!ro.value)return;const r=await fetch('/api/v2/repair-orders/'+ro.value+'/timeline',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event_type:type.value,title:title.value,details:details.value})}),d=await r.json();if(!r.ok)return alert(d.error||'Unable to add event');title.value=details.value='';load()}</script></body></html>
