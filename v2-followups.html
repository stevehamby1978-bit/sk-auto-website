<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Follow-ups</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1050px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px}.muted{color:#89959e}.row{display:grid;grid-template-columns:1.2fr 1.6fr .7fr .7fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #283139}.btn{background:#df3329;color:white;border:0;border-radius:6px;padding:9px 12px;font-weight:bold;cursor:pointer}.money{font-weight:bold}.due{color:#f2b84b}@media(max-width:720px){.row{display:block}.row>*{margin:6px 0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Service Follow-up Queue</h1><p class="muted">Recommended work that is due for customer follow-up.</p><section class="card"><div class="row muted"><b>Customer</b><b>Service</b><b>Value</b><b>Due</b><b>Action</b></div><div id="rows">Loading…</div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'$'+Number(n||0).toFixed(2);async function load(){const r=await fetch('/api/v2/followups/due'),d=await r.json();if(!r.ok){rows.textContent=d.error||'Unable to load follow-ups';return}rows.innerHTML=d.length?d.map(x=>`<div class="row"><div><b>${esc(x.customer_name)}</b><div class="muted">${esc([x.year,x.make,x.model].filter(Boolean).join(' '))}</div></div><div>${esc(x.description)}</div><div class="money">${money(x.estimated_total)}</div><div class="due">${esc(x.follow_up_date)}</div><button class="btn" onclick="send(${x.id},this)">Text Customer</button></div>`).join(''):'<div style="padding:25px" class="muted">No follow-ups are due right now.</div>'}async function send(id,b){if(!confirm('Send this customer a service follow-up text?'))return;b.disabled=true;b.textContent='Sending…';const r=await fetch('/api/v2/deferred/'+id+'/follow-up-text',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),d=await r.json();if(!r.ok){alert(d.error||'Unable to send');b.disabled=false;b.textContent='Text Customer';return}load()}load();</script></body></html>
