<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Quality Control</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:20px;margin:14px 0}.bar{display:flex;gap:8px}.bar input{flex:1;background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:12px}.btn{background:#df3329;color:white;border:0;border-radius:7px;padding:11px 15px;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.4}.check{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #283139}.yes{color:#58c87b}.no{color:#f06b62}.muted{color:#89959e}textarea{width:100%;background:#0b0f12;color:white;border:1px solid #303942;border-radius:7px;padding:11px;margin:10px 0}.banner{padding:13px;border-radius:8px;margin:12px 0}.ready{background:#102219;border:1px solid #2d6c42}.hold{background:#241511;border:1px solid #6e392f}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Final Quality Control</h1><p class="muted">Catch incomplete repair orders before the customer is told the vehicle is ready.</p><section class="card"><div class="bar"><input id="ro" inputmode="numeric" placeholder="Repair order #"><button class="btn" onclick="loadQC()">Review RO</button></div></section><section class="card" id="panel" hidden><h2 id="title"></h2><div id="vehicle" class="muted"></div><div id="banner"></div><div id="checks"></div><textarea id="note" rows="3" placeholder="Final QC note (optional)"></textarea><button id="approve" class="btn" onclick="approveQC()">Approve & Mark Ready</button></section></main><script>let current=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function loadQC(){const id=ro.value.trim();if(!id)return;const r=await fetch('/api/v2/repair-orders/'+encodeURIComponent(id)+'/quality'),d=await r.json();if(!r.ok){alert(d.error||'Unable to review');return}current=d;panel.hidden=false;title.textContent='RO #'+d.id+' · '+d.customer_name;vehicle.textContent=[d.year,d.make,d.model].filter(Boolean).join(' ');checks.innerHTML=d.checks.map(x=>`<div class="check"><b>${esc(x.label)}</b><strong class="${x.ok?'yes':'no'}">${x.ok?'PASS':'NEEDS ATTENTION'}</strong></div>`).join('');banner.className='banner '+(d.ready?'ready':'hold');banner.textContent=d.ready?'All automated checks passed. Final QC can be approved.':'This RO has incomplete items. Review them before marking the vehicle ready.';approve.disabled=!d.ready}async function approveQC(){if(!current)return;const r=await fetch('/api/v2/repair-orders/'+current.id+'/quality/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({note:note.value})}),d=await r.json();if(!r.ok)return alert(d.error||'Unable to approve');alert('Final QC approved. RO marked ready.');loadQC()}ro.addEventListener('keydown',e=>{if(e.key==='Enter')loadQC()});</script></body></html>
