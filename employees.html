<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employees | Garavex</title><style>*{box-sizing:border-box}:root{--bg:#0e1114;--panel:#171b20;--line:#323a43;--text:#f5f7f9;--muted:#aeb7c1;--accent:#ef3e23}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}.header{background:#15191e;border-bottom:3px solid var(--accent);padding:18px 22px}.header-inner{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}.header h1{margin:0;font-size:27px}.back-btn{display:inline-block;background:#303841;color:#fff;text-decoration:none;padding:10px 15px;border-radius:7px;font-weight:bold}.container{max-width:1100px;margin:27px auto;padding:0 18px 45px}.intro{color:var(--muted);margin:-8px 0 20px}.capacity{background:#11161b;border:1px solid var(--line);padding:12px 15px;border-radius:8px;margin-bottom:16px;color:#d6dce1}.card{background:var(--panel);border:1px solid var(--line);padding:21px;border-radius:11px;margin-bottom:20px}.card h2{margin:0 0 17px;color:var(--accent)}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{display:block;font-weight:bold;margin-bottom:6px}input,select{width:100%;padding:11px;border:1px solid #46505a;border-radius:7px;background:#0f1317;color:#fff;font-size:15px}.full-width{grid-column:1/-1}button{border:0;border-radius:7px;padding:10px 14px;cursor:pointer;font-size:14px;font-weight:bold;background:#303841;color:#fff}.add-btn{background:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}#message{margin-top:12px;font-weight:bold}.employee{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:15px 0;border-bottom:1px solid var(--line)}.employee:last-child{border-bottom:0}.employee-name{font-size:18px;font-weight:bold;margin-bottom:5px}.employee-details{color:#c2c9d0;line-height:1.5}.status{display:inline-block;margin-top:5px;padding:4px 8px;border-radius:20px;font-size:12px;font-weight:bold}.active{background:#163e28;color:#7be5a1}.inactive{background:#4b2020;color:#ffabab}.empty{color:var(--muted);padding:10px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}@media(max-width:700px){.form-grid{grid-template-columns:1fr}.full-width{grid-column:auto}.header-inner,.employee{align-items:flex-start;flex-direction:column}}</style></head><body><div class="header"><div class="header-inner"><h1>Garavex Employee Management</h1><a href="/dashboard.html" class="back-btn">Back to Dashboard</a></div></div><div class="container"><p class="intro">Manage employee access for this shop. Employee limits are based on the shop's Garavex plan.</p><div id="capacity" class="capacity">Loading plan capacity…</div><div class="card"><h2>Add Employee</h2><form id="employeeForm"><div class="form-grid"><div><label for="name">Employee Name</label><input id="name" required></div><div><label for="email">Email / Login</label><input type="email" id="email" required></div><div><label for="password">Temporary Password</label><input type="password" id="password" minlength="8" required></div><div><label for="role">Employee Role</label><select id="role"><option value="technician">Technician</option><option value="service_writer">Service Writer</option><option value="manager">Manager</option><option value="owner">Owner</option></select></div><div class="full-width"><button id="addBtn" class="add-btn">Add Employee</button><div id="message"></div></div></div></form></div><div class="card"><h2>Employees</h2><div id="employees">Loading employees…</div></div></div><script>
const form=document.getElementById('employeeForm'),message=document.getElementById('message'),box=document.getElementById('employees'),addBtn=document.getElementById('addBtn');
const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const role=r=>({owner:'Owner',manager:'Manager',service_writer:'Service Writer',technician:'Technician'}[r]||r||'');
async function jsonFetch(url,options){const r=await fetch(url,options);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed.');return d}
async function loadCapacity(){try{const c=await jsonFetch('/api/v2/subscription/employee-capacity');const limit=c.employeeLimit==null?'Unlimited':c.employeeLimit;document.getElementById('capacity').textContent=`${String(c.plan).toUpperCase()} plan — ${c.employeeCount} active employees / ${limit}`;addBtn.disabled=!c.canAddEmployee}catch(e){document.getElementById('capacity').textContent=e.message}}
async function loadEmployees(){try{const rows=await jsonFetch('/api/v2/employees');box.innerHTML=rows.length?rows.map(e=>`<div class="employee"><div><div class="employee-name">${esc(e.name)}</div><div class="employee-details">${esc(e.email)}<br>Role: ${esc(role(e.role))}<br><span class="status ${e.active?'active':'inactive'}">${e.active?'Active':'Inactive'}</span><div class="actions"><button onclick="resetPassword(${Number(e.id)},'${esc(e.name).replace(/&#039;/g,"\\'")}')">Reset Password</button><button onclick="setActive(${Number(e.id)},${e.active?0:1})">${e.active?'Deactivate':'Reactivate'}</button></div></div></div></div>`).join(''):'<div class="empty">No employees have been added yet.</div>'}catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='Adding employee…';try{await jsonFetch('/api/v2/employees',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value.trim(),email:email.value.trim(),password:password.value,role:document.getElementById('role').value})});message.textContent='Employee added successfully.';form.reset();await Promise.all([loadEmployees(),loadCapacity()])}catch(err){message.textContent=err.message}});
async function resetPassword(id,n){const p=prompt(`Enter a new temporary password for ${n}:`);if(p===null)return;if(p.length<8)return alert('Temporary password must be at least 8 characters.');try{await jsonFetch(`/api/v2/employees/${id}/reset-password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({temporaryPassword:p})});alert(`${n}'s password has been reset.`)}catch(e){alert(e.message)}}
async function setActive(id,active){try{await jsonFetch(`/api/v2/employees/${id}/active`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:Boolean(active)})});await Promise.all([loadEmployees(),loadCapacity()])}catch(e){alert(e.message)}}
Promise.all([loadEmployees(),loadCapacity()]);
</script></body></html>
