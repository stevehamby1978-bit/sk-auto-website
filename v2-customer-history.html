<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Customer History</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1050px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.muted{color:#89959e}.top{display:flex;gap:8px}input{flex:1;background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:11px}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 16px;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.item{border:1px solid #29323a;border-radius:8px;padding:12px;background:#0b0f12}.timeline{border-left:2px solid #303942;margin-left:8px;padding-left:18px}.event{position:relative;padding:5px 0 18px}.event:before{content:'';position:absolute;left:-24px;top:9px;width:10px;height:10px;border-radius:50%;background:#df3329}.green{color:#58c87b}.red{color:#f06b62}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Customer & Vehicle History</h1><p class="muted">One place for the relationship history instead of opening old repair orders one at a time.</p><section class="card"><div class="top"><input id="customerId" type="number" placeholder="Customer ID"><button class="btn" onclick="load()">Open History</button></div></section><div id="view"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/v2/customers/'+customerId.value+'/history'),d=await r.json();if(!r.ok){view.innerHTML='<section class="card red">'+esc(d.error||'Unable to load history')+'</section>';return}view.innerHTML=`<section class="card"><h2>${esc(d.customer.name)}</h2><div class="muted">${esc(d.customer.phone||'')} ${esc(d.customer.email||'')}</div></section><section class="card"><h2>Vehicles</h2><div class="grid">${d.vehicles.map(v=>`<div class="item"><b>${esc([v.year,v.make,v.model].filter(Boolean).join(' '))}</b><div class="muted">VIN ${esc(v.vin||'—')}</div></div>`).join('')||'<span class="muted">No vehicles</span>'}</div></section><section class="card"><h2>Repair Timeline</h2><div class="timeline">${d.repair_orders.map(x=>`<div class="event"><b>RO #${x.id} · ${esc([x.year,x.make,x.model].filter(Boolean).join(' '))}</b><div class="muted">Opened ${esc(x.created_at||'—')} · ${esc(x.workflow_status||x.status||'')}</div>${x.completed_at?`<div class="green">Completed ${esc(x.completed_at)}</div>`:''}</div>`).join('')||'<span class="muted">No repair orders</span>'}</div></section><section class="card"><h2>Warranty History</h2><div class="grid">${d.warranties.map(w=>`<div class="item"><b>RO #${w.repair_order_id} · ${esc(w.status)}</b><div>${w.months} mo / ${Number(w.miles).toLocaleString()} mi</div><div class="muted">Expires ${esc(w.expires_date||'—')}${w.expires_mileage?' / '+Number(w.expires_mileage).toLocaleString()+' mi':''}</div></div>`).join('')||'<span class="muted">No warranties</span>'}</div></section>`}</script></body></html>
