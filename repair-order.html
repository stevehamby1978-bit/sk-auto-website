<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S&K Auto | Repair Order</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #111827;
  color: #222;
}

.header {
  background: #0b1220;
  border-bottom: 4px solid #ef3e23;
  padding: 20px;
  text-align: center;
  color: white;
}

.header img {
  width: 180px;
  max-width: 90%;
}

.header h1 {
  margin: 8px 0 2px;
}

.header p {
  margin: 0;
}

.container {
  max-width: 1000px;
  margin: 30px auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 8px;
  padding: 25px;
}

.top-row {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  border-bottom: 1px solid #ddd;
  padding-bottom: 20px;
}

.info-box {
  flex: 1;
  min-width: 250px;
}

.info-box h3 {
  color: #ef3e23;
  margin-top: 0;
}

.status {
  display: inline-block;
  background: #f5c518;
  color: #111;
  padding: 6px 12px;
  border-radius: 20px;
  font-weight: bold;
  text-transform: uppercase;
}
.status.waiting {
  background: #f5c518;
  color: #111;
}

.status.in_progress {
  background: #0b4dbb;
  color: white;
}

.status.completed {
  background: #28a745;
  color: white;
}

.status.cancelled {
  background: #dc3545;
  color: white;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 25px;
}

th {
  background: #0b4dbb;
  color: white;
  padding: 12px;
  text-align: left;
}

td {
  padding: 12px;
  border-bottom: 1px solid #ddd;
}

.money {
  text-align: right;
}

.totals {
  margin-top: 25px;
  margin-left: auto;
  max-width: 350px;
}

.total-row {
  display: flex;
  justify-content: space-between;
  padding: 7px 0;
}

.grand-total {
  border-top: 2px solid #ef3e23;
  font-size: 22px;
  font-weight: bold;
  margin-top: 5px;
  padding-top: 12px;
}

.actions {
  margin-top: 30px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

button {
  border: 0;
  border-radius: 5px;
  padding: 12px 18px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.print-btn {
  background: #ef3e23;
  color: white;
}

.back-btn {
  background: #374151;
  color: white;
}

.loading,
.error {
  text-align: center;
  padding: 40px;
  color: white;
}

@media(max-width:700px) {
  .container {
    margin: 10px auto;
    padding: 10px;
  }

  .card {
    padding: 15px;
  }

  table {
    font-size: 13px;
  }
}
</style>
</head>

<body>

<div class="header">
  <img src="/sk-auto-logo.jpg" alt="S&K Auto">
  <h1>Repair Order</h1>
  <p>The Art of Automotive Repair</p>
</div>

<div class="container">

  <div id="loading" class="loading">
    Loading repair order...
  </div>

  <div id="error" class="error" style="display:none;">
    Unable to load repair order.
  </div>

  <div id="repairOrder" class="card" style="display:none;">

    <h2>
      Repair Order #<span id="orderNumber"></span>
    </h2>

    <p>
      Status:
     <span id="status" class="status"></span>

<div style="margin-top:12px;">
  <label for="statusSelect"><strong>Change Status:</strong></label>

  <select id="statusSelect"
    style="padding:8px 12px; margin-left:8px; border-radius:5px;">
    <option value="waiting">Waiting</option>
    <option value="in_progress">In Progress</option>
    <option value="completed">Completed</option>
    <option value="cancelled">Cancelled</option>
  </select>

  <button
    id="updateStatusBtn"
    type="button"
    style="margin-left:8px; padding:9px 16px; border:none; border-radius:5px; background:#ef3e23; color:white; font-weight:bold; cursor:pointer;">
    Update Status
  </button>
</div>
    </p>

    <div class="top-row">

      <div class="info-box">
        <h3>Customer</h3>

        <div id="customerName"></div>
        <div id="customerPhone"></div>
        <div id="customerEmail"></div>
      </div>

      <div class="info-box">
        <h3>Vehicle</h3>

        <div id="vehicle"></div>
        <div>
          Mileage:
          <span id="mileage"></span>
        </div>

        <div>
          VIN:
          <span id="vin"></span>
        </div>
      </div>

    </div>

    <table>
      <thead>
        <tr>
          <th>Description</th>
          <th>Parts</th>
          <th>Labor</th>
          <th>Total</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="items"></tbody>
    </table>
<div id="addItemSection" style="margin-top:20px; padding:15px; background:#f3f4f6; border-radius:7px;">

  <h3 style="margin-top:0;">Add Repair Item</h3>

  <div style="display:grid; grid-template-columns:2fr 1fr 1fr; gap:10px;">

    <input
      id="newItemDescription"
      type="text"
      placeholder="Repair description"
      style="padding:10px;">

    <input
      id="newItemParts"
      type="number"
      min="0"
      step="0.01"
      placeholder="Parts $"
      style="padding:10px;">

    <input
      id="newItemLabor"
      type="number"
      min="0"
      step="0.01"
      placeholder="Labor $"
      style="padding:10px;">

  </div>

  <button
    id="addItemBtn"
    type="button"
    style="margin-top:12px; background:#ef3e23; color:white; border:none; padding:10px 18px; border-radius:5px; font-weight:bold; cursor:pointer;">
    + Add Repair Item
  </button>

</div>
    <div class="totals">

      <div class="total-row">
        <span>Subtotal:</span>
        <strong id="subtotal">$0.00</strong>
      </div>

      <div class="total-row">
        <span>Tax:</span>
        <strong id="tax">$0.00</strong>
      </div>

      <div class="total-row grand-total">
        <span>TOTAL:</span>
        <span id="total">$0.00</span>
      </div>

    </div>
<div id="technicianNotesSection"
     style="margin-top:25px; padding:18px; background:#f3f4f6; border-radius:7px;">

  <h3 style="margin-top:0;">Technician / Shop Notes</h3>

  <textarea
    id="technicianNotes"
    rows="6"
    placeholder="Enter diagnostic findings, repairs performed, parts ordered, customer authorization notes, or other shop notes..."
    style="width:100%; box-sizing:border-box; padding:12px; border:1px solid #ccc; border-radius:5px; resize:vertical;"></textarea>

  <button
    id="saveNotesBtn"
    type="button"
    style="margin-top:10px; background:#0b4dbb; color:white; border:none; padding:10px 18px; border-radius:5px; font-weight:bold; cursor:pointer;">
    Save Notes
  </button>

</div>

    <div id="customerAuthorizationSection"
     style="margin-top:25px; padding:18px; background:#f3f4f6; border-radius:7px;">

  <h3 style="margin-top:0;">Customer Authorization</h3>

  <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">

    <div>
      <label for="authorizedBy">
        <strong>Authorized By:</strong>
      </label>

      <input
        id="authorizedBy"
        type="text"
        placeholder="Customer name"
        style="width:100%; box-sizing:border-box; padding:10px; margin-top:5px;">
    </div>

    <div>
      <label for="authorizationMethod">
        <strong>Authorization Method:</strong>
      </label>

      <select
        id="authorizationMethod"
        style="width:100%; box-sizing:border-box; padding:10px; margin-top:5px;">

        <option value="">Select Method</option>
        <option value="in_person">In Person</option>
        <option value="phone">Phone</option>
        <option value="text">Text Message</option>
        <option value="email">Email</option>

      </select>
    </div>

  </div>

  <div style="margin-top:12px;">
    <label for="authorizationNotes">
      <strong>Authorization Notes:</strong>
    </label>

    <textarea
      id="authorizationNotes"
      rows="4"
      placeholder="Example: Customer approved additional brake repair by phone."
      style="width:100%; box-sizing:border-box; padding:10px; margin-top:5px; resize:vertical;"></textarea>
  </div>

  <button
    id="saveAuthorizationBtn"
    type="button"
    style="margin-top:12px; background:#28a745; color:white; border:none; padding:10px 18px; border-radius:5px; font-weight:bold; cursor:pointer;">
    Save Customer Authorization
  </button>

  <div
    id="authorizationSavedInfo"
    style="display:none; margin-top:12px; padding:10px; background:#e8f5e9; border-radius:5px;">
  </div>

</div>
    <div class="actions">

      <button
        class="print-btn"
        onclick="window.print()">
        Print / Save PDF
      </button>

      <button
        class="back-btn"
        onclick="window.location.href='/repair-orders.html'">
        Back to Repair Orders
      </button>

    </div>

  </div>

</div>

<script>

function money(value) {
  return '$' + (Number(value) || 0).toFixed(2);
}

async function loadRepairOrder() {

  const params =
    new URLSearchParams(window.location.search);

  const id = params.get('id');



  if (!id) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    return;
  }
  try {
const response =
  await fetch('/api/repair-orders/' + encodeURIComponent(id));

if (!response.ok) {
  throw new Error('Unable to retrieve repair order');
}

const order = await response.json();

    if (!order) {
      throw new Error('Repair order not found');
    }

    document.getElementById('orderNumber').textContent =
      order.id;

    document.getElementById('status').textContent =
      order.status || 'waiting';
    document.getElementById('status').className =
  'status ' + (order.status || 'waiting');
const statusSelect =
  document.getElementById('statusSelect');

statusSelect.value =
  order.status || 'waiting';
    document.getElementById('technicianNotes').value =
  order.technician_notes || '';
  document.getElementById('authorizedBy').value =
  order.authorized_by || '';

document.getElementById('authorizationMethod').value =
  order.authorization_method || '';

document.getElementById('authorizationNotes').value =
  order.authorization_notes || '';

const authorizationSavedInfo =
  document.getElementById('authorizationSavedInfo');

if (order.authorized_at) {

  const authorizedDate =
    new Date(order.authorized_at);

  authorizationSavedInfo.style.display = 'block';

  authorizationSavedInfo.textContent =
    'Authorization recorded: ' +
    authorizedDate.toLocaleString();
}
  document.getElementById('customerName').textContent =
    
      
    order.customer_name || '';

    document.getElementById('customerPhone').textContent =
      order.customer_phone || '';

    document.getElementById('customerEmail').textContent =
      order.customer_email || '';

    document.getElementById('vehicle').textContent =
      [
        order.vehicle_year,
        order.vehicle_make,
        order.vehicle_model
      ].filter(Boolean).join(' ');

    document.getElementById('mileage').textContent =
      order.vehicle_mileage || '';

    document.getElementById('vin').textContent =
      order.vehicle_vin || '';

    const itemsBody =
      document.getElementById('items');

    itemsBody.innerHTML = '';

    let subtotal = 0;

    if (Array.isArray(order.items)) {

      order.items.forEach(item => {

        const parts =
          Number(item.parts) || 0;

        const labor =
          Number(item.labor) || 0;

        const itemTotal =
          parts + labor;

        subtotal += itemTotal;

        const row =
          document.createElement('tr');

      row.innerHTML = `
  <td>${item.description || ''}</td>
  <td>${money(parts)}</td>
  <td>${money(labor)}</td>
  <td>${money(itemTotal)}</td>
  <td>
    <button
      type="button"
      class="deleteItemBtn"
      data-item-id="${item.id}"
      style="background:#dc3545;color:white;border:none;padding:7px 12px;border-radius:5px;font-weight:bold;cursor:pointer;">
      Delete
    </button>
 <td>
  <button
    type="button"
    class="editItemBtn"
    data-item-id="${item.id}"
    style="background:#0b4dbb;color:white;border:none;padding:7px 12px;border-radius:5px;font-weight:bold;cursor:pointer;margin-right:5px;">
    Edit
  </button>

  <button
    type="button"
    class="deleteItemBtn"
    data-item-id="${item.id}"
    style="background:#dc3545;color:white;border:none;padding:7px 12px;border-radius:5px;font-weight:bold;cursor:pointer;">
    Delete
  </button>
</td>
`;
        itemsBody.appendChild(row);
        const editButton =
  row.querySelector('.editItemBtn');

editButton.addEventListener('click', async () => {

  const newDescription =
    prompt('Repair description:', item.description || '');

  if (newDescription === null) {
    return;
  }

  if (!newDescription.trim()) {
    alert('Repair description is required.');
    return;
  }

  const newParts =
    prompt('Parts amount:', parts.toFixed(2));

  if (newParts === null) {
    return;
  }

  const newLabor =
    prompt('Labor amount:', labor.toFixed(2));

  if (newLabor === null) {
    return;
  }

  const partsAmount = Number(newParts);
  const laborAmount = Number(newLabor);

  if (
    !Number.isFinite(partsAmount) ||
    !Number.isFinite(laborAmount) ||
    partsAmount < 0 ||
    laborAmount < 0
  ) {
    alert('Please enter valid parts and labor amounts.');
    return;
  }

  try {

    editButton.disabled = true;
    editButton.textContent = 'Saving...';

    const response = await fetch(
      '/api/repair-orders/' +
      encodeURIComponent(id) +
      '/items/' +
      encodeURIComponent(item.id),
      {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          description: newDescription.trim(),
          parts: partsAmount,
          labor: laborAmount
        })
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(
        result.error || 'Unable to edit repair item'
      );
    }

    alert('Repair item updated.');

    window.location.reload();

  } catch (error) {

    alert(error.message);

    editButton.disabled = false;
    editButton.textContent = 'Edit';

  }
});
const deleteButton =
  row.querySelector('.deleteItemBtn');

deleteButton.addEventListener('click', async () => {

  const confirmed =
    confirm('Are you sure you want to delete this repair item?');

  if (!confirmed) {
    return;
  }

  try {

    deleteButton.disabled = true;
    deleteButton.textContent = 'Deleting...';

    const response = await fetch(
      '/api/repair-orders/' +
      encodeURIComponent(id) +
      '/items/' +
      encodeURIComponent(item.id),
      {
        method: 'DELETE'
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(
        result.error || 'Unable to delete repair item'
      );
    }

    alert('Repair item deleted.');

    window.location.reload();

  } catch (error) {

    alert(error.message);

    deleteButton.disabled = false;
    deleteButton.textContent = 'Delete';

  }
});
      });

    }

    /*
      Same 7.5% tax calculation currently
      used by the estimate page.
    */
    const tax =
      Math.round(subtotal * 0.075 * 100) / 100;

    const total =
      Math.round((subtotal + tax) * 100) / 100;

    document.getElementById('subtotal').textContent =
      money(subtotal);

    document.getElementById('tax').textContent =
      money(tax);

    document.getElementById('total').textContent =
      money(total);

    document.getElementById('loading').style.display =
      'none';

    document.getElementById('repairOrder').style.display =
      'block';

  } catch (error) {

    console.error(error);
    alert(error.message);
    
    document.getElementById('loading').style.display =
      'none';

    document.getElementById('error').style.display =
      'block';

  }
}
document.getElementById('updateStatusBtn').addEventListener('click', async () => {

  const params =
    new URLSearchParams(window.location.search);

  const id = params.get('id');

  const status =
    document.getElementById('statusSelect').value;

  const button =
    document.getElementById('updateStatusBtn');

  try {
    button.disabled = true;
    button.textContent = 'Updating...';

    const response = await fetch(
      '/api/repair-orders/' + encodeURIComponent(id) + '/status',
      {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          status: status
        })
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(
        result.error || 'Unable to update status'
      );
    }

   const statusBadge =
  document.getElementById('status');

statusBadge.textContent = status;
statusBadge.className = 'status ' + status;
    alert('Repair order status updated.');

  } catch (error) {

    alert(error.message);

  } finally {

    button.disabled = false;
    button.textContent = 'Update Status';

  }
});

  document.getElementById('addItemBtn').addEventListener('click', async () => {

  const params =
    new URLSearchParams(window.location.search);

  const id = params.get('id');

  const description =
    document.getElementById('newItemDescription').value.trim();

  const parts =
    Number(document.getElementById('newItemParts').value) || 0;

  const labor =
    Number(document.getElementById('newItemLabor').value) || 0;

  const button =
    document.getElementById('addItemBtn');

  if (!description) {
    alert('Please enter a repair description.');
    return;
  }

  try {

    button.disabled = true;
    button.textContent = 'Adding...';

    const response = await fetch(
      '/api/repair-orders/' + encodeURIComponent(id) + '/items',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          description: description,
          parts: parts,
          labor: labor
        })
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(
        result.error || 'Unable to add repair item'
      );
    }

    alert('Repair item added.');

    window.location.reload();

  } catch (error) {

    alert(error.message);

  } finally {

    button.disabled = false;
    button.textContent = '+ Add Repair Item';

  }
});

document.getElementById('saveNotesBtn').addEventListener('click', async () => {

  const params =
    new URLSearchParams(window.location.search);

  const id = params.get('id');

  const technicianNotes =
    document.getElementById('technicianNotes').value;

  const button =
    document.getElementById('saveNotesBtn');

  try {

    button.disabled = true;
    button.textContent = 'Saving...';

    const response = await fetch(
      '/api/repair-orders/' + encodeURIComponent(id) + '/notes',
      {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          technician_notes: technicianNotes
        })
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(
        result.error || 'Unable to save technician notes'
      );
    }

    alert('Technician notes saved.');

  } catch (error) {

    alert(error.message);

  } finally {

    button.disabled = false;
    button.textContent = 'Save Notes';

  }
}); 

  document.getElementById('saveAuthorizationBtn').addEventListener('click', async () => {

  const params =
    new URLSearchParams(window.location.search);

  const id = params.get('id');

  const authorizedBy =
    document.getElementById('authorizedBy').value.trim();

  const authorizationMethod =
    document.getElementById('authorizationMethod').value;

  const authorizationNotes =
    document.getElementById('authorizationNotes').value;

  const button =
    document.getElementById('saveAuthorizationBtn');

  if (!authorizedBy) {
    alert('Please enter who authorized the repair.');
    return;
  }

  if (!authorizationMethod) {
    alert('Please select an authorization method.');
    return;
  }

  try {

    button.disabled = true;
    button.textContent = 'Saving...';

    const response = await fetch(
      '/api/repair-orders/' +
      encodeURIComponent(id) +
      '/authorization',
      {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          authorized_by: authorizedBy,
          authorization_method: authorizationMethod,
          authorization_notes: authorizationNotes
        })
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(
        result.error || 'Unable to save customer authorization'
      );
    }

    const authorizationSavedInfo =
      document.getElementById('authorizationSavedInfo');

    authorizationSavedInfo.style.display = 'block';

    authorizationSavedInfo.textContent =
      'Authorization recorded: ' +
      new Date(result.authorized_at).toLocaleString();

    alert('Customer authorization saved.');

  } catch (error) {

    alert(error.message);

  } finally {

    button.disabled = false;
    button.textContent = 'Save Customer Authorization';

  }

});
loadRepairOrder();

</script>

</body>
</html>
