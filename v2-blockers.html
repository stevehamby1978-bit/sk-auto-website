<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Job Blockers</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.muted{color:#89959e}.form{display:grid;grid-template-columns:100px 170px 1fr auto;gap:8px}input,select{background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:10px}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}.blocker{display:grid;grid-template-columns:1fr 160px 100px;gap:12px;padding:14px 0;border-bottom:1px solid #283139}.tag{display:inline-block;padding:4px 8px;border-radius:20px;background:#3a2611;color:#f2b84b;font-size:11px;text-transform:uppercase}.resolve{background:#252d34;color:#fff;border:1px solid #37414a;border-radius:6px;cursor:pointer}@media(max-width:700px){.form,.blocker{display:block}.form>*{width:100%;margin:5px 0}.blocker>*{margin:7px 0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Stalled Jobs & Blockers</h1><p class="muted">Make delays visible instead of letting repair orders quietly sit.</p><section class="card"><div class="form"><input id="ro" type="number" placeholder="RO #"><select id="type"><option value="parts">Waiting on Parts</option><option value="approval">Customer Approval</option><option value="diagnosis">Diagnosis</option><option value="sublet">Sublet / Outside Work</option><option value="technician">Technician</option><option value="other">Other</option></select><input id="desc" placeholder="What is holding this job up?"><button class="btn" onclick="add()">Add Blocker</button></div></section><section class="card"><h2>Open Blockers</h2><div id="list"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/v2/blockers'),d=await r.json();if(!r.ok){list.textContent=d.error||'Unable to load blockers';return}list.innerHTML=d.length?d.map(x=>`<div class="blocker"><div><b>RO #${x.repair_order_id} · ${esc(x.customer_name)}</b><div class="muted">${esc([x.year,x.make,x.model].filter(Boolean).join(' '))} · ${esc(x.technician_name||'Unassigned')}</div><p>${esc(x.description)}</p><span class="tag">${esc(x.type)}</span></div><div class="muted">Blocked since<br>${esc(x.created_at)}</div><button class="resolve" onclick="resolveBlocker(${x.id})">Resolve</button></div>`).join(''):'<p class="muted">No open blockers. Shop flow looks clear.</p>'}async function add(){const r=await fetch('/api/v2/repair-orders/'+ro.value+'/blockers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:type.value,description:desc.value})}),d=await r.json();if(!r.ok)return alert(d.error||'Unable to add blocker');ro.value=desc.value='';load()}async function resolveBlocker(id){const r=await fetch('/api/v2/blockers/'+id+'/resolve',{method:'PATCH'}),d=await r.json();if(!r.ok)return alert(d.error||'Unable to resolve');load()}load();setInterval(load,60000);</script></body></html>
