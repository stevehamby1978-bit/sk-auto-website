<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Daily Plan</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1100px;margin:auto;padding:24px}.muted{color:#89959e}.bar,.grid{display:grid;gap:12px}.bar{grid-template-columns:1fr auto}.grid{grid-template-columns:repeat(4,1fr)}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:17px}.count{font-size:32px;font-weight:800}.item{padding:11px 0;border-bottom:1px solid #29323a}.urgent{color:#ff655d}.high{color:#f2b84b}input,button{background:#10151a;color:#fff;border:1px solid #303942;border-radius:7px;padding:10px}button{background:#df3329;border:0;font-weight:bold}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Daily Shop Plan</h1><p class="muted">Start the day with the work that needs attention.</p><div class="bar"><input id="day" type="date"><button onclick="load()">Load Day</button></div><div id="summary" class="grid" style="margin-top:14px"></div><div id="sections"></div></main><script>const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));day.value=new Date().toISOString().slice(0,10);const block=(title,a,f)=>`<section class="card" style="margin-top:14px"><h2>${title}</h2>${a.length?a.map(f).join(''):'<p class="muted">Nothing requiring attention.</p>'}</section>`;async function load(){const r=await fetch('/api/v2/daily-plan?date='+day.value),d=await r.json();if(!r.ok)return alert(d.error||'Unable to load daily plan');summary.innerHTML=Object.entries(d.counts).map(([k,v])=>`<div class="card"><div class="count">${v}</div><div class="muted">${e(k)}</div></div>`).join('');sections.innerHTML=block('Promises',d.promises,x=>`<div class="item"><b>RO #${x.repair_order_id} · ${e(x.customer_name)}</b><div class="muted">Promised ${e(x.promised_at)}</div></div>`)+block('Open Tasks',d.tasks,x=>`<div class="item"><span class="${e(x.priority)}">${e(x.priority.toUpperCase())}</span> · <b>${e(x.title)}</b>${x.repair_order_id?' · RO #'+x.repair_order_id:''}</div>`)+block('Blockers',d.blockers,x=>`<div class="item"><b>RO #${x.repair_order_id} · ${e(x.customer_name)}</b><div>${e(x.reason)}</div></div>`)+block('Parts Needing Attention',d.parts,x=>`<div class="item"><b>RO #${x.repair_order_id} · ${e(x.customer_name)}</b><div>${e(x.description)} · ${e(x.status)}</div></div>`)}load();</script></body></html>
