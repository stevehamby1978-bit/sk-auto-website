<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Comebacks</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1100px;margin:auto;padding:24px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.metric b{display:block;font-size:28px;margin-top:6px}.muted{color:#89959e}input,textarea,select{width:100%;background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:10px;margin:5px 0}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}.row{display:grid;grid-template-columns:1.2fr 1.6fr .8fr 1fr;gap:12px;padding:14px 0;border-bottom:1px solid #283139}.money{font-weight:bold}@media(max-width:700px){.metrics{grid-template-columns:1fr}.row{display:block}.row>*{margin:7px 0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Comeback & Warranty Tracking</h1><p class="muted">Track repeat repairs, warranty cost and quality trends without hiding them inside normal repair orders.</p><section class="metrics" id="metrics"></section><section class="card"><h2>Record a Comeback</h2><input id="ro" type="number" placeholder="Original repair order #"><textarea id="reason" rows="3" placeholder="Why did the vehicle return?"></textarea><button class="btn" onclick="add()">Record Comeback</button></section><section class="card"><h2>Comebacks</h2><div class="row muted"><b>Customer / RO</b><b>Reason / Resolution</b><b>Cost</b><b>Status</b></div><div id="rows"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'$'+Number(n||0).toFixed(2);async function api(u,o){const r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){try{const m=await api('/api/v2/comebacks/metrics');metrics.innerHTML=[['Total Comebacks',m.total],['Currently Open',m.open_count],['Recorded Cost',money(m.total_cost)]].map(x=>`<div class="card metric"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');const d=await api('/api/v2/comebacks');rows.innerHTML=d.length?d.map(x=>`<div class="row"><div><b>${esc(x.customer_name)}</b><div class="muted">RO #${x.original_repair_order_id} · ${esc([x.year,x.make,x.model].filter(Boolean).join(' '))}</div></div><div>${esc(x.reason)}${x.resolution?`<div class="muted">Resolution: ${esc(x.resolution)}</div>`:''}</div><div class="money">${money(Number(x.labor_cost)+Number(x.parts_cost))}</div><select onchange="save(${x.id},this.value)"><option value="open" ${x.status==='open'?'selected':''}>Open</option><option value="in_progress" ${x.status==='in_progress'?'selected':''}>In Progress</option><option value="resolved" ${x.status==='resolved'?'selected':''}>Resolved</option><option value="dismissed" ${x.status==='dismissed'?'selected':''}>Dismissed</option></select></div>`).join(''):'<p class="muted">No comebacks recorded.</p>'}catch(e){rows.textContent=e.message}}async function add(){try{await api('/api/v2/comebacks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({original_repair_order_id:ro.value,reason:reason.value})});ro.value=reason.value='';load()}catch(e){alert(e.message)}}async function save(id,status){try{await api('/api/v2/comebacks/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}catch(e){alert(e.message)}}load();</script></body></html>
