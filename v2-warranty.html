<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Warranty</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.muted{color:#89959e}.form{display:grid;grid-template-columns:90px 100px 120px 120px 1fr auto;gap:8px}input{background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:10px}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:12px;padding:14px 0;border-bottom:1px solid #29323a}.active{color:#58c87b;font-weight:bold}.expired,.void{color:#f06b62;font-weight:bold}@media(max-width:800px){.form,.row{display:block}.form>*{width:100%;margin:5px 0}.row>*{margin:7px 0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Warranty Register</h1><p class="muted">Keep repair warranty terms attached to the original RO and vehicle instead of relying on memory.</p><section class="card"><div class="form"><input id="ro" type="number" placeholder="RO #"><input id="months" type="number" value="12" placeholder="Months"><input id="miles" type="number" value="12000" placeholder="Miles"><input id="start" type="number" placeholder="Start mileage"><input id="notes" placeholder="Warranty notes / exclusions"><button class="btn" onclick="add()">Add Warranty</button></div></section><section class="card"><div id="rows"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/v2/warranties'),d=await r.json();if(!r.ok){rows.textContent=d.error||'Unable to load warranties';return}rows.innerHTML=d.length?d.map(x=>`<div class="row"><div><b>RO #${x.repair_order_id} · ${esc(x.customer_name)}</b><div class="muted">${esc([x.year,x.make,x.model].filter(Boolean).join(' '))}</div><div>${esc(x.notes||'')}</div></div><div><b>${x.months} months / ${Number(x.miles).toLocaleString()} miles</b><div class="muted">Start ${esc(x.start_date)}${x.start_mileage?' · '+Number(x.start_mileage).toLocaleString()+' mi':''}</div></div><div><span class="${x.status}">${esc(x.status.toUpperCase())}</span><div class="muted">Expires ${esc(x.expires_date||'—')}${x.expires_mileage?' or '+Number(x.expires_mileage).toLocaleString()+' mi':''}</div></div></div>`).join(''):'<p class="muted">No warranties recorded.</p>'}async function add(){const r=await fetch('/api/v2/repair-orders/'+ro.value+'/warranty',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({months:Number(months.value),miles:Number(miles.value),start_mileage:Number(start.value)||null,notes:notes.value})}),d=await r.json();if(!r.ok)return alert(d.error||'Unable to add warranty');ro.value=start.value=notes.value='';load()}load();</script></body></html>
