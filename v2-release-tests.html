<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Isolation Tests</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.row{display:grid;grid-template-columns:1fr 120px 2fr;gap:12px;padding:11px 0;border-bottom:1px solid #283139}.yes{color:#58c87b}.no{color:#f06b62}.muted{color:#89959e}.banner{padding:16px;border-radius:9px;font-weight:bold}.good{background:#102219;border:1px solid #2d6c42}.bad{background:#241511;border:1px solid #6e392f}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}@media(max-width:650px){.row{display:block}.row>*{margin:5px 0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Multi-Shop Isolation Tests</h1><p class="muted">Release safety checks for shop ownership and cross-shop data relationships.</p><button class="btn" onclick="load()">Run Isolation Tests</button><div id="banner" class="card">Waiting to run…</div><section class="card"><h2>Critical Tables</h2><div id="tables"></div></section><section class="card"><h2>Cross-Shop Relationship Checks</h2><div id="orphans"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const row=(a,b,c)=>`<div class="row"><b>${esc(a)}</b><strong class="${b?'yes':'no'}">${b?'PASS':'FAIL'}</strong><span class="muted">${esc(c||'')}</span></div>`;async function load(){const r=await fetch('/api/v2/release-tests'),d=await r.json();if(!r.ok){banner.className='banner bad';banner.textContent=d.error||'Unable to run tests';return}banner.className='banner '+(d.ok?'good':'bad');banner.textContent=d.ok?'Isolation checks passed.':'Isolation checks found a release blocker.';tables.innerHTML=d.isolation.map(x=>row(x.table,x.ok,x.detail)).join('');orphans.innerHTML=d.orphan_checks.map(x=>row(x.name,x.ok,x.count===null?(x.error||'error'):`${x.count} problems detected`)).join('')}load();</script></body></html>
