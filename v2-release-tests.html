<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Release Tests</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.row{display:grid;grid-template-columns:1fr 120px 2fr;gap:12px;padding:11px 0;border-bottom:1px solid #283139}.yes{color:#58c87b}.no{color:#f06b62}.muted{color:#89959e}.banner{padding:16px;border-radius:9px;font-weight:bold}.good{background:#102219;border:1px solid #2d6c42}.bad{background:#241511;border:1px solid #6e392f}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.num{font-size:28px;font-weight:800}@media(max-width:650px){.row{display:block}.row>*{margin:5px 0}.summary{grid-template-columns:1fr}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>V2 Release Tests</h1><p class="muted">Multi-shop isolation and workflow-integrity checks that must pass before release.</p><button class="btn" onclick="load()">Run Release Tests</button><div id="banner" class="card">Waiting to run…</div><div id="summary" class="summary"></div><section class="card"><h2>Release Checks</h2><div id="checks"></div></section><section class="card"><h2>Shop-Scoped Tables</h2><div id="tables"></div></section><section class="card"><h2>Data & Workflow Integrity</h2><div id="integrity"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const row=(a,b,c)=>`<div class="row"><b>${esc(a)}</b><strong class="${b?'yes':'no'}">${b?'PASS':'FAIL'}</strong><span class="muted">${esc(c||'')}</span></div>`;async function load(){const r=await fetch('/api/v2/release-tests'),d=await r.json();if(!r.ok){banner.className='banner bad';banner.textContent=d.error||'Unable to run tests';return}const failed=[...(d.isolation||[]),...(d.data_checks||[])].filter(x=>!x.ok).length;banner.className='banner '+(d.ok?'good':'bad');banner.textContent=d.ok?'All V2 release integrity checks passed.':'V2 release tests found blockers that must be fixed before deployment.';summary.innerHTML=`<div class="card"><div class="num">${(d.isolation||[]).length}</div><div class="muted">Scoped tables checked</div></div><div class="card"><div class="num">${(d.data_checks||[]).length}</div><div class="muted">Integrity checks</div></div><div class="card"><div class="num ${failed?'no':'yes'}">${failed}</div><div class="muted">Failures</div></div>`;checks.innerHTML=(d.checks||[]).map(x=>row(x.label,x.ok,x.ok?'Passed':'Release blocker')).join('');tables.innerHTML=(d.isolation||[]).map(x=>row(x.table,x.ok,x.detail)).join('');integrity.innerHTML=(d.data_checks||[]).map(x=>row(x.name,x.ok,x.count===null?(x.error||'error'):`${x.count} problems detected`)).join('')||'<div class="muted">No integrity checks returned.</div>'}load();</script></body></html>
