<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Release Tests</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.row{display:grid;grid-template-columns:1.25fr 100px 2fr;gap:12px;padding:11px 0;border-bottom:1px solid #283139}.yes{color:#58c87b}.no{color:#f06b62}.muted{color:#89959e}.banner{padding:16px;border-radius:9px;font-weight:bold;margin:14px 0}.good{background:#102219;border:1px solid #2d6c42}.bad{background:#241511;border:1px solid #6e392f}.running{background:#171c21;border:1px solid #39444d}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.num{font-size:28px;font-weight:800}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.filter{background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:9px}.hidden{display:none}.stamp{margin-left:auto}.failure{border-left:3px solid #f06b62;padding-left:10px}@media(max-width:650px){.row{display:block}.row>*{margin:5px 0}.summary{grid-template-columns:1fr 1fr}.stamp{margin-left:0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>V2 Release Tests</h1><p class="muted">Multi-shop isolation and workflow-integrity checks that must pass before release.</p><div class="toolbar"><button id="runBtn" class="btn" onclick="load()">Run Release Tests</button><label class="muted"><input id="failOnly" type="checkbox" onchange="render()"> Show failures only</label><span id="stamp" class="muted stamp"></span></div><div id="banner" class="banner running">Waiting to run…</div><div id="summary" class="summary"></div><section class="card"><h2>Release Checks</h2><div id="checks"></div></section><section class="card"><h2>Shop-Scoped Tables</h2><div id="tables"></div></section><section class="card"><h2>Data & Workflow Integrity</h2><div id="integrity"></div></section></main><script>
let result=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const row=(a,b,c)=>`<div class="row ${b?'':'failure'}"><b>${esc(a)}</b><strong class="${b?'yes':'no'}">${b?'PASS':'FAIL'}</strong><span class="muted">${esc(c||'')}</span></div>`;function visible(items){return failOnly.checked?(items||[]).filter(x=>!x.ok):(items||[])}function render(){if(!result)return;const d=result,iso=d.isolation||[],data=d.data_checks||[],failed=[...iso,...data].filter(x=>!x.ok).length;summary.innerHTML=`<div class="card"><div class="num">${iso.length}</div><div class="muted">Scoped tables</div></div><div class="card"><div class="num">${data.length}</div><div class="muted">Integrity tests</div></div><div class="card"><div class="num ${failed?'no':'yes'}">${failed}</div><div class="muted">Failures</div></div><div class="card"><div class="num">${esc(d.current_shop?.repair_orders??0)}</div><div class="muted">Current-shop ROs</div></div>`;checks.innerHTML=visible(d.checks).map(x=>row(x.label,x.ok,x.ok?'Passed':'Release blocker')).join('')||'<div class="muted">No failures in this section.</div>';tables.innerHTML=visible(iso).map(x=>row(x.table,x.ok,x.detail)).join('')||'<div class="muted">No failures in this section.</div>';integrity.innerHTML=visible(data).map(x=>row(x.name,x.ok,x.count===null?(x.error||'Test error'):`${x.count} problem${x.count===1?'':'s'} detected`)).join('')||'<div class="muted">No failures in this section.</div>';stamp.textContent=d.timestamp?'Last run: '+new Date(d.timestamp).toLocaleString():''}
async function load(){runBtn.disabled=true;banner.className='banner running';banner.textContent='Running V2 release integrity tests…';try{const r=await fetch('/api/v2/release-tests',{headers:{Accept:'application/json'},cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to run tests');result=d;banner.className='banner '+(d.ok?'good':'bad');banner.textContent=d.ok?'All V2 release integrity checks passed.':'V2 release tests found blockers that must be fixed before deployment.';render()}catch(e){result=null;banner.className='banner bad';banner.textContent=e.message||'Unable to run tests';summary.innerHTML='';checks.innerHTML=tables.innerHTML=integrity.innerHTML='<div class="muted">Test results unavailable.</div>';stamp.textContent=''}finally{runBtn.disabled=false}}
load();
</script></body></html>
