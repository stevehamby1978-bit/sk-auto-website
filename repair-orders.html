<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garavex | Repair Orders</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0f172a;color:#e5e7eb}.header{background:#0b1220;border-bottom:4px solid #ef3e23;padding:18px 20px}.header-inner{width:94%;max-width:1250px;margin:auto;display:flex;align-items:center;gap:18px}.header img{width:145px;max-width:35vw}.header h1{margin:0;font-size:28px}.header p{margin:4px 0 0;color:#9ca3af}.container{width:94%;max-width:1250px;margin:26px auto 50px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}.toolbar h2{margin:0}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{display:inline-block;background:#ef3e23;color:#fff;border:0;border-radius:7px;padding:11px 16px;font-weight:700;text-decoration:none;cursor:pointer}.btn.secondary{background:#334155}.btn:hover{opacity:.92}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:#172033;border:1px solid #263449;border-radius:10px;padding:16px}.stat span{display:block;color:#9ca3af;font-size:13px;text-transform:uppercase;letter-spacing:.04em}.stat strong{display:block;margin-top:6px;font-size:25px}.filters{background:#172033;border:1px solid #263449;border-radius:10px;padding:14px;display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;margin-bottom:18px}input,select{width:100%;border:1px solid #475569;border-radius:7px;padding:11px 12px;background:#fff;color:#111827;font-size:14px}.orders{display:grid;gap:14px}.order{background:#fff;color:#1f2937;border-radius:10px;overflow:hidden;box-shadow:0 5px 18px rgba(0,0,0,.22);border:1px solid #dbe1e8}.order-top{display:grid;grid-template-columns:1.2fr 1fr auto;gap:16px;align-items:center;background:#1f3655;color:#fff;padding:15px 18px}.ro-title{font-size:18px;font-weight:800}.ro-date{color:#cbd5e1;font-size:13px;margin-top:4px}.status{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;text-transform:uppercase;white-space:nowrap}.status.waiting{background:#f5c518;color:#111}.status.in_progress{background:#2563eb;color:#fff}.status.completed{background:#22c55e;color:#082f16}.status.cancelled{background:#dc2626;color:#fff}.order-body{padding:17px}.primary-grid{display:grid;grid-template-columns:1fr 1fr 160px 160px;gap:12px}.info{background:#f3f4f6;border-radius:8px;padding:12px;min-height:72px}.info label{display:block;color:#64748b;font-size:11px;text-transform:uppercase;font-weight:800;margin-bottom:5px}.info strong{font-size:15px}.muted{color:#64748b;font-size:13px;margin-top:3px}.payment-paid{color:#15803d}.payment-partial{color:#b45309}.payment-unpaid{color:#b91c1c}.order-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid #e5e7eb}.concern{color:#475569;font-size:13px;max-width:700px}.empty{text-align:center;background:#172033;border:1px solid #263449;border-radius:10px;padding:45px;color:#cbd5e1}.count{color:#94a3b8;font-size:14px}.hidden{display:none!important}@media(max-width:850px){.summary{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.order-top{grid-template-columns:1fr auto}.order-top .vehicle-head{grid-column:1/-1;grid-row:2}.primary-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.header-inner{align-items:flex-start}.header img{width:100px}.header h1{font-size:22px}.summary,.filters,.primary-grid{grid-template-columns:1fr}.filters input{grid-column:auto}.order-top{grid-template-columns:1fr}.order-top .vehicle-head{grid-column:auto;grid-row:auto}.order-bottom{align-items:stretch;flex-direction:column}.order-bottom .btn{text-align:center}.stat strong{font-size:21px}}
</style>
</head>
<body>
<header class="header"><div class="header-inner"><div style="font-weight:900;font-size:24px;letter-spacing:1px">GARAVEX</div><div><h1>Repair Orders</h1><p>Shop workflow & repair status</p></div></div></header>
<main class="container">
  <div class="toolbar"><div><h2>Repair Order Queue</h2><div class="count" id="resultCount">Loading repair orders...</div></div><div class="actions"><a class="btn secondary" href="dashboard.html">Dashboard</a><a class="btn secondary" href="customers.html">Customers</a><button class="btn" type="button" onclick="loadRepairOrders()">Refresh</button></div></div>
  <section class="summary">
    <div class="stat"><span>Waiting</span><strong id="waitingCount">—</strong></div>
    <div class="stat"><span>In Progress</span><strong id="progressCount">—</strong></div>
    <div class="stat"><span>Completed</span><strong id="completedCount">—</strong></div>
    <div class="stat"><span>Outstanding</span><strong id="outstandingTotal">—</strong></div>
  </section>
  <section class="filters">
    <input id="searchInput" type="search" placeholder="Search RO #, customer, phone, vehicle or VIN…">
    <select id="statusFilter"><option value="all">All statuses</option><option value="waiting">Waiting</option><option value="in_progress">In Progress</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select>
    <select id="paymentFilter"><option value="all">All payments</option><option value="unpaid">Unpaid</option><option value="partial">Partial</option><option value="paid">Paid</option></select>
    <button class="btn secondary" type="button" id="clearFilters">Clear</button>
  </section>
  <div id="repairOrders" class="orders"><div class="empty">Loading repair orders...</div></div>
</main>
<script>
let allOrders=[];
let currentEmployee=null;
function money(v){return '$'+(Number(v)||0).toFixed(2)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function normalizeStatus(v){return String(v||'waiting').toLowerCase().replace(/\s+/g,'_')}
function paymentState(o){const total=Number(o.total ?? o.subtotal ?? 0)||0;const paid=Number(o.amount_paid||0)||0;const explicit=String(o.payment_status||'').toLowerCase();if(explicit==='paid'||(total>0&&paid>=total))return 'paid';if(explicit==='partial'||paid>0)return 'partial';return 'unpaid'}
function balance(o){if(o.balance!=null)return Math.max(0,Number(o.balance)||0);const total=Number(o.total ?? o.subtotal ?? 0)||0;return Math.max(0,total-(Number(o.amount_paid)||0))}
function formatDate(v){if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleDateString()}
function vehicleText(o){return [o.vehicle_year,o.vehicle_make,o.vehicle_model].filter(Boolean).join(' ')||'Vehicle not listed'}
function updateSummary(){const active=allOrders.filter(o=>normalizeStatus(o.status)!=='cancelled');document.getElementById('waitingCount').textContent=active.filter(o=>normalizeStatus(o.status)==='waiting').length;document.getElementById('progressCount').textContent=active.filter(o=>normalizeStatus(o.status)==='in_progress').length;document.getElementById('completedCount').textContent=active.filter(o=>normalizeStatus(o.status)==='completed').length;const outstanding=active.reduce((sum,o)=>sum+balance(o),0);document.getElementById('outstandingTotal').textContent=money(outstanding)}
function renderOrders(){const q=document.getElementById('searchInput').value.trim().toLowerCase();const sf=document.getElementById('statusFilter').value;const pf=document.getElementById('paymentFilter').value;const filtered=allOrders.filter(o=>{const st=normalizeStatus(o.status),ps=paymentState(o);const hay=[o.id,o.customer_name,o.customer_phone,o.customer_email,o.vehicle_year,o.vehicle_make,o.vehicle_model,o.vehicle_vin].filter(Boolean).join(' ').toLowerCase();return(!q||hay.includes(q))&&(sf==='all'||st===sf)&&(pf==='all'||ps===pf)});document.getElementById('resultCount').textContent=`Showing ${filtered.length} of ${allOrders.length} repair order${allOrders.length===1?'':'s'}`;const c=document.getElementById('repairOrders');if(!filtered.length){c.innerHTML='<div class="empty">No repair orders match these filters.</div>';return}c.innerHTML=filtered.map(o=>{const st=normalizeStatus(o.status),ps=paymentState(o),veh=vehicleText(o);const total=Number(o.total ?? o.subtotal ?? 0)||0;const bal=balance(o);const created=formatDate(o.created_at);const concern=o.customer_concern?`<div class="concern"><strong>Concern:</strong> ${esc(o.customer_concern)}</div>`:'<div class="concern">No customer concern entered.</div>';return `<article class="order"><div class="order-top"><div><div class="ro-title">Repair Order #${esc(o.id)}</div><div class="ro-date">${created?'Created '+esc(created):'Open repair order'}</div></div><div class="vehicle-head"><strong>${esc(veh)}</strong><div class="ro-date">${o.vehicle_mileage?esc(o.vehicle_mileage)+' miles':''}</div></div><span class="status ${st}">${esc(st.replace('_',' '))}</span></div><div class="order-body"><div class="primary-grid"><div class="info"><label>Customer</label><strong>${esc(o.customer_name||'Not listed')}</strong><div class="muted">${esc(o.customer_phone||'')}</div></div><div class="info"><label>Vehicle</label><strong>${esc(veh)}</strong><div class="muted">${o.vehicle_vin?'VIN '+esc(o.vehicle_vin):'VIN not listed'}</div></div><div class="info"><label>RO Total</label><strong>${money(total)}</strong></div><div class="info"><label>Payment</label><strong class="payment-${ps}">${ps.toUpperCase()}</strong><div class="muted">Balance ${money(bal)}</div></div></div><div class="order-bottom">${concern}<div style="display:flex;gap:8px;flex-wrap:wrap">${currentEmployee?.role==='owner'?`<button class="btn secondary" type="button" onclick="deleteRepairOrder(${Number(o.id)})">Delete Test RO</button>`:''}<button class="btn" type="button" onclick="location.href='/repair-order.html?id=${encodeURIComponent(o.id)}'">Open Repair Order</button></div></div></div></article>`}).join('')}
async function loadCurrentEmployee(){try{const r=await fetch('/api/current-employee');if(r.ok){const data=await r.json();currentEmployee=data.employee||null}}catch(e){console.error(e)}}
async function deleteRepairOrder(id){const typed=window.prompt(`Permanently delete TEST repair order #${id}?\n\nThis cannot be undone. Type DELETE ${id} to confirm.`);if(typed!==`DELETE ${id}`)return;try{const r=await fetch(`/api/repair-orders/${encodeURIComponent(id)}`,{method:'DELETE'});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Unable to delete repair order');alert(data.message||'Repair order deleted.');await loadRepairOrders()}catch(e){alert(e.message)}}
async function loadRepairOrders(){const c=document.getElementById('repairOrders');c.innerHTML='<div class="empty">Loading repair orders...</div>';try{const r=await fetch('/api/repair-orders');if(!r.ok)throw new Error('Unable to load repair orders');const data=await r.json();allOrders=Array.isArray(data)?data:[];allOrders.sort((a,b)=>Number(b.id||0)-Number(a.id||0));updateSummary();renderOrders()}catch(e){console.error(e);document.getElementById('resultCount').textContent='Unable to load repair orders';c.innerHTML='<div class="empty">Unable to load repair orders. Please refresh and try again.</div>'}}
document.getElementById('searchInput').addEventListener('input',renderOrders);document.getElementById('statusFilter').addEventListener('change',renderOrders);document.getElementById('paymentFilter').addEventListener('change',renderOrders);document.getElementById('clearFilters').addEventListener('click',()=>{document.getElementById('searchInput').value='';document.getElementById('statusFilter').value='all';document.getElementById('paymentFilter').value='all';renderOrders()});loadCurrentEmployee().then(loadRepairOrders);
</script>
</body>
</html>
