<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S&K Auto | Repair Orders</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111827;
    color: white;
}

.header {
    background: #0b1220;
    border-bottom: 4px solid #ef3e23;
    padding: 20px;
    text-align: center;
}

.header img {
    max-width: 190px;
    width: 100%;
}

.header h1 {
    margin: 10px 0 4px;
}

.header p {
    margin: 0;
    color: #bbb;
}

.container {
    width: 94%;
    max-width: 1100px;
    margin: 30px auto;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.topbar h2 {
    margin: 0;
}

button {
    background: #ef3e23;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 11px 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.order {
    background: white;
    color: #222;
    border-radius: 10px;
    margin-bottom: 22px;
    overflow: hidden;
    box-shadow: 0 5px 18px rgba(0,0,0,.25);
}

.order-header {
    background: #1f3655;
    color: white;
    padding: 15px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.order-header h3 {
    margin: 0;
}

.status {
    background: #f59e0b;
    color: #111;
    padding: 6px 11px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    text-transform: uppercase;
}

.order-body {
    padding: 18px;
}

.customer-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 20px;
}

.info-box {
    background: #f3f4f6;
    padding: 14px;
    border-radius: 7px;
}

.info-box strong {
    display: block;
    margin-bottom: 5px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th {
    background: #1f3655;
    color: white;
    padding: 11px;
    text-align: left;
}

td {
    padding: 11px;
    border-bottom: 1px solid #ddd;
}

.money {
    text-align: right;
}

.total {
    text-align: right;
    font-size: 20px;
    font-weight: bold;
    margin-top: 18px;
}

.empty {
    text-align: center;
    padding: 50px;
    color: #bbb;
}

@media (max-width: 700px) {
    .customer-grid {
        grid-template-columns: 1fr;
    }

    .topbar {
        display: block;
    }

    .topbar button {
        margin-top: 12px;
    }

    table {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="header">
    <img src="sk-auto-logo.jpg" alt="S&K Auto">
    <h1>Repair Orders</h1>
    <p>The Art of Automotive Repair</p>
</div>

<div class="container">

    <div class="topbar">
        <h2>Active Repair Orders</h2>
        <button onclick="loadRepairOrders()">Refresh Orders</button>
    </div>

    <div id="repairOrders">
        <div class="empty">Loading repair orders...</div>
    </div>

</div>

<script>

function money(value) {
    return '$' + (Number(value) || 0).toFixed(2);
}

async function loadRepairOrders() {

    const container = document.getElementById('repairOrders');

    try {

        const response = await fetch('/api/repair-orders');

        if (!response.ok) {
            throw new Error('Unable to load repair orders');
        }

        const orders = await response.json();

        if (!Array.isArray(orders) || orders.length === 0) {
            container.innerHTML =
                '<div class="empty">No repair orders yet.</div>';
            return;
        }

        container.innerHTML = '';

        orders.forEach(order => {

            const card = document.createElement('div');
            card.className = 'order';

            const vehicle = [
                order.vehicle_year,
                order.vehicle_make,
                order.vehicle_model
            ].filter(Boolean).join(' ');

            let rows = '';

            if (Array.isArray(order.items)) {

                order.items.forEach(item => {

                    const parts = Number(item.parts) || 0;
                    const labor = Number(item.labor) || 0;

                    rows += `
                        <tr>
                            <td>${item.description || ''}</td>
                            <td class="money">${money(parts)}</td>
                            <td class="money">${money(labor)}</td>
                            <td class="money">${money(parts + labor)}</td>
                        </tr>
                    `;

                });

            }

            card.innerHTML = `
                <div class="order-header">
                    <h3>Repair Order #${order.id}</h3>
                    <span class="status">${order.status || 'waiting'}</span>
                </div>

                <div class="order-body">

                    <div class="customer-grid">

                        <div class="info-box">
                            <strong>Customer</strong>
                            ${order.customer_name || ''}<br>
                            ${order.customer_phone || ''}<br>
                            ${order.customer_email || ''}
                        </div>

                        <div class="info-box">
                            <strong>Vehicle</strong>
                            ${vehicle}<br>
                            Mileage: ${order.vehicle_mileage || ''}<br>
                            VIN: ${order.vehicle_vin || ''}
                        </div>

                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th>Description</th>
                                <th>Parts</th>
                                <th>Labor</th>
                                <th>Total</th>
                            </tr>
                        </thead>

                        <tbody>
                            ${rows}
                        </tbody>
                    </table>

                    <div class="total">
                        Repair Order Total:
                        ${money(order.subtotal)}
                    </div>
<div style="margin-top:15px; text-align:right;">
  <button
    onclick="window.location.href='/repair-order.html?id=${order.id}'"
    style="background:#ef3e23;color:white;border:none;padding:10px 18px;border-radius:5px;font-weight:bold;cursor:pointer;">
    Open Repair Order
  </button>
</div>
                </div>
            `;

            container.appendChild(card);

        });

    } catch (error) {

        console.error(error);

        container.innerHTML =
            '<div class="empty">Unable to load repair orders.</div>';

    }
}

loadRepairOrders();

</script>

</body>
</html>
