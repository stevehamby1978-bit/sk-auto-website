<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Check In</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:20px;margin:14px 0}.muted{color:#89959e}input,textarea{width:100%;background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:12px;margin:6px 0}.result{padding:12px;border-bottom:1px solid #283139;cursor:pointer}.result:hover,.selected{background:#1a2127}.btn{background:#df3329;color:white;border:0;border-radius:7px;padding:12px 16px;font-weight:bold;cursor:pointer}.vehicle{font-weight:bold}.success{padding:14px;border:1px solid #2d6c42;background:#102219;border-radius:8px;margin-top:12px}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Fast Vehicle Check-In</h1><p class="muted">Find the customer, confirm the vehicle and capture why it is here.</p><section class="card"><label>Search customer, phone, email or VIN</label><input id="search" placeholder="Start typing…"><div id="results"></div></section><section class="card" id="form" hidden><h2 id="who"></h2><div id="car" class="muted"></div><label>Current mileage</label><input id="mileage" inputmode="numeric" placeholder="Mileage"><label>Customer concern</label><textarea id="concern" rows="5" placeholder="Describe exactly what the customer says the vehicle is doing…"></textarea><button class="btn" onclick="checkin()">Check Vehicle In</button><div id="message"></div></section></main><script>let selected=null,timer;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));search.oninput=()=>{clearTimeout(timer);timer=setTimeout(find,250)};async function find(){const q=search.value.trim();if(q.length<2){results.innerHTML='';return}const r=await fetch('/api/v2/checkin/customers?q='+encodeURIComponent(q)),d=await r.json();results.innerHTML=d.map((x,i)=>`<div class="result" onclick="choose(${i})"><b>${esc(x.name)}</b><div class="vehicle">${esc([x.year,x.make,x.model].filter(Boolean).join(' ')||'No vehicle')}</div><div class="muted">${esc(x.phone||'')} ${x.vin?'· VIN '+esc(x.vin):''}</div></div>`).join('')||'<div class="muted" style="padding:12px">No matches.</div>';window.matches=d}function choose(i){selected=window.matches[i];if(!selected.vehicle_id){alert('Add a vehicle to this customer before check-in.');return}who.textContent=selected.name;car.textContent=[selected.year,selected.make,selected.model].filter(Boolean).join(' ')+(selected.vin?' · '+selected.vin:'');mileage.value=selected.mileage||'';form.hidden=false;concern.focus()}async function checkin(){if(!selected)return;const r=await fetch('/api/v2/checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:selected.id,vehicle_id:selected.vehicle_id,mileage:mileage.value,customer_concern:concern.value})}),d=await r.json();if(!r.ok){alert(d.error||'Unable to check in');return}message.innerHTML=`<div class="success"><b>Checked in.</b> Repair Order #${d.repair_order_id}${d.reused_existing?' was updated.':' was created.'}</div>`;concern.value=''};</script></body></html>
