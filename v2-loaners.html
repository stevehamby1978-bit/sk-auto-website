<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Loaners</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1150px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.loaner{background:#0b0f12;border:1px solid #303942;border-radius:9px;padding:14px}.muted{color:#89959e}.available{color:#58c87b}.out{color:#f2b84b}.form{display:grid;grid-template-columns:1fr 80px 1fr 1fr 120px auto;gap:8px}input{background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:10px}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}.return{background:#252d34;color:#fff;border:1px solid #37414a;border-radius:6px;padding:8px;cursor:pointer}@media(max-width:750px){.form{display:block}.form>*{width:100%;margin:5px 0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Loaner Vehicles</h1><p class="muted">Track shop loaners, who has them, and when they are due back.</p><section class="card"><h2>Add Loaner</h2><div class="form"><input id="name" placeholder="Unit name / #"><input id="year" placeholder="Year"><input id="make" placeholder="Make"><input id="model" placeholder="Model"><input id="plate" placeholder="Plate"><button class="btn" onclick="addLoaner()">Add</button></div></section><section class="card"><h2>Fleet</h2><div id="fleet" class="grid"></div></section><section class="card"><h2>Currently Out</h2><div id="out" class="grid"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/v2/loaners'),d=await r.json();if(!r.ok)return alert(d.error||'Unable to load loaners');fleet.innerHTML=d.vehicles.length?d.vehicles.map(x=>`<div class="loaner"><b>${esc(x.name)}</b><div>${esc([x.year,x.make,x.model].filter(Boolean).join(' '))}</div><div class="${x.status}">${esc(x.status)}</div>${x.status==='available'?`<hr><input id="ro${x.id}" type="number" placeholder="RO #" style="width:100%"><input id="due${x.id}" type="datetime-local" style="width:100%;margin-top:6px"><button class="btn" style="width:100%;margin-top:6px" onclick="checkout(${x.id})">Check Out</button>`:''}</div>`).join(''):'<p class="muted">No loaners configured.</p>';out.innerHTML=d.assignments.length?d.assignments.map(x=>`<div class="loaner"><b>${esc(x.loaner_name)} · ${esc(x.customer_name)}</b><div class="muted">RO #${x.repair_order_id} · ${esc([x.vehicle_year,x.vehicle_make,x.vehicle_model].filter(Boolean).join(' '))}</div><p>Due: ${esc(x.due_back_at||'Not set')}</p><button class="return" onclick="returnLoaner(${x.id})">Mark Returned</button></div>`).join(''):'<p class="muted">No loaners currently out.</p>'}async function addLoaner(){const r=await fetch('/api/v2/loaners',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,year:year.value,make:make.value,model:model.value,plate:plate.value})}),d=await r.json();if(!r.ok)return alert(d.error||'Unable to add');name.value=year.value=make.value=model.value=plate.value='';load()}async function checkout(id){const r=await fetch('/api/v2/loaners/'+id+'/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({repair_order_id:Number(document.getElementById('ro'+id).value),due_back_at:document.getElementById('due'+id).value||null})}),d=await r.json();if(!r.ok)return alert(d.error||'Unable to check out');load()}async function returnLoaner(id){const r=await fetch('/api/v2/loaner-assignments/'+id+'/return',{method:'PATCH'}),d=await r.json();if(!r.ok)return alert(d.error||'Unable to return');load()}load();</script></body></html>
