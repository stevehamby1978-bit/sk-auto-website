<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Loaners</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.loaner{background:#0b0f12;border:1px solid #303942;border-radius:9px;padding:14px}.muted{color:#89959e}.available{color:#58c87b}.out{color:#f2b84b}.maintenance,.overdue{color:#ff655d}.form{display:grid;grid-template-columns:1fr 80px 1fr 1fr 120px 1.2fr auto;gap:8px}input,select,textarea{background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:10px;width:100%}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}.btn.secondary{background:#252d34;border:1px solid #37414a}.btn:disabled{opacity:.55}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#10151a;border:1px solid #29323a;border-radius:10px;padding:14px}.metric b{display:block;font-size:24px;margin-top:5px}.checkout{border-top:1px solid #283139;margin-top:10px;padding-top:10px}.checkout>*{margin-top:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}.msg{min-height:18px;margin-top:8px}.ok{color:#58c87b}.error{color:#ff655d}.due{font-weight:bold}.tag{font-size:11px;text-transform:uppercase;font-weight:bold}.details{line-height:1.55}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px}.search{margin:0}@media(max-width:800px){.form{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}}@media(max-width:520px){.form,.summary,.toolbar,.two{display:block}.form>*,.metric,.two>*{margin:6px 0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Loaner Vehicles</h1><p class="muted">Manage the fleet, active assignments, mileage, fuel and due-back times.</p><section class="summary"><div class="metric"><span class="muted">Fleet</span><b id="fleetCount">0</b></div><div class="metric"><span class="muted">Available</span><b id="availableCount">0</b></div><div class="metric"><span class="muted">Currently Out</span><b id="outCount">0</b></div><div class="metric"><span class="muted">Overdue</span><b id="overdueCount">0</b></div></section><section class="card"><h2>Add Loaner</h2><div class="form"><input id="name" maxlength="150" placeholder="Unit name / #"><input id="year" maxlength="10" placeholder="Year"><input id="make" maxlength="100" placeholder="Make"><input id="model" maxlength="100" placeholder="Model"><input id="plate" maxlength="30" placeholder="Plate"><input id="vin" maxlength="30" placeholder="VIN"><button id="addBtn" class="btn" onclick="addLoaner()">Add Loaner</button></div><div id="message" class="msg muted"></div></section><section class="card"><div class="toolbar"><h2>Fleet</h2><input id="search" class="search" placeholder="Search fleet" oninput="render()"></div><div id="fleet" class="grid"></div></section><section class="card"><h2>Currently Out</h2><div id="assignments" class="grid"></div></section></main><script>
let data={vehicles:[],assignments:[]};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o){const r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function msg(text,type='muted'){message.className='msg '+type;message.textContent=text||''}function dateText(v){if(!v)return'Not set';const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleString()}function metrics(){fleetCount.textContent=data.vehicles.length;availableCount.textContent=data.vehicles.filter(x=>x.status==='available').length;outCount.textContent=data.assignments.length;overdueCount.textContent=data.assignments.filter(x=>Number(x.overdue)===1).length}function checkoutForm(x){return `<div class="checkout"><b>Assign to repair order</b><input id="ro${x.id}" type="number" min="1" placeholder="Repair order #"><div class="two"><label class="muted">Checked out<input id="checkout${x.id}" type="datetime-local"></label><label class="muted">Due back<input id="due${x.id}" type="datetime-local"></label></div><div class="two"><input id="mileage${x.id}" type="number" min="0" step="1" placeholder="Out mileage"><select id="fuel${x.id}"><option value="">Fuel level</option><option value="empty">Empty</option><option value="1/4">1/4</option><option value="1/2">1/2</option><option value="3/4">3/4</option><option value="full">Full</option></select></div><input id="note${x.id}" maxlength="1000" placeholder="Checkout note"><button class="btn" style="width:100%" onclick="checkout(${x.id})">Check Out</button></div>`}function render(){const q=search.value.trim().toLowerCase(),vehicles=data.vehicles.filter(x=>!q||[x.name,x.year,x.make,x.model,x.plate,x.vin,x.status].some(v=>String(v||'').toLowerCase().includes(q)));fleet.innerHTML=vehicles.length?vehicles.map(x=>`<div class="loaner"><div><b>${esc(x.name)}</b> <span class="tag ${esc(x.status)}">${esc(x.status)}</span></div><div class="details">${esc([x.year,x.make,x.model].filter(Boolean).join(' ')||'Vehicle details not entered')}<br><span class="muted">Plate: ${esc(x.plate||'—')} · VIN: ${esc(x.vin||'—')}</span></div>${x.status==='available'?checkoutForm(x):''}</div>`).join(''):'<p class="muted">No loaners match this view.</p>';assignments.innerHTML=data.assignments.length?data.assignments.map(x=>`<div class="loaner"><div><b>${esc(x.loaner_name)} · ${esc(x.customer_name)}</b> ${Number(x.overdue)===1?'<span class="tag overdue">OVERDUE</span>':''}</div><div class="details muted">RO #${esc(x.repair_order_id)} · ${esc([x.vehicle_year,x.vehicle_make,x.vehicle_model].filter(Boolean).join(' ')||'Customer vehicle')}<br>Checked out: ${esc(dateText(x.checked_out_at))}<br><span class="due ${Number(x.overdue)===1?'overdue':''}">Due: ${esc(dateText(x.due_back_at))}</span>${x.out_mileage!=null?`<br>Out mileage: ${esc(x.out_mileage)}`:''}${x.out_fuel?` · Fuel: ${esc(x.out_fuel)}`:''}${x.note?`<br>Note: ${esc(x.note)}`:''}</div><button class="btn secondary" style="width:100%;margin-top:10px" onclick="returnLoaner(${x.id})">Mark Returned</button></div>`).join(''):'<p class="muted">No loaners currently out.</p>'}async function load(){try{data=await api('/api/v2/loaners');metrics();render()}catch(e){msg(e.message,'error')}}async function addLoaner(){const nameEl=document.getElementById('name'),yearEl=document.getElementById('year'),makeEl=document.getElementById('make'),modelEl=document.getElementById('model'),plateEl=document.getElementById('plate'),vinEl=document.getElementById('vin'),button=document.getElementById('addBtn'),n=nameEl.value.trim();if(!n)return msg('Loaner name is required.','error');button.disabled=true;msg('Saving…');try{await api('/api/v2/loaners',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,year:yearEl.value.trim(),make:makeEl.value.trim(),model:modelEl.value.trim(),plate:plateEl.value.trim(),vin:vinEl.value.trim()})});[nameEl,yearEl,makeEl,modelEl,plateEl,vinEl].forEach(el=>{el.value=''});msg('Loaner added.','ok');await load()}catch(e){msg(e.message,'error')}finally{button.disabled=false}}async function checkout(id){const roEl=document.getElementById('ro'+id),m=document.getElementById('mileage'+id),f=document.getElementById('fuel'+id),checkoutAt=document.getElementById('checkout'+id),due=document.getElementById('due'+id),note=document.getElementById('note'+id),ro=Number(roEl.value);if(!Number.isInteger(ro)||ro<1)return msg('Enter a valid repair order number.','error');const mileage=m.value===''?null:Number(m.value);if(mileage!==null&&(!Number.isInteger(mileage)||mileage<0))return msg('Enter a valid whole-number mileage.','error');try{await api('/api/v2/loaners/'+id+'/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({repair_order_id:ro,checked_out_at:checkoutAt.value||null,due_back_at:due.value||null,out_mileage:mileage,out_fuel:f.value,note:note.value.trim()})});msg('Loaner checked out.','ok');await load()}catch(e){msg(e.message,'error');await load()}}async function returnLoaner(id){try{await api('/api/v2/loaner-assignments/'+id+'/return',{method:'PATCH'});msg('Loaner returned and available again.','ok');await load()}catch(e){msg(e.message,'error');await load()}}load();setInterval(load,60000);
</script></body></html>
