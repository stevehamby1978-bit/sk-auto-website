<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Garavex | Change Password</title>

  <style>

*{box-sizing:border-box}:root{--bg:#0e1114;--panel:#171b20;--line:#323a43;--text:#f5f7f9;--muted:#aeb7c1;--accent:#ef3e23}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text);padding:20px}.password-card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);padding:30px;border-radius:12px;box-shadow:0 12px 35px rgba(0,0,0,.35)}.logo{display:block;width:150px;max-width:100%;margin:0 auto 10px}h1{margin:10px 0 5px;text-align:center;font-size:25px}.subtitle{text-align:center;color:var(--muted);margin-bottom:24px}label{display:block;margin-top:15px;margin-bottom:6px;font-weight:bold}input{width:100%;padding:12px;border:1px solid #46505a;border-radius:7px;font-size:16px;background:#0f1317;color:#fff}button{width:100%;margin-top:21px;padding:13px;border:0;border-radius:7px;background:var(--accent);color:#fff;font-size:16px;font-weight:bold;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}#message{min-height:20px;margin-top:15px;text-align:center;font-weight:bold}.requirements{margin-top:15px;padding:12px;background:#11161b;border:1px solid var(--line);border-radius:7px;color:var(--muted);font-size:14px;line-height:1.5}

</style>
</head>

<body>

  <div class="password-card">

    <div class="logo" style="display:flex;align-items:center;justify-content:center;font-weight:900;font-size:34px;letter-spacing:-1px">G</div>

    <h1>Change Password</h1>

    <div class="subtitle">
      Create your new Garavex employee password.
    </div>

    <form id="changePasswordForm">

      <label for="newPassword">
        New Password
      </label>

      <input
        type="password"
        id="newPassword"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">
        Confirm New Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        autocomplete="new-password"
        required
      >

      <div class="requirements">
        Password must be at least 8 characters long.
      </div>

      <button
        type="submit"
        id="changePasswordButton">
        Change Password
      </button>

      <div id="message"></div>

    </form>

  </div>

  <script>
    const form =
      document.getElementById('changePasswordForm');

    const button =
      document.getElementById('changePasswordButton');

    const message =
      document.getElementById('message');

    form.addEventListener('submit', async event => {
      event.preventDefault();

      const newPassword =
        document.getElementById('newPassword').value;

      const confirmPassword =
        document.getElementById('confirmPassword').value;

      message.textContent = '';

      if (newPassword.length < 8) {
        message.textContent =
          'Password must be at least 8 characters long.';
        return;
      }

      if (newPassword !== confirmPassword) {
        message.textContent =
          'The passwords do not match.';
        return;
      }

      button.disabled = true;
      button.textContent = 'Changing Password...';

      try {
        const response = await fetch(
          '/api/change-password',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              newPassword
            })
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.error ||
            'Unable to change password.'
          );
        }

        window.location.href = '/dashboard.html';

      } catch (error) {
        console.error(error);

        message.textContent =
          error.message ||
          'Unable to change password.';

        button.disabled = false;
        button.textContent = 'Change Password';
      }
    });
  </script>

</body>
</html>
