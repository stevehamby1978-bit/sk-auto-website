<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>S&K Auto | Change Password</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #151515;
      font-family: Arial, Helvetica, sans-serif;
    }

    .password-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    .logo {
      display: block;
      width: 150px;
      max-width: 100%;
      margin: 0 auto 10px;
    }

    h1 {
      margin: 10px 0 5px;
      text-align: center;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      min-height: 20px;
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .requirements {
      margin-top: 15px;
      padding: 12px;
      background: #f3f4f6;
      border-radius: 6px;
      color: #555;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="password-card">

    <img
      src="sk-auto-invoice-logo.png"
      alt="S&K Auto"
      class="logo"
    >

    <h1>Change Password</h1>

    <div class="subtitle">
      Create your new S&K Auto employee password.
    </div>

    <form id="changePasswordForm">

      <label for="newPassword">
        New Password
      </label>

      <input
        type="password"
        id="newPassword"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">
        Confirm New Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        autocomplete="new-password"
        required
      >

      <div class="requirements">
        Password must be at least 8 characters long.
      </div>

      <button
        type="submit"
        id="changePasswordButton">
        Change Password
      </button>

      <div id="message"></div>

    </form>

  </div>

  <script>
    const form =
      document.getElementById('changePasswordForm');

    const button =
      document.getElementById('changePasswordButton');

    const message =
      document.getElementById('message');

    form.addEventListener('submit', async event => {
      event.preventDefault();

      const newPassword =
        document.getElementById('newPassword').value;

      const confirmPassword =
        document.getElementById('confirmPassword').value;

      message.textContent = '';

      if (newPassword.length < 8) {
        message.textContent =
          'Password must be at least 8 characters long.';
        return;
      }

      if (newPassword !== confirmPassword) {
        message.textContent =
          'The passwords do not match.';
        return;
      }

      button.disabled = true;
      button.textContent = 'Changing Password...';

      try {
        const response = await fetch(
          '/api/change-password',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              newPassword
            })
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.error ||
            'Unable to change password.'
          );
        }

        window.location.href = '/dashboard.html';

      } catch (error) {
        console.error(error);

        message.textContent =
          error.message ||
          'Unable to change password.';

        button.disabled = false;
        button.textContent = 'Change Password';
      }
    });
  </script>

</body>
</html>
