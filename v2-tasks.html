<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Tasks</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1050px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.muted{color:#89959e}.form{display:grid;grid-template-columns:1.5fr 100px 100px 170px auto;gap:8px}input,select,textarea{background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:10px}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}.done{background:#246c3b}.task{display:grid;grid-template-columns:1fr 170px 100px;gap:12px;padding:14px 0;border-bottom:1px solid #29323a}.urgent{color:#ff655d}.high{color:#f2b84b}.normal{color:#9aa5ad}@media(max-width:750px){.form,.task{display:block}.form>*{width:100%;margin:5px 0}.task>*{margin:7px 0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Shop Tasks</h1><p class="muted">Assign follow-through work so calls, parts checks and repair-order details do not live on sticky notes.</p><section class="card"><div class="form"><input id="title" placeholder="Task"><input id="ro" type="number" placeholder="RO #"><select id="priority"><option>normal</option><option>high</option><option>urgent</option></select><input id="due" type="datetime-local"><button class="btn" onclick="add()">Create Task</button></div><textarea id="details" rows="2" style="width:100%;margin-top:8px" placeholder="Details"></textarea></section><section class="card"><div id="tasks"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/v2/tasks'),d=await r.json();if(!r.ok){tasks.textContent=d.error||'Unable to load tasks';return}tasks.innerHTML=d.length?d.map(x=>`<div class="task"><div><span class="${x.priority}">${esc(x.priority.toUpperCase())}</span> · <b>${esc(x.title)}</b>${x.repair_order_id?` <span class="muted">RO #${x.repair_order_id}</span>`:''}<div>${esc(x.details||'')}</div></div><div class="muted">${x.assigned_name?'Assigned: '+esc(x.assigned_name)+'<br>':''}${x.due_at?'Due: '+esc(x.due_at):'No due time'}</div><button class="btn done" onclick="complete(${x.id})">Complete</button></div>`).join(''):'<p class="muted">No open tasks.</p>'}async function add(){const r=await fetch('/api/v2/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value,repair_order_id:Number(ro.value)||null,priority:priority.value,due_at:due.value||null,details:details.value})}),d=await r.json();if(!r.ok)return alert(d.error||'Unable to create task');title.value=ro.value=due.value=details.value='';load()}async function complete(id){const r=await fetch('/api/v2/tasks/'+id+'/complete',{method:'PATCH'}),d=await r.json();if(!r.ok)return alert(d.error||'Unable to complete task');load()}load();</script></body></html>
