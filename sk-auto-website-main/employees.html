<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Employees | S&K Auto</title>

  <style>

*{box-sizing:border-box}:root{--bg:#0e1114;--panel:#171b20;--panel2:#11161b;--line:#323a43;--text:#f5f7f9;--muted:#aeb7c1;--accent:#ef3e23;--green:#29965a;--red:#b43b3b}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}.header{background:#15191e;border-bottom:3px solid var(--accent);padding:18px 22px}.header-inner{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}.header h1{margin:0;font-size:27px}.back-btn{display:inline-block;background:#303841;color:#fff;text-decoration:none;padding:10px 15px;border-radius:7px;font-weight:bold}.container{max-width:1100px;margin:27px auto;padding:0 18px 45px}.intro{color:var(--muted);margin:-8px 0 20px}.card{background:var(--panel);border:1px solid var(--line);padding:21px;border-radius:11px;margin-bottom:20px}.card h2{margin:0 0 17px;color:var(--accent)}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{display:block;font-weight:bold;margin-bottom:6px}input,select{width:100%;padding:11px;border:1px solid #46505a;border-radius:7px;background:#0f1317;color:#fff;font-size:15px}.full-width{grid-column:1/-1}button{border:0;border-radius:7px;padding:10px 14px;cursor:pointer;font-size:14px;font-weight:bold;background:#303841;color:#fff}.add-btn{background:var(--accent)}#message{margin-top:12px;font-weight:bold}.employee{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:15px 0;border-bottom:1px solid var(--line)}.employee:last-child{border-bottom:0}.employee-name{font-size:18px;font-weight:bold;margin-bottom:5px}.employee-details{color:#c2c9d0;line-height:1.5}.status{display:inline-block;margin-top:5px;padding:4px 8px;border-radius:20px;font-size:12px;font-weight:bold}.active{background:#163e28;color:#7be5a1}.inactive{background:#4b2020;color:#ffabab}.empty{color:var(--muted);padding:10px 0}@media(max-width:700px){.form-grid{grid-template-columns:1fr}.full-width{grid-column:auto}.header-inner,.employee{align-items:flex-start;flex-direction:column}.back-btn,.employee button{width:100%;text-align:center}}

</style>
</head>

<body>

  <div class="header">
    <div class="header-inner">
      <div>
        <h1>S&K Auto Employee Management</h1>
      </div>

      <a href="/dashboard.html" class="back-btn">
        Back to Dashboard
      </a>
    </div>
  </div>

  <div class="container">
<p class="intro">Manage employee access, roles, temporary passwords, and password resets for this shop.</p>

    <div class="card">
      <h2>Add Employee</h2>

      <form id="employeeForm">

        <div class="form-grid">

          <div>
            <label for="name">Employee Name</label>
            <input
              type="text"
              id="name"
              required
              autocomplete="name"
            >
          </div>

          <div>
            <label for="email">Email / Login</label>
            <input
              type="email"
              id="email"
              required
              autocomplete="email"
            >
          </div>

          <div>
            <label for="password">Temporary Password</label>
            <input
              type="password"
              id="password"
              minlength="8"
              required
              autocomplete="new-password"
            >
          </div>

          <div>
            <label for="role">Employee Role</label>

            <select id="role" required>
              <option value="technician">
                Technician
              </option>

              <option value="service_writer">
                Service Writer
              </option>

              <option value="manager">
                Manager
              </option>

              <option value="owner">
                Owner
              </option>
            </select>
          </div>

          <div class="full-width">
            <button type="submit" class="add-btn">
              Add Employee
            </button>

            <div id="message"></div>
          </div>

        </div>

      </form>
    </div>

    <div class="card">
      <h2>Employees</h2>

      <div id="employees">
        Loading employees...
      </div>
    </div>

  </div>

  <script>
    const employeeForm =
      document.getElementById('employeeForm');

    const message =
      document.getElementById('message');

    const employeesContainer =
      document.getElementById('employees');


    function formatRole(role) {
      if (role === 'owner') {
        return 'Owner';
      }

      if (role === 'manager') {
        return 'Manager';
      }

      if (role === 'service_writer') {
        return 'Service Writer';
      }

      if (role === 'technician') {
        return 'Technician';
      }

      return role || '';
    }


    async function loadEmployees() {
      try {
        const response = await fetch('/api/employees');

        if (!response.ok) {
          throw new Error(
            'Unable to load employees.'
          );
        }

        const employees = await response.json();

        if (!employees.length) {
          employeesContainer.innerHTML =
            '<div class="empty">No employees have been added yet.</div>';

          return;
        }

        employeesContainer.innerHTML =
          employees.map(employee => {

            const statusClass =
              employee.active ? 'active' : 'inactive';

            const statusText =
              employee.active ? 'Active' : 'Inactive';

            return `
              <div class="employee">
                <div>
                  <div class="employee-name">
                    ${escapeHtml(employee.name)}
                  </div>

                  <div class="employee-details">
                    ${escapeHtml(employee.email)}
                    <br>

                    Role:
                    ${escapeHtml(formatRole(employee.role))}
                    <br>

                    <span class="status ${statusClass}">
                      ${statusText}
                    </span>
<br><br>

<button
  type="button"
  onclick="resetEmployeePassword(${Number(employee.id)}, this.dataset.employeeName)"
  data-employee-name="${escapeHtml(employee.name)}">
  Reset Password
</button>
                   
                  </div>
                </div>
              </div>
            `;
          }).join('');

      } catch (error) {
        console.error(error);

        employeesContainer.innerHTML =
          '<div class="empty">Unable to load employees.</div>';
      }
    }


    employeeForm.addEventListener(
      'submit',
      async function(event) {

        event.preventDefault();

        message.textContent = 'Adding employee...';

        const employee = {
          name:
            document.getElementById('name').value.trim(),

          email:
            document.getElementById('email').value.trim(),

          password:
            document.getElementById('password').value,

          role:
            document.getElementById('role').value
        };

        try {
          const response = await fetch(
            '/api/employees',
            {
              method: 'POST',

              headers: {
                'Content-Type': 'application/json'
              },

              body: JSON.stringify(employee)
            }
          );

          const result = await response.json();

          if (!response.ok) {
            throw new Error(
              result.error ||
              'Unable to add employee.'
            );
          }

          message.textContent =
            'Employee added successfully.';

          employeeForm.reset();

          document.getElementById('role').value =
            'technician';

          await loadEmployees();

        } catch (error) {
          console.error(error);

          message.textContent =
            error.message ||
            'Unable to add employee.';
        }
      }
    );


    function escapeHtml(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }
async function resetEmployeePassword(employeeId, employeeName) {
  const temporaryPassword = prompt(
    `Enter a new temporary password for ${employeeName}:`
  );

  if (temporaryPassword === null) {
    return;
  }

  if (temporaryPassword.length < 8) {
    alert('Temporary password must be at least 8 characters.');
    return;
  }

  const confirmed = confirm(
    `Reset ${employeeName}'s password?\n\n` +
    `They will be required to change it the next time they sign in.`
  );

  if (!confirmed) {
    return;
  }

  try {
    const response = await fetch(
      `/api/employees/${employeeId}/reset-password`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
        temporaryPassword: temporaryPassword
        })
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(
        result.error || 'Unable to reset password.'
      );
    }

    alert(
      `${employeeName}'s password has been reset.\n\n` +
      `They must change it the next time they sign in.`
    );

  } catch (error) {
    console.error(error);

    alert(
      error.message || 'Unable to reset password.'
    );
  }
}

    loadEmployees();
  </script>

</body>
</html>
