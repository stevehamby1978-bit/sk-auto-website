<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Repair Authorization</title>

  <style>

*{box-sizing:border-box}:root{--bg:#0e1114;--panel:#fff;--ink:#222;--muted:#66717d;--line:#d9dee3;--accent:#ef3e23;--green:#218838;--red:#c43b3b}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef1f4;color:var(--ink)}.header{background:#15191e;color:#fff;text-align:center;padding:25px 15px;border-bottom:4px solid var(--accent)}.header img{width:240px;height:180px;object-fit:contain;margin-bottom:8px}.header h1{margin:5px 0}.container{max-width:720px;margin:30px auto;padding:0 15px}.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:26px;box-shadow:0 6px 24px rgba(0,0,0,.08)}.repair{border:1px solid var(--line);border-radius:9px;padding:19px;margin-top:20px}.repair h2{margin-top:0;color:#222}.price-row{display:flex;justify-content:space-between;margin:9px 0}.total{font-size:21px;font-weight:bold;border-top:2px solid var(--accent);padding-top:12px;margin-top:12px}.buttons{display:flex;gap:12px;margin-top:21px}button{flex:1;border:0;border-radius:7px;padding:14px;font-size:16px;font-weight:bold;cursor:pointer}.approve{background:var(--green);color:#fff}.decline{background:var(--red);color:#fff}.status{text-align:center;font-weight:bold;margin-top:20px;font-size:18px}.footer{text-align:center;color:#66717d;margin-top:25px;line-height:1.5}#loading{text-align:center;padding:30px}#vehicleInfo{border:1px solid var(--line)!important;background:#f6f7f8!important}@media(max-width:550px){.buttons{flex-direction:column}.card{padding:19px}}

</style>
</head>

<body>

<div class="header">
  <img id="shopLogo" alt="Shop logo" style="display:none;">
  <h1>Repair Authorization</h1>
  <div id="shopTagline"></div>
</div>

<div class="container">

  <div class="card">

    <div id="loading">
      Loading recommended repair...
    </div>

    <div id="content" style="display:none;">

      <p>
        <span id="shopNameIntro">The repair shop</span> has recommended the following repair for your vehicle.
        Please review the repair and choose whether you authorize the work.
      </p>

      <div id="vehicleInfo" style="display:none; margin:12px 0; padding:12px; background:#f7f8fa; border-radius:6px; font-weight:bold;"></div>

      <div class="repair">

        <h2 id="description"></h2>

        <div class="price-row">
          <span>Parts:</span>
          <strong id="parts"></strong>
        </div>

        <div class="price-row">
          <span>Labor:</span>
          <strong id="labor"></strong>
        </div>

        <div class="price-row total">
          <span>Repair Total:</span>
          <span id="total"></span>
        </div>

        <div id="buttons" class="buttons">

          <button
            class="approve"
            onclick="authorizeRepair('approve')">
            ✓ Approve Repair
          </button>

          <button
            class="decline"
            onclick="authorizeRepair('decline')">
            ✕ Decline Repair
          </button>

        </div>

        <div id="status" class="status"></div>

      </div>

    </div>

  </div>

  <div class="footer">
    <strong id="shopNameFooter"></strong><br>
    <span id="shopAddressFooter"></span><br>
    <span id="shopContactFooter"></span>
    <div style="margin-top:12px;font-size:12px;">Powered by Garavex™</div>
  </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const repairOrderId = params.get('order');
const recommendationId = params.get('repair');
const token = params.get('token');

let repairData = null;

async function loadRepair() {

  if (!repairOrderId || !recommendationId || !token) {

    document.getElementById('loading').textContent =
      'Invalid or expired repair authorization link.';

    return;
  }

  try {
    const buttons = document.querySelectorAll('#buttons button');
    buttons.forEach(button => button.disabled = true);

    const response = await fetch(
      '/api/customer-repair-authorization/' +
      encodeURIComponent(repairOrderId) +
      '/' +
      encodeURIComponent(recommendationId) +
      '?token=' +
      encodeURIComponent(token)
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(
        result.error || 'Unable to load recommended repair.'
      );
    }

    repairData = result;

    const shopName = result.shop_name || 'Repair Shop';
    document.title = shopName + ' | Repair Authorization';
    document.getElementById('shopNameIntro').textContent = shopName;
    document.getElementById('shopNameFooter').textContent = shopName;
    document.getElementById('shopTagline').textContent = result.shop_tagline || '';
    const shopAddress = [result.shop_address, [result.shop_city, result.shop_state].filter(Boolean).join(', '), result.shop_zip].filter(Boolean).join(' · ');
    document.getElementById('shopAddressFooter').textContent = shopAddress;
    document.getElementById('shopContactFooter').textContent = [result.shop_phone, result.shop_email].filter(Boolean).join(' · ');
    const shopLogo = document.getElementById('shopLogo');
    if (result.shop_logo_url) { shopLogo.src = result.shop_logo_url; shopLogo.alt = shopName + ' logo'; shopLogo.style.display = 'inline-block'; }

    document.getElementById('description').textContent =
      result.description || 'Recommended Repair';

    const vehicleText = [result.vehicle_year, result.vehicle_make, result.vehicle_model]
      .filter(Boolean).join(' ');
    if (vehicleText) {
      const vehicleInfo = document.getElementById('vehicleInfo');
      vehicleInfo.textContent = 'Vehicle: ' + vehicleText;
      vehicleInfo.style.display = 'block';
    }

    const parts = Number(result.parts) || 0;
    const labor = Number(result.labor) || 0;

    document.getElementById('parts').textContent =
      '$' + parts.toFixed(2);

    document.getElementById('labor').textContent =
      '$' + labor.toFixed(2);

    document.getElementById('total').textContent =
      '$' + (parts + labor).toFixed(2);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    if (result.status === 'approved') {

      document.getElementById('buttons').style.display = 'none';

      document.getElementById('status').textContent =
        '✓ This repair has been approved.' +
        (result.authorized_at ? ' Decision recorded: ' + new Date(result.authorized_at.replace(' ', 'T') + 'Z').toLocaleString() + '.' : '');

    }

    if (result.status === 'declined') {

      document.getElementById('buttons').style.display = 'none';

      document.getElementById('status').textContent =
        '✕ This repair has been declined.' +
        (result.authorized_at ? ' Decision recorded: ' + new Date(result.authorized_at.replace(' ', 'T') + 'Z').toLocaleString() + '.' : '');

    }

  } catch (error) {

    document.getElementById('loading').textContent =
      error.message;

  }

}


async function authorizeRepair(action) {

  const word =
    action === 'approve' ? 'approve' : 'decline';

  if (!confirm(
    'Are you sure you want to ' +
    word +
    ' this repair?'
  )) {
    return;
  }

  try {
    const buttons = document.querySelectorAll('#buttons button');
    buttons.forEach(button => button.disabled = true);

    const response = await fetch(
      '/api/customer-repair-authorization/' +
      encodeURIComponent(repairOrderId) +
      '/' +
      encodeURIComponent(recommendationId) +
      '/' +
      action,
      {
        method: 'PATCH',

        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify({
          token: token
        })
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(
        result.error || 'Unable to update repair authorization.'
      );
    }

    document.getElementById('buttons').style.display = 'none';

    if (action === 'approve') {

      document.getElementById('status').textContent =
        '✓ Thank you. This repair has been authorized.';

    } else {

      document.getElementById('status').textContent =
        'This repair has been declined.';

    }

  } catch (error) {
    document.querySelectorAll('#buttons button').forEach(button => button.disabled = false);
    alert(error.message);
  }

}

loadRepair();

</script>

</body>
</html>
