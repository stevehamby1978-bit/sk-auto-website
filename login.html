<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Employee Login | S&K Auto</title>

  <style>

*{box-sizing:border-box}:root{--bg:#0e1114;--panel:#171b20;--line:#323a43;--text:#f5f7f9;--muted:#aeb7c1;--accent:#ef3e23}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}.login-card{width:100%;max-width:430px;background:var(--panel);border:1px solid var(--line);padding:32px;border-radius:12px;box-shadow:0 12px 35px rgba(0,0,0,.35)}.logo{display:block;width:180px;max-width:100%;height:auto;margin:0 auto 8px}.tagline{margin:0 0 24px;text-align:center;color:var(--muted)}h1{margin:0 0 24px;text-align:center;font-size:25px}label{display:block;margin-bottom:6px;font-weight:bold}input{width:100%;padding:12px;margin-bottom:18px;border:1px solid #46505a;border-radius:7px;font-size:16px;background:#0f1317;color:#fff}button{width:100%;padding:13px;border:0;border-radius:7px;background:var(--accent);color:#fff;font-size:16px;font-weight:bold;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}#message{min-height:20px;margin-top:15px;text-align:center;font-weight:bold;color:#ff8e8e}.register-link{text-align:center;margin-top:18px;color:var(--muted);font-size:14px}.register-link a{color:#fff}

</style>
</head>

<body>

  <div class="login-card">

    <img
      src="/sk-auto-invoice-logo.png"
      alt="S&K Auto"
      class="logo"
    >

    <p class="tagline">
      The Art of Automotive Repair
    </p>

    <h1>Employee Login</h1>

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        autocomplete="username"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        autocomplete="current-password"
        required
      >

      <button
        type="submit"
        id="loginButton"
      >
        Sign In
      </button>

      <div id="message"></div>

    </form>
<div class="register-link">Setting up a new shop? <a href="/register.html">Create shop account</a></div>

  </div>


  <script>
    const loginForm =
      document.getElementById('loginForm');

    const loginButton =
      document.getElementById('loginButton');

    const message =
      document.getElementById('message');


    loginForm.addEventListener(
      'submit',
      async function(event) {

        event.preventDefault();

        message.textContent = '';

        loginButton.disabled = true;
        loginButton.textContent = 'Signing In...';

        const loginData = {
          email:
            document.getElementById('email')
              .value
              .trim(),

          password:
            document.getElementById('password')
              .value
        };

        try {
          const response = await fetch(
            '/api/login',
            {
              method: 'POST',

              headers: {
                'Content-Type': 'application/json'
              },

              body: JSON.stringify(loginData)
            }
          );

          const result = await response.json();

          if (!response.ok) {
            throw new Error(
              result.error ||
              'Unable to sign in.'
            );
          }

          if (
  result.employee &&
  Number(result.employee.must_change_password) === 1
) {
  window.location.href = '/change-password.html';
} else {
  window.location.href = '/dashboard.html';
}
        } catch (error) {
          console.error(error);

          message.textContent =
            error.message ||
            'Unable to sign in.';

          loginButton.disabled = false;
          loginButton.textContent = 'Sign In';
        }
      }
    );
  </script>

</body>
</html>
