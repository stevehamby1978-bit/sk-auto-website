<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Employee Login | S&K Auto</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #151515;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 32px;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,.35);
    }

    .logo {
      display: block;
      width: 190px;
      max-width: 100%;
      height: auto;
      margin: 0 auto 8px;
    }

    .tagline {
      margin: 0 0 25px;
      text-align: center;
      color: #666;
    }

    h1 {
      margin: 0 0 25px;
      text-align: center;
      font-size: 24px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #151515;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      min-height: 20px;
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      color: #b91c1c;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <img
      src="/sk-auto-invoice-logo.png"
      alt="S&K Auto"
      class="logo"
    >

    <p class="tagline">
      The Art of Automotive Repair
    </p>

    <h1>Employee Login</h1>

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        autocomplete="username"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        autocomplete="current-password"
        required
      >

      <button
        type="submit"
        id="loginButton"
      >
        Sign In
      </button>

      <div id="message"></div>

    </form>

  </div>


  <script>
    const loginForm =
      document.getElementById('loginForm');

    const loginButton =
      document.getElementById('loginButton');

    const message =
      document.getElementById('message');


    loginForm.addEventListener(
      'submit',
      async function(event) {

        event.preventDefault();

        message.textContent = '';

        loginButton.disabled = true;
        loginButton.textContent = 'Signing In...';

        const loginData = {
          email:
            document.getElementById('email')
              .value
              .trim(),

          password:
            document.getElementById('password')
              .value
        };

        try {
          const response = await fetch(
            '/api/login',
            {
              method: 'POST',

              headers: {
                'Content-Type': 'application/json'
              },

              body: JSON.stringify(loginData)
            }
          );

          const result = await response.json();

          if (!response.ok) {
            throw new Error(
              result.error ||
              'Unable to sign in.'
            );
          }

          window.location.href =
            '/dashboard.html';

        } catch (error) {
          console.error(error);

          message.textContent =
            error.message ||
            'Unable to sign in.';

          loginButton.disabled = false;
          loginButton.textContent = 'Sign In';
        }
      }
    );
  </script>

</body>
</html>
