<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Dispatch</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1200px;margin:auto;padding:24px}.muted{color:#89959e}.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.lane{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:14px;min-height:180px}.job{background:#0b0f12;border:1px solid #303942;border-radius:8px;padding:12px;margin:9px 0}.job b{font-size:16px}.unassigned{border-color:#6e392f}.btn,select{background:#252d34;color:#fff;border:1px solid #37414a;border-radius:6px;padding:8px;width:100%;margin-top:8px}.btn{cursor:pointer}.concern{margin:8px 0;line-height:1.35}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Technician Dispatch</h1><p class="muted">See unassigned work and balance active repair orders across the team.</p><div id="board" class="board"></div></main><script>let data;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function card(x){return `<div class="job ${x.employee_id?'':'unassigned'}"><b>RO #${x.id} · ${esc(x.customer_name)}</b><div class="muted">${esc([x.year,x.make,x.model].filter(Boolean).join(' '))}</div><div class="concern">${esc(x.customer_concern||'No concern entered')}</div><select onchange="assign(${x.id},this.value)"><option value="">Assign technician…</option>${data.technicians.map(t=>`<option value="${t.id}" ${Number(x.employee_id)===Number(t.id)?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>`}async function load(){const r=await fetch('/api/v2/dispatch'),d=await r.json();if(!r.ok){board.textContent=d.error||'Unable to load dispatch';return}data=d;const lanes=[{id:null,name:'Unassigned'},...d.technicians];board.innerHTML=lanes.map(t=>{const jobs=d.repair_orders.filter(x=>t.id===null?!x.employee_id:Number(x.employee_id)===Number(t.id));return `<section class="lane"><h2>${esc(t.name)} <span class="muted">(${jobs.length})</span></h2>${jobs.map(card).join('')||'<p class="muted">No active jobs.</p>'}</section>`}).join('')}async function assign(ro,id){if(!id){await fetch('/api/v2/dispatch/'+ro,{method:'DELETE'});return load()}const r=await fetch('/api/v2/dispatch/'+ro,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({employee_id:Number(id)})}),d=await r.json();if(!r.ok)alert(d.error||'Unable to assign');load()}load();setInterval(load,60000);</script></body></html>
