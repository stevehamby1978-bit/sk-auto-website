<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Key Board</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.muted{color:#89959e}.form{display:grid;grid-template-columns:90px 110px 150px 1fr 150px auto;gap:8px}input,select{background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:10px}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:12px;padding:14px 0;border-bottom:1px solid #283139}.missing{color:#f06b62;font-weight:bold}.tag{font-size:18px;font-weight:bold}@media(max-width:800px){.form,.row{display:block}.form>*{width:100%;margin:5px 0}.row>*{margin:6px 0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Vehicle Key Board</h1><p class="muted">Know where every customer's key is without searching desks, toolboxes or technician bays.</p><section class="card"><div class="form"><input id="ro" type="number" placeholder="RO #"><input id="tag" placeholder="Key tag"><select id="status"><option value="checked_in">Checked In</option><option value="key_board">Key Board</option><option value="technician">With Technician</option><option value="customer">With Customer</option><option value="missing">Missing</option></select><input id="location" placeholder="Location / hook / bay"><input id="note" placeholder="Note"><button class="btn" onclick="save()">Update Key</button></div></section><section class="card"><div id="rows"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/v2/keys'),d=await r.json();if(!r.ok){rows.textContent=d.error||'Unable to load keys';return}rows.innerHTML=d.length?d.map(x=>`<div class="row"><div><b>RO #${x.repair_order_id} · ${esc(x.customer_name)}</b><div class="muted">${esc([x.year,x.make,x.model].filter(Boolean).join(' '))}</div></div><div><span class="tag">${esc(x.key_tag||'No tag')}</span><div class="muted">${esc(x.location||'No location')}</div></div><div class="${x.status==='missing'?'missing':''}">${esc(x.status.replaceAll('_',' '))}<div class="muted">${esc(x.technician_name||'')}</div></div><div>${esc(x.note||'')}<div class="muted">${esc(x.updated_at)}</div></div></div>`).join(''):'<p class="muted">No active vehicle keys tracked.</p>'}async function save(){const r=await fetch('/api/v2/repair-orders/'+ro.value+'/key',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({key_tag:tag.value,status:status.value,location:location.value,note:note.value})}),d=await r.json();if(!r.ok)return alert(d.error||'Unable to update key');ro.value=tag.value=location.value=note.value='';load()}load();setInterval(load,60000);</script></body></html>
