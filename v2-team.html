<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Team Access</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.muted{color:#89959e}.employee{border-bottom:1px solid #283139;padding:16px 0}.employee:last-child{border:0}.perms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.perm{background:#0b0f12;border:1px solid #29323a;border-radius:7px;padding:9px}.btn{background:#df3329;color:white;border:0;border-radius:6px;padding:9px 13px;font-weight:bold;cursor:pointer;margin-top:10px}@media(max-width:650px){.perms{grid-template-columns:1fr 1fr}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Team Access</h1><p class="muted">Give employees only the Garavex areas they need. Owners always retain full access.</p><section class="card"><div id="team">Loading employees…</div></section></main><script>const keys=['dashboard','customers','appointments','repair_orders','dvi','inventory','purchasing','reports','settings'],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/employees'),d=await r.json();if(!r.ok){team.textContent=d.error||'Unable to load employees';return}const list=Array.isArray(d)?d:(d.employees||[]);team.innerHTML=list.map(e=>{let p={};try{p=typeof e.permissions_json==='string'?JSON.parse(e.permissions_json||'{}'):(e.permissions_json||{})}catch{}return `<div class="employee"><h3>${esc(e.name||e.username||'Employee')} <span class="muted">${esc(e.role||'employee')}</span></h3>${e.role==='owner'?'<div class="muted">Owner · Full access</div>':`<div class="perms">${keys.map(k=>`<label class="perm"><input type="checkbox" data-e="${e.id}" data-p="${k}" ${p[k]?'checked':''}> ${esc(k.replaceAll('_',' '))}</label>`).join('')}</div><button class="btn" onclick="save(${e.id})">Save Access</button>`}</div>`}).join('')||'<div class="muted">No employees found.</div>'}async function save(id){const permissions={};document.querySelectorAll(`[data-e="${id}"]`).forEach(x=>permissions[x.dataset.p]=x.checked);const r=await fetch('/api/v2/employees/'+id+'/permissions',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({permissions})}),d=await r.json();if(!r.ok)return alert(d.error||'Unable to save');alert('Employee access saved.')}load();</script></body></html>
