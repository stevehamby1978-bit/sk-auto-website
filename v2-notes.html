<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Internal Notes</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:850px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.muted{color:#89959e}.bar{display:flex;gap:8px}.bar input{flex:1;background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:11px}textarea{width:100%;background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:11px;margin:8px 0}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}.note{padding:14px 0;border-bottom:1px solid #283139}.pin{color:#f2b84b}.actions{display:flex;justify-content:space-between;gap:10px;align-items:center}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Internal RO Notes</h1><p class="muted">Private shop notes for advisors and technicians. These are not customer-facing.</p><section class="card"><div class="bar"><input id="ro" inputmode="numeric" placeholder="Repair order #"><button class="btn" onclick="load()">Open</button></div></section><section class="card" id="editor" hidden><h2 id="heading"></h2><textarea id="text" rows="4" placeholder="Add an internal note…"></textarea><label><input id="pinned" type="checkbox"> Pin this note</label><br><br><button class="btn" onclick="add()">Add Note</button><div id="notes"></div></section></main><script>let current=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o){const r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){current=Number(ro.value);if(!current)return;try{const d=await api('/api/v2/repair-orders/'+current+'/notes');editor.hidden=false;heading.textContent='RO #'+current;notes.innerHTML=d.length?d.map(x=>`<div class="note"><div class="actions"><b>${esc(x.employee_name||'Employee')} ${x.pinned?'<span class="pin">★ PINNED</span>':''}</b><button onclick="pin(${x.id},${x.pinned?0:1})">${x.pinned?'Unpin':'Pin'}</button></div><p>${esc(x.note)}</p><small class="muted">${esc(x.created_at)}</small></div>`).join(''):'<p class="muted">No internal notes yet.</p>'}catch(e){alert(e.message)}}async function add(){try{await api('/api/v2/repair-orders/'+current+'/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({note:text.value,pinned:pinned.checked})});text.value='';pinned.checked=false;load()}catch(e){alert(e.message)}}async function pin(id,value){try{await api('/api/v2/repair-orders/'+current+'/notes/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({pinned:Boolean(value)})});load()}catch(e){alert(e.message)}}ro.addEventListener('keydown',e=>{if(e.key==='Enter')load()});</script></body></html>
