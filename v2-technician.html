<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Technician</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1050px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;align-items:center;gap:15px}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:12px 16px;font-weight:bold;cursor:pointer}.secondary{background:#252d34}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.job{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #283139}.muted{color:#89959e}.status{display:inline-block;background:#252d34;border-radius:20px;padding:5px 9px;font-size:11px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{background:#252d34;color:white;border:1px solid #37414a;border-radius:6px;padding:8px 10px;cursor:pointer}@media(max-width:700px){.job{display:block}.job>*{margin:8px 0}.hero{display:block}.hero .actions{margin-top:12px}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><div class="hero"><div><h1>Technician Workspace</h1><div class="muted">Your active work without the front-office clutter.</div></div><div class="actions"><button class="btn" onclick="clockIn()">Clock In</button><button class="btn secondary" onclick="clockOut()">Clock Out</button></div></div><section class="card"><h2>Active Repair Orders</h2><div id="jobs">Loading…</div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o){const r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){try{const rows=await api('/api/v2/shop-board');jobs.innerHTML=rows.length?rows.map(j=>`<div class="job"><div><b>RO #${j.id} · ${esc([j.year,j.make,j.model].filter(Boolean).join(' '))}</b><div class="muted">${esc(j.customer_name||'')}</div></div><div><span class="status">${esc((j.workflow_status||'waiting').replaceAll('_',' '))}</span></div><div class="muted">Parts: ${esc((j.parts_status||'not ordered').replaceAll('_',' '))}</div><div class="actions"><button onclick="move(${j.id},'in_progress')">Start</button><button onclick="move(${j.id},'waiting_parts')">Waiting Parts</button><button onclick="move(${j.id},'waiting_approval')">Approval</button><button onclick="move(${j.id},'ready')">Ready</button></div></div>`).join(''):'<div class="muted">No active repair orders.</div>'}catch(e){jobs.textContent=e.message}}async function move(id,status){try{await api('/api/v2/repair-orders/'+id+'/workflow',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({workflow_status:status})});load()}catch(e){alert(e.message)}}async function clockIn(){try{await api('/api/v2/time/clock-in',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});alert('Clocked in.')}catch(e){alert(e.message)}}async function clockOut(){try{await api('/api/v2/time/clock-out',{method:'POST'});alert('Clocked out.')}catch(e){alert(e.message)}}load();</script></body></html>
