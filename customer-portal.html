<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Garavex Customer Portal</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:25px}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #29323a;padding-bottom:20px}.muted{color:#89959e}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px}.row{padding:12px 0;border-bottom:1px solid #252d34}.row:last-child{border:0}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#242c32;font-size:11px}.money{font-weight:bold}.deferred{border-left:4px solid #e0a925}.error{max-width:650px;margin:70px auto;padding:24px;background:#10151a;border:1px solid #29323a;border-radius:11px}@media(max-width:700px){.grid{grid-template-columns:1fr}header{align-items:start;gap:10px;flex-direction:column}}</style></head><body><main class="wrap"><header><div><div class="muted">GARAVEX CUSTOMER PORTAL</div><h1 id="shop">Your Service</h1></div><div id="name"></div></header><section class="grid"><div class="card"><h2>Your Vehicles</h2><div id="vehicles">Loading…</div></div><div class="card"><h2>Recommended / Deferred</h2><div id="deferred">Loading…</div></div></section><section class="card"><h2>Service & Repair Orders</h2><div id="orders">Loading…</div></section></main><script>(()=>{'use strict';const params=new URLSearchParams(location.search),token=String(params.get('token')||'').trim().toLowerCase(),shop=document.getElementById('shop'),name=document.getElementById('name'),vehicles=document.getElementById('vehicles'),deferred=document.getElementById('deferred'),orders=document.getElementById('orders'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>{const v=Number(n);return Number.isFinite(v)?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(v):'$0.00'},date=v=>{if(!v)return'';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString()},fail=message=>{document.body.innerHTML='<main class="wrap"><section class="error"><div class="muted">GARAVEX CUSTOMER PORTAL</div><h1>Portal unavailable</h1><p>'+esc(message||'This customer portal link is invalid or expired.')+'</p></section></main>'};async function load(){if(!/^[a-f0-9]{64}$/.test(token)){fail('This customer portal link is invalid or expired.');return}try{const r=await fetch('/api/v2/public/portal/'+encodeURIComponent(token),{method:'GET',credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});let d={};try{d=await r.json()}catch(_){d={}}if(!r.ok){fail(d.error);return}if(!d||!d.shop||!d.customer||!Array.isArray(d.vehicles)||!Array.isArray(d.deferred)||!Array.isArray(d.orders)){fail('The portal response could not be verified.');return}shop.textContent=String(d.shop.name||'Your Service');name.textContent=String(d.customer.name||'');vehicles.innerHTML=d.vehicles.length?d.vehicles.map(v=>`<div class="row"><b>${esc(v.year)} ${esc(v.make)} ${esc(v.model)}</b><div class="muted">${v.vin?'VIN '+esc(v.vin):''}${v.mileage?' · '+esc(v.mileage)+' miles':''}</div></div>`).join(''):'<div class="muted">No vehicles yet.</div>';deferred.innerHTML=d.deferred.length?d.deferred.map(x=>`<div class="row deferred"><b>${esc(x.description)}</b><div class="money">${money(x.estimated_total)}</div><span class="badge">${esc(x.status)}</span>${x.follow_up_date?` <span class="muted">Follow-up ${esc(x.follow_up_date)}</span>`:''}</div>`).join(''):'<div class="muted">No deferred recommendations.</div>';orders.innerHTML=d.orders.length?d.orders.map(o=>`<div class="row"><b>Repair Order #${esc(o.id)}</b> <span class="badge">${esc(o.workflow_status||o.status)}</span> <span class="badge">${esc(o.payment_status)}</span><div class="muted">Opened ${esc(date(o.created_at))}${o.completed_at?' · Completed '+esc(date(o.completed_at)):''}</div></div>`).join(''):'<div class="muted">No repair orders yet.</div>';try{history.replaceState(null,'',location.pathname)}catch(_){}}catch(err){console.error('Garavex customer portal load error:',err);fail('The portal could not be loaded. Please request a new link from your repair shop.')}}load()})();</script></body></html>
