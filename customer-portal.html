<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex Customer Portal</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:25px}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #29323a;padding-bottom:20px}.muted{color:#89959e}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px}.row{padding:12px 0;border-bottom:1px solid #252d34}.row:last-child{border:0}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#242c32;font-size:11px}.money{font-weight:bold}.deferred{border-left:4px solid #e0a925}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header><div><div class="muted">GARAVEX CUSTOMER PORTAL</div><h1 id="shop">Your Service</h1></div><div id="name"></div></header><section class="grid"><div class="card"><h2>Your Vehicles</h2><div id="vehicles">Loading…</div></div><div class="card"><h2>Recommended / Deferred</h2><div id="deferred">Loading…</div></div></section><section class="card"><h2>Service & Repair Orders</h2><div id="orders">Loading…</div></section></main><script>const token=new URLSearchParams(location.search).get('token'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'$'+Number(n||0).toFixed(2);async function load(){const r=await fetch('/api/v2/public/portal/'+encodeURIComponent(token||'')),d=await r.json();if(!r.ok){document.body.innerHTML='<main class="wrap"><h1>Portal unavailable</h1><p>'+esc(d.error)+'</p></main>';return}shop.textContent=d.shop.name;name.textContent=d.customer.name;vehicles.innerHTML=d.vehicles.length?d.vehicles.map(v=>`<div class="row"><b>${esc(v.year)} ${esc(v.make)} ${esc(v.model)}</b><div class="muted">${v.vin?'VIN '+esc(v.vin):''}${v.mileage?' · '+esc(v.mileage)+' miles':''}</div></div>`).join(''):'<div class="muted">No vehicles yet.</div>';deferred.innerHTML=d.deferred.length?d.deferred.map(x=>`<div class="row deferred"><b>${esc(x.description)}</b><div class="money">${money(x.estimated_total)}</div><span class="badge">${esc(x.status)}</span>${x.follow_up_date?` <span class="muted">Follow-up ${esc(x.follow_up_date)}</span>`:''}</div>`).join(''):'<div class="muted">No deferred recommendations.</div>';orders.innerHTML=d.orders.length?d.orders.map(o=>`<div class="row"><b>Repair Order #${o.id}</b> <span class="badge">${esc(o.workflow_status||o.status)}</span> <span class="badge">${esc(o.payment_status)}</span><div class="muted">Opened ${esc(o.created_at)}${o.completed_at?' · Completed '+esc(o.completed_at):''}</div></div>`).join(''):'<div class="muted">No repair orders yet.</div>'}load();</script></body></html>
