<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Workflow Summary</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:12px 0}.muted{color:#89959e}.search{display:flex;gap:8px}.search input{flex:1;background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:11px}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 15px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.num{font-size:30px;font-weight:800}.good{color:#58c87b}.bad{color:#ff655d}.row{display:grid;grid-template-columns:180px 1fr;padding:9px 0;border-bottom:1px solid #29323a}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>RO Workflow Summary</h1><p class="muted">One screen showing whether a repair order is actually moving toward delivery.</p><section class="card search"><input id="ro" type="number" placeholder="Repair order #"><button class="btn" onclick="load()">Open RO</button></section><div id="view"></div></main><script>const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const p=new URLSearchParams(location.search);if(p.get('ro'))ro.value=p.get('ro');async function load(){if(!ro.value)return;const r=await fetch('/api/v2/repair-orders/'+ro.value+'/workflow-summary'),d=await r.json();if(!r.ok){view.innerHTML=`<section class="card bad">${e(d.error||'Unable to load')}</section>`;return}const x=d.repair_order;view.innerHTML=`<section class="card"><h2>RO #${x.id} · ${e(x.customer_name)}</h2><div>${e([x.year,x.make,x.model].filter(Boolean).join(' '))}</div><div class="muted">${e(x.workflow_status||x.status||'')}</div><h3 class="${d.ready_for_delivery?'good':'bad'}">${d.ready_for_delivery?'Workflow clear for delivery':'Workflow still has open items'}</h3></section><section class="grid"><div class="card"><div class="num">${d.open_tasks}</div>Open Tasks</div><div class="card"><div class="num">${d.open_blockers}</div>Blockers</div><div class="card"><div class="num">${d.parts_pending}</div>Parts Pending</div><div class="card"><div class="num">${d.open_customer_contacts}</div>Customer Contacts</div></section><section class="card"><h2>Milestones</h2>${row('Promise',d.latest_promise)}${row('Road Test',d.latest_road_test)}${row('Final Quality',d.latest_quality)}${row('Delivery',d.latest_delivery)}${row('Warranty',d.latest_warranty)}<div class="row"><b>Timeline Events</b><span>${d.timeline_events}</span></div></section>`}function row(name,x){return `<div class="row"><b>${name}</b><span>${x?e(x.status||x.promised_at||x.created_at||'Recorded'):'Not recorded'}</span></div>`}if(ro.value)load();</script></body></html>
