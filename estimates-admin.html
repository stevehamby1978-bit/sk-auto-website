<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S&K Auto | Estimates</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><h1>Estimates</h1><p>Create a customer estimate, receive approval, then move approved work into the repair workflow.</p><form id="estimateForm"><section><h2>1. Customer Information</h2><label>Customer Name<input id="customerName" required></label><label>Phone Number<input id="customerPhone" required></label><label>Email<input id="customerEmail" type="email"></label></section><section><h2>2. Vehicle Information</h2><label>Year<input id="vehicleYear"></label><label>Make<input id="vehicleMake"></label><label>Model<input id="vehicleModel"></label><label>Mileage<input id="vehicleMileage"></label><label>VIN<input id="vehicleVin"></label></section><section><h2>3. Estimate Items</h2><div id="items"></div><button type="button" id="addItemBtn">+ Add Repair Item</button><h3>Estimate Total: $<span id="estimateTotal">0.00</span></h3></section><section><h2>4. Customer Notes</h2><textarea id="estimateNotes" placeholder="Recommendations, warranty information, repair details, or other notes for the customer..."></textarea><button type="submit">Create Customer Estimate</button><div id="message" style="display:none"></div></section></form><section><h2>Approved Estimates</h2><div id="approvedEstimates"></div><button type="button" onclick="loadSavedEstimates()">Refresh</button></section><section><h2>Pending / Saved Estimates</h2><div id="savedEstimates"></div><button type="button" onclick="loadSavedEstimates()">Refresh</button></section></main><script>
const itemsEl=document.getElementById('items');
function addItem(){const row=document.createElement('div');row.className='estimate-item';row.innerHTML='<label>Repair / Service<input class="item-description" required></label><label>Parts $<input class="item-parts" type="number" min="0" step="0.01" value="0"></label><label>Labor $<input class="item-labor" type="number" min="0" step="0.01" value="0"></label><button type="button" class="remove-item">Remove Item</button>';row.querySelector('.remove-item').onclick=()=>{row.remove();calculateTotal()};row.querySelectorAll('input').forEach(i=>i.addEventListener('input',calculateTotal));itemsEl.appendChild(row);calculateTotal()}
function calculateTotal(){let total=0;document.querySelectorAll('.estimate-item').forEach(r=>{total+=Number(r.querySelector('.item-parts').value||0)+Number(r.querySelector('.item-labor').value||0)});document.getElementById('estimateTotal').textContent=total.toFixed(2)}
document.getElementById('addItemBtn').onclick=addItem;
document.getElementById('estimateForm').addEventListener('submit',async e=>{e.preventDefault();const items=[...document.querySelectorAll('.estimate-item')].map(r=>({description:r.querySelector('.item-description').value,parts:r.querySelector('.item-parts').value,labor:r.querySelector('.item-labor').value})).filter(i=>i.description.trim());if(!items.length){alert('Please add at least one repair item.');return}const data={customer:{name:document.getElementById('customerName').value,phone:document.getElementById('customerPhone').value,email:document.getElementById('customerEmail').value},vehicle:{year:document.getElementById('vehicleYear').value,make:document.getElementById('vehicleMake').value,model:document.getElementById('vehicleModel').value,mileage:document.getElementById('vehicleMileage').value,vin:document.getElementById('vehicleVin').value},notes:document.getElementById('estimateNotes').value,items};const message=document.getElementById('message');try{const response=await fetch('/api/estimates',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw new Error(result.error||'Unable to create estimate');message.style.display='block';message.style.background='#173b22';message.innerHTML='<strong>Estimate created successfully.</strong><br>Estimate #'+result.id;document.getElementById('estimateForm').reset();itemsEl.innerHTML='';addItem();calculateTotal();loadSavedEstimates()}catch(error){message.style.display='block';message.style.background='#551c1c';message.textContent=error.message}});
async function loadSavedEstimates(){const saved=document.getElementById('savedEstimates'),approved=document.getElementById('approvedEstimates');approved.innerHTML='';try{const response=await fetch('/api/estimates',{credentials:'same-origin'});const estimates=await response.json();if(!response.ok)throw new Error('Unable to load saved estimates.');if(!estimates.length){saved.innerHTML='<p>No saved estimates yet.</p>';return}saved.innerHTML='';estimates.forEach(estimate=>{const card=document.createElement('div');card.className='saved-estimate';card.innerHTML=`<h3>${estimate.customer_name||'Customer'}</h3><p><strong>Phone:</strong> ${estimate.customer_phone||''}</p><p><strong>Vehicle:</strong> ${estimate.vehicle_year||''} ${estimate.vehicle_make||''} ${estimate.vehicle_model||''}</p><p><strong>Estimate #:</strong> ${estimate.id||''}</p><p><strong>Status:</strong> ${estimate.status||'pending'}</p><button type="button" onclick="window.open('/estimate.html?token=${estimate.token}','_blank')">View Estimate</button>`;if((estimate.status||'pending').toLowerCase()==='approved')approved.appendChild(card);else saved.appendChild(card)})}catch(error){console.error(error);saved.innerHTML='<p>Unable to load saved estimates.</p>'}}
addItem();loadSavedEstimates();
</script></body></html>
