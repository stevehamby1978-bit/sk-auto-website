<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Inventory</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:24px}.muted{color:#89959e}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.form{display:grid;grid-template-columns:1fr 1.5fr .65fr .8fr .8fr .75fr 1fr auto;gap:8px}.form input,.search{background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:10px;width:100%}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.55}.rowbtn{border:0;border-radius:6px;padding:7px 10px;font-weight:bold;cursor:pointer;color:#fff;margin-right:5px}.editbtn{background:#2563eb}.deletebtn{background:#b91c1c}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#10151a;border:1px solid #29323a;border-radius:10px;padding:14px}.metric b{display:block;font-size:24px;margin-top:5px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:12px;border-bottom:1px solid #283139}th{color:#9aa5ad;font-size:12px;text-transform:uppercase}.low{color:#f2b84b;font-weight:bold}.out{color:#ff655d;font-weight:bold}.profit{color:#58c87b}.msg{min-height:18px;margin-top:10px}.ok{color:#58c87b}.error{color:#ff655d}@media(max-width:900px){.form{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}}@media(max-width:550px){.form,.summary,.toolbar{display:block}.form>*{margin:5px 0}.metric{margin:8px 0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Inventory</h1><p class="muted">Stock levels, pricing, reorder visibility and parts profitability.</p><section class="card"><div class="form"><input id="part" maxlength="200" placeholder="Part number"><input id="desc" maxlength="1000" placeholder="Description"><input id="qty" type="number" min="0" step=".01" placeholder="Qty"><input id="cost" type="number" min="0" step=".01" placeholder="Cost"><input id="sell" type="number" min="0" step=".01" placeholder="Sell price"><input id="reorder" type="number" min="0" step=".01" placeholder="Reorder at"><input id="loc" maxlength="300" placeholder="Location"><button id="addBtn" class="btn" onclick="add()">Add Part</button></div><div id="message" class="msg muted"></div></section><section class="summary"><div class="metric"><span class="muted">Parts</span><b id="partCount">0</b></div><div class="metric"><span class="muted">Units On Hand</span><b id="unitCount">0</b></div><div class="metric"><span class="muted">Low / Out</span><b id="lowCount">0</b></div><div class="metric"><span class="muted">Inventory Cost</span><b id="inventoryValue">$0.00</b></div></section><section class="card"><div class="toolbar"><input id="search" class="search" placeholder="Search part number, description or location" oninput="render()"><label class="muted"><input id="lowOnly" type="checkbox" onchange="render()"> Low stock only</label></div><div class="tablewrap"><table><thead><tr><th>Part</th><th>Description</th><th>Qty</th><th>Reorder</th><th>Cost</th><th>Sell</th><th>Gross Profit</th><th>Margin</th><th>Location</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
let inventory=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});async function api(u,o){const r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function setMessage(text,type='muted'){message.className='msg '+type;message.textContent=text||''}function metrics(){partCount.textContent=inventory.length;unitCount.textContent=inventory.reduce((s,x)=>s+Number(x.quantity||0),0).toLocaleString();lowCount.textContent=inventory.filter(x=>Number(x.quantity||0)<=Number(x.reorder_level||0)).length;inventoryValue.textContent=money(inventory.reduce((s,x)=>s+Number(x.quantity||0)*Number(x.cost||0),0))}function render(){const q=search.value.trim().toLowerCase(),low=lowOnly.checked;const data=inventory.filter(x=>(!low||Number(x.quantity||0)<=Number(x.reorder_level||0))&&(!q||[x.part_number,x.description,x.location].some(v=>String(v||'').toLowerCase().includes(q))));rows.innerHTML=data.length?data.map(x=>{const qty=Number(x.quantity||0),reorder=Number(x.reorder_level||0),cost=Number(x.cost||0),sell=Number(x.sell_price||0),gp=sell-cost,margin=sell>0?gp/sell*100:0;return `<tr><td><b>${esc(x.part_number||'—')}</b></td><td>${esc(x.description||'')}</td><td class="${qty<=0?'out':qty<=reorder?'low':''}">${qty}${qty<=0?' · OUT':qty<=reorder?' · LOW':''}</td><td>${reorder}</td><td>${money(cost)}</td><td>${money(sell)}</td><td class="${gp>=0?'profit':'out'}">${money(gp)}</td><td>${margin.toFixed(1)}%</td><td>${esc(x.location||'—')}</td><td><button class="rowbtn editbtn" onclick="editPart(${Number(x.id)})">Edit</button><button class="rowbtn deletebtn" onclick="deletePart(${Number(x.id)})">Delete</button></td></tr>`}).join(''):'<tr><td colspan="10" class="muted">No inventory matches this view.</td></tr>'}async function editPart(id){const x=inventory.find(item=>Number(item.id)===Number(id));if(!x)return setMessage('Inventory item not found.','error');const partNumber=prompt('Part number:',x.part_number||'');if(partNumber===null)return;const description=prompt('Description:',x.description||'');if(description===null)return;const quantity=prompt('Quantity:',x.quantity??0);if(quantity===null)return;const cost=prompt('Cost:',x.cost??0);if(cost===null)return;const sell=prompt('Sell price:',x.sell_price??0);if(sell===null)return;const reorderLevel=prompt('Reorder at:',x.reorder_level??0);if(reorderLevel===null)return;const location=prompt('Location:',x.location||'');if(location===null)return;const nums=[Number(quantity),Number(cost),Number(sell),Number(reorderLevel)];if(!description.trim())return setMessage('Description is required.','error');if(nums.some(n=>!Number.isFinite(n)||n<0))return setMessage('Quantity and prices cannot be negative.','error');try{setMessage('Saving changes…');await api('/api/v2/inventory/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({part_number:partNumber.trim(),description:description.trim(),quantity:nums[0],cost:nums[1],sell_price:nums[2],reorder_level:nums[3],location:location.trim()})});setMessage('Inventory part updated.','ok');await load()}catch(e){setMessage(e.message,'error')}}
async function deletePart(id){const x=inventory.find(item=>Number(item.id)===Number(id));if(!x)return setMessage('Inventory item not found.','error');if(!confirm('Delete '+(x.part_number||x.description)+' from this shop inventory?'))return;try{setMessage('Deleting…');await api('/api/v2/inventory/'+encodeURIComponent(id),{method:'DELETE'});setMessage('Inventory part deleted.','ok');await load()}catch(e){setMessage(e.message,'error')}}
async function load(){try{inventory=await api('/api/v2/inventory');metrics();render()}catch(e){setMessage(e.message,'error')}}async function add(){const description=desc.value.trim(),quantity=Number(qty.value||0),c=Number(cost.value||0),s=Number(sell.value||0),r=Number(reorder.value||0);if(!description)return setMessage('Description is required.','error');if([quantity,c,s,r].some(n=>!Number.isFinite(n)||n<0))return setMessage('Quantity and prices cannot be negative.','error');addBtn.disabled=true;setMessage('Saving…');try{await api('/api/v2/inventory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({part_number:part.value.trim(),description,quantity,cost:c,sell_price:s,reorder_level:r,location:loc.value.trim()})});part.value=desc.value=qty.value=cost.value=sell.value=reorder.value=loc.value='';setMessage('Inventory part added.','ok');await load()}catch(e){setMessage(e.message,'error')}finally{addBtn.disabled=false}}load();setInterval(load,60000);
</script></body></html>
