<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 Inventory</title><style>body{margin:0;background:#090c0f;color:#eee;font:14px Arial}header,.wrap{padding:20px;max-width:1200px;margin:auto}header{max-width:none;background:#101419;border-bottom:1px solid #29323a}b.g{color:#f33}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;background:#11161a;padding:18px;border:1px solid #29323a;border-radius:10px}input{background:#090d10;color:#fff;border:1px solid #35404a;border-radius:6px;padding:11px;width:100%;box-sizing:border-box}button{background:#e53228;color:#fff;border:0;border-radius:6px;padding:11px 16px;font-weight:bold}table{width:100%;border-collapse:collapse;margin-top:20px;background:#11161a}th,td{text-align:left;padding:12px;border-bottom:1px solid #283139}th{color:#9aa4ab}.low{color:#ffcf5a}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><header><b class="g">G</b> <b>GARAVEX V2 · PARTS & INVENTORY</b></header><main class="wrap"><h1>Inventory</h1><div class="grid"><input id="part" placeholder="Part number"><input id="desc" placeholder="Description"><input id="qty" type="number" placeholder="Qty"><input id="cost" type="number" step=".01" placeholder="Cost"><input id="sell" type="number" step=".01" placeholder="Sell price"><input id="reorder" type="number" placeholder="Reorder at"><input id="loc" placeholder="Location"><button onclick="add()">Add Part</button></div><table><thead><tr><th>Part</th><th>Description</th><th>Qty</th><th>Cost</th><th>Sell</th><th>Gross Profit</th><th>Location</th></tr></thead><tbody id="rows"></tbody></table></main><script>const money=n=>'$'+Number(n||0).toFixed(2);async function api(u,o){const r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){const d=await api('/api/v2/inventory');rows.innerHTML=d.map(x=>`<tr><td>${x.part_number||''}</td><td>${x.description}</td><td class="${x.quantity<=x.reorder_level?'low':''}">${x.quantity}</td><td>${money(x.cost)}</td><td>${money(x.sell_price)}</td><td>${money(x.sell_price-x.cost)}</td><td>${x.location||''}</td></tr>`).join('')}async function add(){try{await api('/api/v2/inventory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({part_number:part.value,description:desc.value,quantity:+qty.value||0,cost:+cost.value||0,sell_price:+sell.value||0,reorder_level:+reorder.value||0,location:loc.value})});load()}catch(e){alert(e.message)}}load()</script></body></html>
