<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex Plans</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1115;color:#f5f7f9;font-family:Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:38px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.top a{color:#fff;text-decoration:none;background:#2a333b;padding:10px 14px;border-radius:7px}h1{font-size:36px;margin:25px 0 6px}.sub{color:#aeb7c1;margin-bottom:28px}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.plan{background:#171d22;border:1px solid #323b43;border-radius:14px;padding:24px}.plan.pro{border:2px solid #ef3e23}.badge{display:inline-block;background:#ef3e23;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.plan h2{margin:14px 0 5px}.limit{color:#aeb7c1;margin-bottom:18px}.features{padding-left:20px;line-height:1.8}.current{margin-top:20px;padding:12px;border-radius:8px;background:#222a31;font-weight:700}.note{margin-top:26px;color:#aeb7c1;font-size:14px}.error{padding:16px;background:#442020;border-radius:8px}@media(max-width:800px){.plans{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><strong>G GARAVEX V2</strong><a href="dashboard.html">Dashboard</a></div><h1>Garavex Plans</h1><div class="sub">Choose the feature level that fits your shop. Billing activation will be enabled after Stripe recurring prices are configured.</div><div id="status"></div><div id="plans" class="plans"><div>Loading plans…</div></div><div class="note">Plan enforcement is performed by the Garavex server by shop ID. Billing controls are owner-only.</div></div><script>const labels={customers:'Customers',vehicles:'Vehicles',appointments:'Appointments',estimates:'Estimates',repair_orders:'Repair Orders',invoices:'Invoices',payments:'Payments',service_history:'Service History',dvi:'Digital Vehicle Inspections',inventory:'Inventory',technician_workflow:'Technician Workflow',recommended_repairs:'Recommended Repairs',customer_approvals:'Customer Approvals',sms:'SMS Communications',reports:'Reports',deferred_services:'Deferred Services',quickbooks:'QuickBooks',loaners:'Loaners',advanced_reporting:'Advanced Reporting',profitability:'Profitability',advanced_workflow:'Advanced Workflow & Dispatch',warranty_comebacks:'Warranty & Comebacks',automation:'Automation'};async function load(){try{const [p,s]=await Promise.all([fetch('/api/v2/plans'),fetch('/api/v2/subscription')]);if(!p.ok)throw new Error('Unable to load plans.');const plans=(await p.json()).plans||[];let current=null;if(s.ok)current=await s.json();document.getElementById('status').innerHTML=current?`<div class="current">Current plan: ${current.plan.name} · ${current.employeeCount}${current.plan.employeeLimit?` / ${current.plan.employeeLimit}`:''} active employees</div>`:'';document.getElementById('plans').innerHTML=plans.map(x=>`<section class="plan ${x.key==='professional'?'pro':''}">${x.key==='professional'?'<span class="badge">POPULAR</span>':''}<h2>${x.name}</h2><div class="limit">${x.employeeLimit?`Up to ${x.employeeLimit} active employees`:'Unlimited employees'}</div><ul class="features">${x.features.map(f=>`<li>${labels[f]||f}</li>`).join('')}</ul>${current&&current.plan.key===x.key?'<div class="current">Your current plan</div>':''}</section>`).join('');}catch(e){document.getElementById('plans').innerHTML=`<div class="error">${e.message}</div>`}}load();</script></body></html>
