<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GARAVEX | Order Parts</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select{width:100%;padding:11px;background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;margin:5px 0}.btn{background:#df3329;color:white;border:0;border-radius:7px;padding:11px 14px;font-weight:bold;cursor:pointer}.secondary{background:#28323a}.btn:disabled{opacity:.5;cursor:not-allowed}.muted{color:#89959e}.row{padding:12px 0;border-bottom:1px solid #283139}.total{font-size:20px;text-align:right;margin-top:12px}.good{color:#58c87b}.warn{color:#f2b84b}.error{color:#ff655d}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Order Parts</h1><p class="muted">Build a supplier cart for a repair order. Live supplier submission unlocks after the shop's authorized supplier connection is active.</p>
<section class="card"><h2>1. Repair Order & Supplier</h2><div class="grid"><div><label>Repair Order #</label><input id="ro" type="number" min="1"></div><div><label>Supplier</label><select id="provider"><option value="oreilly">O'Reilly Pro</option><option value="autozone">AutoZone Pro</option></select></div></div><button class="btn" onclick="startDraft()">Start Parts Order</button><div id="startMsg" class="muted"></div></section>
<section id="cartCard" class="card" style="display:none"><h2>2. Add Parts</h2><div id="supplierState" class="muted"></div><div class="grid"><input id="part" placeholder="Part number"><input id="desc" placeholder="Part description"><input id="qty" type="number" min=".01" step=".01" value="1" placeholder="Quantity"><input id="cost" type="number" min="0" step=".01" placeholder="Shop cost"><input id="sell" type="number" min="0" step=".01" placeholder="Customer price"></div><button class="btn secondary" onclick="addPart()">Add to Cart</button><h3>Order Review</h3><div id="items"></div><div class="total">Cost: <b id="totalCost">$0.00</b> · Sell: <b id="totalSell">$0.00</b> · Gross: <b id="gross">$0.00</b></div><div style="margin-top:14px"><button class="btn secondary" onclick="createPO()">Create GARAVEX PO</button> <button id="liveOrder" class="btn" disabled onclick="placeOrder()">Place Supplier Order</button></div><div id="cartMsg" class="muted"></div></section></main><script>
let draftId=null,draft=null;const money=n=>'$'+Number(n||0).toFixed(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o){const r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
const qp=new URLSearchParams(location.search);if(qp.get('ro'))ro.value=qp.get('ro');
async function startDraft(){startMsg.textContent='Starting…';try{const d=await api('/api/v2/supplier-order-drafts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({repair_order_id:Number(ro.value),provider:provider.value})});draftId=d.id;cartCard.style.display='block';startMsg.textContent='Supplier cart #'+draftId+' created.';await loadDraft()}catch(e){startMsg.textContent=e.message}}
async function loadDraft(){draft=await api('/api/v2/supplier-order-drafts/'+draftId);const live=Boolean(draft.connection&&draft.connection.live_ordering_enabled);supplierState.className=live?'good':'warn';supplierState.textContent=live?(draft.connection.display_name+' connection is live.'):'Supplier connection is not live yet. You can prepare the order and GARAVEX PO, but supplier submission is locked.';liveOrder.disabled=!live;items.innerHTML=draft.items.length?draft.items.map(x=>'<div class="row"><b>'+esc(x.part_number||'Part')+'</b> · '+esc(x.description)+'<div class="muted">'+x.quantity+' × '+money(x.unit_cost)+' cost · '+money(x.sell_price)+' sell each</div></div>').join(''):'<div class="muted">No parts added yet.</div>';let c=0,s=0;draft.items.forEach(x=>{c+=Number(x.quantity)*Number(x.unit_cost);s+=Number(x.quantity)*Number(x.sell_price)});totalCost.textContent=money(c);totalSell.textContent=money(s);gross.textContent=money(s-c)}
async function addPart(){if(!draftId)return;try{await api('/api/v2/supplier-order-drafts/'+draftId+'/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({part_number:part.value.trim(),description:desc.value.trim(),quantity:Number(qty.value),unit_cost:Number(cost.value),sell_price:Number(sell.value)})});part.value=desc.value=cost.value=sell.value='';qty.value='1';cartMsg.textContent='Part added.';await loadDraft()}catch(e){cartMsg.textContent=e.message}}
async function createPO(){try{const d=await api('/api/v2/supplier-order-drafts/'+draftId+'/create-po',{method:'POST'});cartMsg.textContent='Created '+d.po_number+' in GARAVEX purchasing.';await loadDraft()}catch(e){cartMsg.textContent=e.message}}
async function placeOrder(){try{await api('/api/v2/supplier-integrations/'+draft.provider+'/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({draft_id:draftId})})}catch(e){cartMsg.textContent=e.message}}
</script></body></html>
