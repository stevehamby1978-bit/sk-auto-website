<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Attention</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:12px 0}.muted{color:#89959e}.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px}.num{font-size:34px;font-weight:800}.alert{display:grid;grid-template-columns:100px 1fr 120px;gap:12px;align-items:center;border-bottom:1px solid #29323a;padding:14px 0}.critical{color:#ff655d;font-weight:bold}.warning{color:#f2b84b;font-weight:bold}.tag{text-transform:uppercase;font-size:11px}.btn{background:#df3329;color:#fff;text-decoration:none;padding:8px 11px;border-radius:7px;text-align:center}@media(max-width:650px){.alert{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Attention Center</h1><p class="muted">Problems that are becoming expensive, late, or easy to forget.</p><div id="summary" class="summary"></div><section class="card"><div id="alerts"></div></section></main><script>const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/v2/alerts'),d=await r.json();if(!r.ok)return;summary.innerHTML=`<div class="card"><div class="num">${d.count}</div><div class="muted">Needs attention</div></div><div class="card"><div class="num critical">${d.critical}</div><div class="muted">Critical</div></div>`;alerts.innerHTML=d.alerts.length?d.alerts.map(x=>`<div class="alert"><div class="${e(x.severity)} tag">${e(x.severity)}</div><div><b>${e(x.title)}</b><div class="muted">${e(x.type.replaceAll('_',' '))} · ${e(x.when||'')}</div></div>${x.repair_order_id?`<a class="btn" href="v2-timeline.html?ro=${x.repair_order_id}">RO #${x.repair_order_id}</a>`:''}</div>`).join(''):'<p class="muted">Nothing needs immediate attention.</p>'}load();setInterval(load,60000);</script></body></html>
