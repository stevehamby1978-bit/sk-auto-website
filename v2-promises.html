<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Promised Times</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.muted{color:#89959e}.row{display:grid;grid-template-columns:150px 1.2fr 1fr 1fr;gap:12px;padding:13px 0;border-bottom:1px solid #283139}.late{color:#f06b62;font-weight:bold}.soon{color:#f2b84b;font-weight:bold}.ok{color:#58c87b}.form{display:grid;grid-template-columns:120px 1fr 2fr auto;gap:8px}input{background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:10px}.btn{background:#df3329;color:white;border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}@media(max-width:700px){.row,.form{display:block}.row>*,.form>*{margin:6px 0;width:100%}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Promised Completion Times</h1><p class="muted">Track what the shop promised the customer and catch jobs that are at risk before the deadline is missed.</p><section class="card"><div class="form"><input id="ro" type="number" placeholder="RO #"><input id="when" type="datetime-local"><input id="note" placeholder="Promise note (optional)"><button class="btn" onclick="save()">Set Promise</button></div></section><section class="card"><div class="row muted"><b>Promise</b><b>Customer / Vehicle</b><b>Technician</b><b>Workflow</b></div><div id="rows"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function urgency(x){const ms=new Date(x)-Date.now();return ms<0?'late':ms<7200000?'soon':'ok'}async function load(){const r=await fetch('/api/v2/promises'),d=await r.json();if(!r.ok){rows.textContent=d.error||'Unable to load promises';return}rows.innerHTML=d.length?d.map(x=>`<div class="row"><div class="${urgency(x.promised_at)}">${esc(new Date(x.promised_at).toLocaleString())}</div><div><b>RO #${x.repair_order_id} · ${esc(x.customer_name)}</b><div class="muted">${esc([x.year,x.make,x.model].filter(Boolean).join(' '))}</div>${x.note?`<small>${esc(x.note)}</small>`:''}</div><div>${esc(x.technician_name||'Unassigned')}</div><div>${esc(x.workflow_status||'waiting')}</div></div>`).join(''):'<p class="muted">No promised times set.</p>'}async function save(){const r=await fetch('/api/v2/repair-orders/'+ro.value+'/promise',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({promised_at:when.value,note:note.value})}),d=await r.json();if(!r.ok)return alert(d.error||'Unable to save');ro.value=when.value=note.value='';load()}load();setInterval(load,60000);</script></body></html>
