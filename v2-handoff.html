<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Shift Handoff</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:950px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:13px 0}.muted{color:#89959e}.form{display:grid;grid-template-columns:160px 1fr;gap:9px}input,textarea{background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:10px}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}.done{background:#246c3b}.section{margin:10px 0;white-space:pre-wrap}.urgent{color:#ff655d}.row{border-bottom:1px solid #29323a;padding:14px 0}@media(max-width:650px){.form{display:block}.form>*{width:100%;margin:5px 0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Shift Handoff</h1><p class="muted">Leave the next person a clean picture of what cannot be dropped.</p><section class="card"><div class="form"><input id="date" type="date"><textarea id="summary" rows="3" placeholder="Overall shop handoff"></textarea><span class="urgent">Urgent</span><textarea id="urgent" rows="2" placeholder="Vehicles or problems requiring immediate attention"></textarea><span>Parts</span><textarea id="parts" rows="2" placeholder="Parts ETAs, backorders, returns"></textarea><span>Customers</span><textarea id="customers" rows="2" placeholder="Callbacks, approvals, promises"></textarea></div><button class="btn" style="margin-top:10px" onclick="save()">Save Handoff</button></section><section class="card"><h2>Open Handoffs</h2><div id="list"></div></section></main><script>const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));date.value=new Date().toISOString().slice(0,10);async function load(){const r=await fetch('/api/v2/handoffs'),d=await r.json();if(!r.ok)return;list.innerHTML=d.length?d.map(x=>`<div class="row"><b>${e(x.shift_date)} · ${e(x.employee_name||'Employee')}</b><div class="section">${e(x.summary)}</div>${x.urgent_items?`<div class="section urgent"><b>URGENT</b> ${e(x.urgent_items)}</div>`:''}${x.parts_items?`<div class="section"><b>PARTS</b> ${e(x.parts_items)}</div>`:''}${x.customer_items?`<div class="section"><b>CUSTOMERS</b> ${e(x.customer_items)}</div>`:''}<button class="btn done" onclick="complete(${x.id})">Handoff Complete</button></div>`).join(''):'<p class="muted">No open handoffs.</p>'}async function save(){const r=await fetch('/api/v2/handoffs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shift_date:date.value,summary:summary.value,urgent_items:urgent.value,parts_items:parts.value,customer_items:customers.value})}),d=await r.json();if(!r.ok)return alert(d.error||'Unable to save');summary.value=urgent.value=parts.value=customers.value='';load()}async function complete(id){const r=await fetch('/api/v2/handoffs/'+id+'/complete',{method:'PATCH'});if(r.ok)load()}load();</script></body></html>
