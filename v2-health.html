<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Release Readiness</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #283139}.yes{color:#58c87b}.no{color:#f06b62}.muted{color:#89959e}.banner{padding:16px;border-radius:9px;font-size:17px;font-weight:bold}.good{background:#102219;border:1px solid #2d6c42}.bad{background:#241511;border:1px solid #6e392f}.btn{background:#252d34;color:white;border:1px solid #37414a;border-radius:6px;padding:9px 12px;cursor:pointer}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>V2 Release Readiness</h1><p class="muted">Development health checks. Passing this screen is necessary, but does not replace end-to-end release testing.</p><button class="btn" onclick="load()">Run Checks</button><div id="banner" class="card">Running checks…</div><section class="card"><h2>Runtime & Integrations</h2><div id="checks"></div></section><section class="card"><h2>Required V2 Tables</h2><div id="tables"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function rows(a){return a.map(x=>`<div class="row"><b>${esc(x.label||x.name)}</b><strong class="${x.ok?'yes':'no'}">${x.ok?'PASS':'FAIL'}</strong></div>`).join('')}async function load(){const r=await fetch('/api/v2/health'),d=await r.json();if(!r.ok){banner.className='banner bad';banner.textContent=d.error||'Unable to run checks';return}banner.className='banner '+(d.ok?'good':'bad');banner.textContent=d.ok?'Development health checks passed. Continue with full release testing.':'V2 is not release-ready. Fix failed checks before validation.';checks.innerHTML=rows(d.checks);tables.innerHTML=rows(d.tables)}load();</script></body></html>
