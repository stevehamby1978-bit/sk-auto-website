<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Release Readiness</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1050px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:18px;margin:14px 0}.row{display:grid;grid-template-columns:1.5fr 90px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid #283139;align-items:center}.yes{color:#58c87b}.no{color:#f06b62}.warn{color:#f2b84b}.muted{color:#89959e}.banner{padding:16px;border-radius:9px;font-size:16px;font-weight:bold;margin:14px 0}.good{background:#102219;border:1px solid #2d6c42}.bad{background:#241511;border:1px solid #6e392f}.running{background:#171c21;border:1px solid #39444d}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.55}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.stamp{margin-left:auto}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#10151a;border:1px solid #29323a;border-radius:10px;padding:14px}.metric b{display:block;font-size:25px;margin-top:5px}.failure{border-left:3px solid #f06b62;padding-left:10px}.warning{border-left:3px solid #f2b84b;padding-left:10px}.empty{padding:12px 0}.sectionHead{display:flex;justify-content:space-between;gap:10px;align-items:center}@media(max-width:700px){.row{display:block}.row>*{display:block;margin:5px 0}.summary{grid-template-columns:1fr 1fr}.stamp{margin-left:0}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>V2 Release Readiness</h1><p class="muted">Runtime, database, schema and integration checks. This gate complements the deeper V2 release-test suite.</p><div class="toolbar"><button id="runBtn" class="btn" onclick="load()">Run Readiness Checks</button><label class="muted"><input id="issuesOnly" type="checkbox" onchange="render()"> Show issues only</label><span id="stamp" class="muted stamp"></span></div><div id="banner" class="banner running">Waiting to run…</div><div id="summary" class="summary"></div><section class="card"><div class="sectionHead"><h2>Runtime & Integrations</h2><span id="provider" class="muted"></span></div><div id="checks"></div></section><section class="card"><h2>Required V2 Tables</h2><div id="tables"></div></section><section class="card"><h2>Required V2 Columns</h2><div id="columns"></div></section></main><script>
let result=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const checksEl=document.getElementById('checks'),tablesEl=document.getElementById('tables'),columnsEl=document.getElementById('columns');
function row(label,ok,detail,optional=false){const cls=ok?'':optional?'warning':'failure',state=ok?'PASS':optional?'WARN':'FAIL',tone=ok?'yes':optional?'warn':'no';return `<div class="row ${cls}"><b>${esc(label)}</b><strong class="${tone}">${state}</strong><span class="muted">${esc(detail||'')}</span></div>`}
function render(){
 if(!result)return;
 const d=result,checks=d.checks||[],tables=d.tables||[],cols=d.columns||[],blockers=d.blockers||[],warnings=d.warnings||[],filter=document.getElementById('issuesOnly').checked;
 document.getElementById('summary').innerHTML=`<div class="metric"><span class="muted">Release blockers</span><b class="${blockers.length?'no':'yes'}">${blockers.length}</b></div><div class="metric"><span class="muted">Warnings</span><b class="${warnings.length?'warn':'yes'}">${warnings.length}</b></div><div class="metric"><span class="muted">Required tables</span><b>${tables.filter(x=>x.ok&&x.shop_scoped).length}/${tables.length}</b></div><div class="metric"><span class="muted">Required columns</span><b>${cols.filter(x=>x.ok).length}/${cols.length}</b></div>`;
 const c=filter?checks.filter(x=>!x.ok):checks;
 checksEl.innerHTML=c.length?c.map(x=>row(x.label,x.ok,x.detail||(!x.ok&&!x.required?'Optional integration not configured':''),!x.required)).join(''):'<div class="muted empty">No issues in this section.</div>';
 const t=filter?tables.filter(x=>!x.ok||!x.shop_scoped):tables;
 tablesEl.innerHTML=t.length?t.map(x=>row(x.name,x.ok&&x.shop_scoped,!x.ok?'Table missing':x.shop_scoped?'shop_id present':'shop_id missing')).join(''):'<div class="muted empty">No issues in this section.</div>';
 const cc=filter?cols.filter(x=>!x.ok):cols;
 columnsEl.innerHTML=cc.length?cc.map(x=>row(`${x.table}.${x.column}`,x.ok,x.ok?'Column present':'Column missing')).join(''):'<div class="muted empty">No issues in this section.</div>';
 document.getElementById('provider').textContent=`Payment: ${String(d.payment_provider||'unknown').toUpperCase()} · QuickBooks required: ${d.quickbooks_required?'Yes':'No'}`;
 document.getElementById('stamp').textContent=d.timestamp?'Last run: '+new Date(d.timestamp).toLocaleString():'';
}
async function load(){
 const runBtn=document.getElementById('runBtn'),banner=document.getElementById('banner');
 runBtn.disabled=true;banner.className='banner running';banner.textContent='Running V2 readiness checks…';
 try{
  const r=await fetch('/api/v2/health',{headers:{Accept:'application/json'},cache:'no-store'}),d=await r.json();
  if(!r.ok)throw Error(d.error||'Unable to run checks');
  result=d;banner.className='banner '+(d.release_ready?'good':'bad');banner.textContent=d.release_ready?'Readiness gate passed. Continue with full release tests and end-to-end validation.':`${(d.blockers||[]).length} release blocker(s) detected. V2 must not be deployed yet.`;render();
 }catch(e){result=null;banner.className='banner bad';banner.textContent=e.message||'Unable to run checks';document.getElementById('summary').innerHTML='';checksEl.innerHTML=tablesEl.innerHTML=columnsEl.innerHTML='<div class="muted empty">Readiness results unavailable.</div>';document.getElementById('provider').textContent='';document.getElementById('stamp').textContent=''}finally{runBtn.disabled=false}
}
load();
</script></body></html>
