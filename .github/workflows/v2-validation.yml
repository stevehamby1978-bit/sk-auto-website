name: Garavex V2 Validation

on:
  push:
    branches:
      - garavex-v2
  pull_request:
    branches:
      - garavex-v2

permissions:
  contents: read

jobs:
  validate-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run V2 static validation
        run: npm run validate:v2
