<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>Garavex V2 | VIN Intake</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:850px;margin:auto;padding:25px}.card{background:#10151a;border:1px solid #29323a;border-radius:12px;padding:20px;margin-top:20px}.bar{display:flex;gap:8px}input{flex:1;background:#0b0f12;border:1px solid #303942;color:white;border-radius:7px;padding:13px;text-transform:uppercase}.btn{background:#df3329;color:white;border:0;border-radius:7px;padding:0 18px;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.field{background:#0b0f12;border:1px solid #252d34;padding:12px;border-radius:7px}.field small{color:#87939b;display:block}.field b{font-size:17px}.muted{color:#89959e}.error{color:#ff655d}.warning{grid-column:1/-1;border:1px solid #6f5721;background:#211b0d;color:#f2c766;padding:12px;border-radius:7px}@media(max-width:600px){.grid{grid-template-columns:1fr}.bar{display:block}.btn{padding:13px;width:100%;margin-top:8px}.warning{grid-column:auto}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>VIN Intake</h1><p class="muted">Enter or scan a 17-character VIN to populate vehicle details.</p><section class="card"><div class="bar"><input id="vin" maxlength="17" minlength="17" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Vehicle identification number" placeholder="17-character VIN"><button id="decodeBtn" class="btn" type="button">Decode VIN</button></div><div class="grid" id="result" aria-live="polite"></div></section></main><script>(()=>{'use strict';const vin=document.getElementById('vin'),decodeBtn=document.getElementById('decodeBtn'),result=document.getElementById('result'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let activeController=null,requestNumber=0;function normalized(){return vin.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g,'').slice(0,17)}function showError(text){result.innerHTML='<div class="error">'+esc(text||'Unable to decode VIN.')+'</div>'}async function decode(){const value=normalized();vin.value=value;if(value.length!==17)return showError('Enter a valid 17-character VIN.');if(activeController)activeController.abort();const controller=new AbortController();activeController=controller;const mine=++requestNumber;decodeBtn.disabled=true;result.innerHTML='<div class="muted">Decoding…</div>';try{const r=await fetch('/api/v2/vin/'+encodeURIComponent(value),{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'},signal:controller.signal});let d={};try{d=await r.json()}catch{}if(mine!==requestNumber)return;if(r.status===401){location.href='/login.html';return}if(!r.ok)return showError(d.error||'Unable to decode VIN.');if(String(d.vin||'').toUpperCase()!==value)return showError('VIN response could not be verified.');const fields=[['Year',d.year],['Make',d.make],['Model',d.model],['Trim',d.trim],['Engine',d.engine],['Body',d.body],['Drive',d.drive],['Transmission',d.transmission],['Assembly',d.plant],['VIN',d.vin]];result.innerHTML=(d.decode_warning?'<div class="warning">VIN decoder warning: '+esc(d.decode_warning)+'</div>':'')+fields.map(([k,v])=>`<div class="field"><small>${esc(k)}</small><b>${esc(v||'—')}</b></div>`).join('')}catch(e){if(e.name!=='AbortError'&&mine===requestNumber)showError('VIN decoding service is temporarily unavailable.')}finally{if(mine===requestNumber){decodeBtn.disabled=false;if(activeController===controller)activeController=null}}}vin.addEventListener('input',()=>{const clean=normalized();if(vin.value!==clean)vin.value=clean});vin.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();decode()}});decodeBtn.addEventListener('click',decode)})();</script></body></html>
