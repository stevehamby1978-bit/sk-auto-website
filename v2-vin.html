<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | VIN Intake</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:850px;margin:auto;padding:25px}.card{background:#10151a;border:1px solid #29323a;border-radius:12px;padding:20px;margin-top:20px}.bar{display:flex;gap:8px}input{flex:1;background:#0b0f12;border:1px solid #303942;color:white;border-radius:7px;padding:13px;text-transform:uppercase}.btn{background:#df3329;color:white;border:0;border-radius:7px;padding:0 18px;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.field{background:#0b0f12;border:1px solid #252d34;padding:12px;border-radius:7px}.field small{color:#87939b;display:block}.field b{font-size:17px}.muted{color:#89959e}@media(max-width:600px){.grid{grid-template-columns:1fr}.bar{display:block}.btn{padding:13px;width:100%;margin-top:8px}}</style></head><body><main class="wrap"><a style="color:#ddd" href="v2-dashboard.html">← V2 Operations</a><h1>VIN Intake</h1><p class="muted">Enter or scan a 17-character VIN to populate vehicle details.</p><section class="card"><div class="bar"><input id="vin" maxlength="17" placeholder="17-character VIN"><button class="btn" onclick="decode()">Decode VIN</button></div><div class="grid" id="result"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function decode(){result.innerHTML='<div class="muted">Decoding…</div>';const r=await fetch('/api/v2/vin/'+encodeURIComponent(vin.value.trim())),d=await r.json();if(!r.ok){result.innerHTML='<div class="muted">'+esc(d.error)+'</div>';return}const fields=[['Year',d.year],['Make',d.make],['Model',d.model],['Trim',d.trim],['Engine',d.engine],['Body',d.body],['Drive',d.drive],['Transmission',d.transmission],['Assembly',d.plant],['VIN',d.vin]];result.innerHTML=fields.map(([k,v])=>`<div class="field"><small>${k}</small><b>${esc(v||'—')}</b></div>`).join('')}vin.addEventListener('keydown',e=>{if(e.key==='Enter')decode()});</script></body></html>
