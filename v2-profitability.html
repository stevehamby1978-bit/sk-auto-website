<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 Profitability</title><style>body{margin:0;background:#090c0f;color:#eee;font:14px Arial}.wrap{max-width:1100px;margin:auto;padding:25px}.brand{padding:20px;background:#101419;border-bottom:1px solid #29323a}.g{color:#f33}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#11161a;border:1px solid #29323a;border-radius:10px;padding:20px}.card small{color:#8d99a2}.card b{font-size:28px;display:block;margin-top:8px}.wide{grid-column:span 2}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}</style></head><body><div class="brand"><b class="g">G</b> <b>GARAVEX V2 · PROFITABILITY</b></div><main class="wrap"><h1>Shop Profitability</h1><div class="cards" id="cards"></div></main><script>const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});fetch('/api/v2/profitability').then(r=>r.json()).then(x=>cards.innerHTML=`<div class="card"><small>TOTAL SALES</small><b>${money(x.sales)}</b></div><div class="card"><small>GROSS PROFIT</small><b>${money(x.gross_profit)}</b></div><div class="card"><small>GROSS MARGIN</small><b>${Number(x.gross_margin||0).toFixed(1)}%</b></div><div class="card"><small>TOTAL COST</small><b>${money(x.cost)}</b></div><div class="card wide"><small>PARTS</small><b>${money(x.parts_sales)} sales · ${money(x.parts_cost)} cost</b></div><div class="card wide"><small>LABOR</small><b>${money(x.labor_sales)} sales · ${money(x.labor_cost)} cost</b></div>`)</script></body></html>
