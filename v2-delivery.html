<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Delivery</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:850px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:20px;margin:14px 0}.muted{color:#89959e}.top{display:flex;gap:8px}input[type=number],textarea{width:100%;background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:11px}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:11px 16px;font-weight:bold;cursor:pointer}.check{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #29323a;font-size:15px}.complete{background:#1d6735}.status{padding:12px;border-radius:8px;margin-top:12px}.ok{background:#12301d;color:#72dd91}.bad{background:#351616;color:#ff8279}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Customer Delivery</h1><p class="muted">Final handoff checklist so completed work does not end with a rushed counter transaction.</p><section class="card"><div class="top"><input id="ro" type="number" placeholder="Repair order #"><button class="btn" onclick="show()">Start Delivery</button></div></section><section id="form" class="card" style="display:none"><label class="check"><input id="notified" type="checkbox"> Customer notified vehicle is ready</label><label class="check"><input id="keys" type="checkbox"> Keys returned to customer</label><label class="check"><input id="parts" type="checkbox"> Old parts returned/request addressed</label><label class="check"><input id="docs" type="checkbox"> Invoice and service documents provided</label><label class="check"><input id="next" type="checkbox"> Recommended / next service explained</label><textarea id="notes" rows="4" placeholder="Delivery notes"></textarea><div class="top" style="margin-top:12px"><button class="btn" onclick="save()">Save Checklist</button><button class="btn complete" onclick="finish()">Complete Delivery</button></div><div id="status"></div></section></main><script>function show(){if(!ro.value)return;form.style.display='block';status.innerHTML=''}async function save(){const r=await fetch('/api/v2/repair-orders/'+ro.value+'/delivery',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_notified:notified.checked,keys_returned:keys.checked,old_parts_returned:parts.checked,documents_given:docs.checked,next_service_explained:next.checked,notes:notes.value})}),d=await r.json();status.innerHTML=`<div class="status ${r.ok?'ok':'bad'}">${r.ok?'Checklist saved.':(d.error||'Unable to save')}</div>`;return r.ok}async function finish(){if(!(await save()))return;const r=await fetch('/api/v2/repair-orders/'+ro.value+'/delivery/complete',{method:'PATCH'}),d=await r.json();status.innerHTML=`<div class="status ${r.ok?'ok':'bad'}">${r.ok?'✓ Vehicle delivery recorded.':(d.error+(d.missing?' '+d.missing.join(', '):''))}</div>`}</script></body></html>
