<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Delivery</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1050px;margin:auto;padding:24px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:20px;margin:14px 0}.muted{color:#89959e}.top{display:flex;gap:8px;align-items:center}input[type=number],input[type=text],textarea{width:100%;background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:11px}.btn{background:#df3329;color:#fff;border:0;border-radius:7px;padding:11px 16px;font-weight:bold;cursor:pointer}.btn.secondary{background:#28323a}.btn.complete{background:#1d6735}.btn:disabled{opacity:.55}.check{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #29323a;font-size:15px}.check input{transform:scale(1.2)}.status{padding:12px;border-radius:8px;margin-top:12px}.ok{background:#12301d;color:#72dd91}.bad{background:#351616;color:#ff8279}.warn{background:#3c3014;color:#f2c35f}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#0b0f12;border:1px solid #29323a;border-radius:9px;padding:12px}.metric b{display:block;font-size:21px;margin-top:4px}.gate{padding:9px 0;border-bottom:1px solid #283139}.pass{color:#72dd91}.fail{color:#ff8279}.history{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.delivery{background:#0b0f12;border:1px solid #29323a;border-radius:9px;padding:13px}.missing{margin:8px 0;padding-left:18px}.missing li{margin:5px 0}.header{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{font-size:11px;font-weight:bold;border-radius:15px;padding:5px 8px;background:#222a31}.delivered{color:#72dd91}.pending{color:#f2c35f}@media(max-width:650px){.top,.header{align-items:stretch;flex-direction:column}.summary{grid-template-columns:1fr}.history{grid-template-columns:1fr}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Customer Delivery</h1><p class="muted">Final handoff checklist with workflow and payment verification before a vehicle leaves the shop.</p><section class="card"><div class="top"><input id="ro" type="number" min="1" placeholder="Repair order #"><button id="startBtn" class="btn" onclick="start()">Load Delivery</button></div><div id="loadStatus"></div></section><section id="form" class="card" style="display:none"><div class="header"><h2 id="title">Delivery Checklist</h2><span id="gateBadge" class="badge"></span></div><div id="gates"></div><label class="check"><input id="notified" type="checkbox"> Customer notified vehicle is ready</label><label class="check"><input id="keys" type="checkbox"> Keys returned to customer</label><label class="check"><input id="parts" type="checkbox"> Old parts returned / request addressed</label><label class="check"><input id="docs" type="checkbox"> Invoice and service documents provided</label><label class="check"><input id="next" type="checkbox"> Recommended / next service explained</label><textarea id="notes" maxlength="2000" rows="4" placeholder="Delivery notes"></textarea><div class="top" style="margin-top:12px"><button id="saveBtn" class="btn secondary" onclick="save()">Save Checklist</button><button id="finishBtn" class="btn complete" onclick="finish()">Complete Delivery</button></div><div id="status"></div></section><section class="card"><div class="header"><h2>Recent Deliveries</h2><button class="btn secondary" onclick="loadHistory()">Refresh</button></div><div class="summary"><div class="metric"><span class="muted">Pending handoffs</span><b id="pendingCount">0</b></div><div class="metric"><span class="muted">Delivered records</span><b id="doneCount">0</b></div><div class="metric"><span class="muted">Showing</span><b id="showingCount">0</b></div></div><input id="search" type="text" placeholder="Search RO, customer or vehicle" oninput="renderHistory()" style="margin:12px 0"><div id="history" class="history"></div></section></main><script>
let currentRo=null,check=null,deliveries=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o){const r=await fetch(u,o),d=await r.json();if(!r.ok){const e=Error(d.error||'Request failed');e.data=d;throw e}return d}function box(el,text,type){el.innerHTML=`<div class="status ${type}">${esc(text)}</div>`}function dt(v){if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString()}function renderGates(){if(!check)return;const items=check.delivery_checks||check.checks||[];gates.innerHTML=items.map(x=>`<div class="gate ${x.ok?'pass':'fail'}">${x.ok?'✓':'⚠'} ${esc(x.label)}</div>`).join('');gateBadge.textContent=check.deliverable?'DELIVERABLE':check.ready?'READY — PAYMENT DUE':'BLOCKED';gateBadge.className='badge '+(check.deliverable?'delivered':'pending');finishBtn.disabled=!check.deliverable}async function start(){const id=Number(ro.value);if(!Number.isInteger(id)||id<1)return box(loadStatus,'Enter a valid repair order number.','bad');startBtn.disabled=true;try{check=await api('/api/v2/repair-orders/'+id+'/completion-check');currentRo=id;title.textContent='RO #'+id+' Delivery Checklist';form.style.display='block';loadStatus.innerHTML='';renderGates();await hydrateExisting(id)}catch(e){form.style.display='none';currentRo=null;box(loadStatus,e.message,'bad')}finally{startBtn.disabled=false}}async function hydrateExisting(id){const existing=deliveries.find(x=>Number(x.repair_order_id)===Number(id));notified.checked=!!existing?.customer_notified;keys.checked=!!existing?.keys_returned;parts.checked=!!existing?.old_parts_returned;docs.checked=!!existing?.documents_given;next.checked=!!existing?.next_service_explained;notes.value=existing?.notes||'';if(existing?.delivered_at){finishBtn.disabled=true;saveBtn.disabled=true;box(status,'This vehicle was delivered '+dt(existing.delivered_at)+'.','ok')}else{saveBtn.disabled=false;status.innerHTML=''}}async function save(silent=false){if(!currentRo)return false;saveBtn.disabled=true;try{await api('/api/v2/repair-orders/'+currentRo+'/delivery',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_notified:notified.checked,keys_returned:keys.checked,old_parts_returned:parts.checked,documents_given:docs.checked,next_service_explained:next.checked,notes:notes.value.trim()})});if(!silent)box(status,'Checklist saved.','ok');await loadHistory();return true}catch(e){box(status,e.message,'bad');return false}finally{saveBtn.disabled=false}}async function finish(){if(!currentRo)return;if(!(await save(true)))return;finishBtn.disabled=true;try{await api('/api/v2/repair-orders/'+currentRo+'/delivery/complete',{method:'PATCH'});box(status,'✓ Vehicle delivery recorded. Repair order moved to delivered.','ok');await loadHistory();check=await api('/api/v2/repair-orders/'+currentRo+'/completion-check');renderGates()}catch(e){const missing=e.data?.missing||[];status.innerHTML=`<div class="status bad"><b>${esc(e.message)}</b>${missing.length?`<ul class="missing">${missing.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>`;try{check=await api('/api/v2/repair-orders/'+currentRo+'/completion-check');renderGates()}catch(_){}}finally{if(check?.deliverable)finishBtn.disabled=false}}async function loadHistory(){try{deliveries=await api('/api/v2/deliveries');renderHistory();if(currentRo)hydrateExisting(currentRo)}catch(e){history.innerHTML=`<div class="status bad">${esc(e.message)}</div>`}}function renderHistory(){const q=search.value.trim().toLowerCase(),rows=deliveries.filter(x=>!q||[x.repair_order_id,x.customer_name,x.year,x.make,x.model].some(v=>String(v||'').toLowerCase().includes(q)));pendingCount.textContent=deliveries.filter(x=>!x.delivered_at).length;doneCount.textContent=deliveries.filter(x=>x.delivered_at).length;showingCount.textContent=rows.length;history.innerHTML=rows.length?rows.map(x=>`<article class="delivery"><div class="header"><b>RO #${esc(x.repair_order_id)} · ${esc(x.customer_name)}</b><span class="badge ${x.delivered_at?'delivered':'pending'}">${x.delivered_at?'DELIVERED':'PENDING'}</span></div><div class="muted">${esc([x.year,x.make,x.model].filter(Boolean).join(' ')||'Vehicle')}</div><div style="margin-top:7px">${x.delivered_at?'Delivered '+esc(dt(x.delivered_at)):'Checklist started '+esc(dt(x.created_at))}</div>${x.notes?`<div class="muted" style="margin-top:7px">${esc(x.notes)}</div>`:''}${!x.delivered_at?`<button class="btn secondary" style="margin-top:9px" onclick="ro.value=${Number(x.repair_order_id)};start()">Open Handoff</button>`:''}</article>`).join(''):'<div class="muted">No delivery records match this view.</div>'}loadHistory();setInterval(loadHistory,60000);
</script></body></html>
