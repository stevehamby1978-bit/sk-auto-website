<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Ready Board</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1250px;margin:auto;padding:24px}.muted{color:#89959e}.summary{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:16px 0}.metric{background:#10151a;border:1px solid #29323a;border-radius:10px;padding:14px}.metric b{display:block;font-size:24px;margin-top:5px}.toolbar{display:grid;grid-template-columns:1fr 210px;gap:10px;margin:14px 0}.toolbar input,.toolbar select{background:#0b0f12;color:#fff;border:1px solid #303942;border-radius:7px;padding:11px;width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:16px}.deliverable{border-color:#2e7043}.payment{border-color:#a77b2d}.handoff{border-color:#3d6f8c}.blocked{border-color:#71332f}.waiting{border-color:#34404a}.badge{display:inline-block;padding:5px 8px;border-radius:20px;font-size:11px;font-weight:bold}.green{background:#153820;color:#72dd91}.yellow{background:#493813;color:#f2c35f}.blue{background:#173244;color:#78c9f5}.red{background:#3b1818;color:#ff8279}.gray{background:#222a31;color:#aab5bd}.vehicle{font-size:18px;font-weight:bold;margin:8px 0}.issue{padding:5px 0;color:#ff8279}.handoffIssue{padding:5px 0;color:#78c9f5}.paymentIssue{padding:5px 0;color:#f2c35f}.promise{margin-top:10px;padding-top:10px;border-top:1px solid #29323a}.overdue{color:#ff8279;font-weight:bold}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.pill{font-size:11px;background:#1a2127;border-radius:12px;padding:4px 7px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-block;text-decoration:none;border:0;border-radius:7px;padding:9px 12px;font-weight:bold;cursor:pointer;background:#28323a;color:#fff}.btn.primary{background:#1d6735}.btn.attention{background:#805d1f}.btn.handoffBtn{background:#285a76}.empty{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:20px}.error{color:#ff8279}@media(max-width:900px){.summary{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.summary{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Ready for Delivery</h1><p class="muted">Front-counter view of vehicles that can leave, payment status, handoff progress, and the exact reason anything is blocked.</p><section class="summary"><div class="metric"><span class="muted">Deliverable</span><b id="deliverableCount">0</b></div><div class="metric"><span class="muted">Handoff Due</span><b id="handoffCount">0</b></div><div class="metric"><span class="muted">Ready</span><b id="readyCount">0</b></div><div class="metric"><span class="muted">Payment Due</span><b id="paymentCount">0</b></div><div class="metric"><span class="muted">Blocked</span><b id="blockedCount">0</b></div><div class="metric"><span class="muted">In Progress</span><b id="progressCount">0</b></div></section><div class="toolbar"><input id="search" placeholder="Search RO, customer or vehicle" oninput="render()"><select id="filter" onchange="render()"><option value="attention">Needs delivery attention</option><option value="all">All active</option><option value="deliverable">Deliverable now</option><option value="ready_handoff">Handoff due</option><option value="ready_payment_due">Ready — payment due</option><option value="blocked">Blocked</option><option value="waiting">In progress</option></select></div><div id="grid" class="grid"></div></main><script>let rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function dt(v){if(!v)return'';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString()}function promised(v){if(!v)return '<span class="muted">No promised time set</span>';const d=new Date(v),late=!Number.isNaN(d.getTime())&&d.getTime()<Date.now();return `<span class="${late?'overdue':'muted'}">${late?'⚠ Promised time passed: ':'Promised: '}${esc(dt(v))}</span>`}function boardState(x){if(x.deliverable)return'deliverable';if(x.ready&&!x.payment_paid)return'ready_payment_due';if(x.ready&&x.payment_paid)return'ready_handoff';if(x.issue_count>0)return'blocked';return'waiting'}function state(x){const st=boardState(x);if(st==='deliverable')return{label:'DELIVERABLE NOW',cls:'deliverable',badge:'green'};if(st==='ready_payment_due')return{label:'READY — PAYMENT DUE',cls:'payment',badge:'yellow'};if(st==='ready_handoff')return{label:'READY — HANDOFF DUE',cls:'handoff',badge:'blue'};if(st==='blocked')return{label:'BLOCKED',cls:'blocked',badge:'red'};return{label:String(x.workflow_status||'IN PROGRESS').replaceAll('_',' ').toUpperCase(),cls:'waiting',badge:'gray'}}function metrics(s){deliverableCount.textContent=s.deliverable||0;handoffCount.textContent=s.handoff_due||0;readyCount.textContent=s.ready||0;paymentCount.textContent=s.payment_due||0;blockedCount.textContent=s.blocked||0;progressCount.textContent=s.in_progress||0}function openDelivery(id){location.href='v2-delivery.html?ro='+encodeURIComponent(id)}function render(){const q=search.value.trim().toLowerCase(),f=filter.value;let data=rows.filter(x=>{const st=boardState(x),attention=['deliverable','ready_payment_due','ready_handoff','blocked'].includes(st);const matchFilter=f==='all'||(f==='attention'?attention:st===f);const matchSearch=!q||[x.id,x.customer_name,x.year,x.make,x.model].some(v=>String(v||'').toLowerCase().includes(q));return matchFilter&&matchSearch});data.sort((a,b)=>{const rank=x=>({deliverable:0,ready_handoff:1,ready_payment_due:2,blocked:3,waiting:4}[boardState(x)]??5);return rank(a)-rank(b)||(new Date(a.promised_at||'2999-01-01')-new Date(b.promised_at||'2999-01-01'))});grid.innerHTML=data.length?data.map(x=>{const s=state(x),st=boardState(x),vehicle=[x.year,x.make,x.model].filter(Boolean).join(' ')||'Vehicle';const deliveryLabel=st==='deliverable'?'Complete Delivery':st==='ready_handoff'?'Complete Handoff':st==='ready_payment_due'?'Open Handoff':st==='blocked'?'Review Delivery Blocks':'View Handoff';const handoffIssues=(x.delivery_issues||[]).filter(i=>!(x.issues||[]).includes(i)&&i!=='Payment not complete');return `<article class="card ${s.cls}"><span class="badge ${s.badge}">${s.label}</span><div class="vehicle">RO #${esc(x.id)} · ${esc(vehicle)}</div><b>${esc(x.customer_name)}</b><div class="meta"><span class="pill">Workflow: ${esc(x.workflow_status||'—')}</span><span class="pill">Payment: ${esc(x.payment_status||'—')}</span></div>${(x.issues||[]).map(i=>`<div class="issue">⚠ ${esc(i)}</div>`).join('')}${st==='ready_payment_due'?'<div class="paymentIssue">$ Payment must be collected before delivery</div>':''}${handoffIssues.map(i=>`<div class="handoffIssue">• ${esc(i)}</div>`).join('')}${x.deliverable?'<p>✓ Workflow clear<br>✓ Payment complete<br>✓ Handoff checklist complete<br>✓ Vehicle can be delivered</p>':''}<div class="promise">${promised(x.promised_at)}</div><div class="actions"><button class="btn ${st==='deliverable'?'primary':st==='ready_handoff'?'handoffBtn':st==='ready_payment_due'?'attention':''}" onclick="openDelivery(${Number(x.id)})">${deliveryLabel}</button></div></article>`}).join(''):'<div class="empty muted">No repair orders match this view.</div>'}async function load(){try{const r=await fetch('/api/v2/ready-board',{headers:{Accept:'application/json'},cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load ready board');rows=Array.isArray(d)?d:(d.repair_orders||[]);metrics(d.summary||{ready:rows.filter(x=>x.ready).length,deliverable:rows.filter(x=>x.deliverable).length,payment_due:rows.filter(x=>x.ready&&!x.payment_paid).length,handoff_due:rows.filter(x=>x.ready&&x.payment_paid&&!x.deliverable).length,blocked:rows.filter(x=>x.issue_count).length,in_progress:rows.filter(x=>!x.ready&&!x.issue_count).length});render()}catch(e){grid.innerHTML=`<div class="empty error">${esc(e.message)}</div>`}}load();setInterval(load,30000);</script></body></html>
