<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Ready Board</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{max-width:1200px;margin:auto;padding:24px}.muted{color:#89959e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.card{background:#10151a;border:1px solid #29323a;border-radius:11px;padding:16px}.ready{border-color:#2e7043}.blocked{border-color:#71332f}.badge{display:inline-block;padding:5px 8px;border-radius:20px;font-size:11px;font-weight:bold}.green{background:#153820;color:#72dd91}.red{background:#3b1818;color:#ff8279}.vehicle{font-size:18px;font-weight:bold;margin:8px 0}.issue{padding:5px 0;color:#ff8279}.promise{margin-top:10px;padding-top:10px;border-top:1px solid #29323a}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Ready for Delivery</h1><p class="muted">Front-counter view of vehicles that can leave and the exact reason others cannot.</p><div id="grid" class="grid"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/v2/ready-board'),d=await r.json();if(!r.ok){grid.textContent=d.error||'Unable to load board';return}const rows=d.filter(x=>x.ready||x.workflow_status==='ready'||x.issues.length);grid.innerHTML=rows.length?rows.map(x=>`<article class="card ${x.ready?'ready':'blocked'}"><span class="badge ${x.ready?'green':'red'}">${x.ready?'READY FOR PICKUP':'NOT READY'}</span><div class="vehicle">RO #${x.id} · ${esc([x.year,x.make,x.model].filter(Boolean).join(' '))}</div><b>${esc(x.customer_name)}</b>${x.issues.map(i=>`<div class="issue">⚠ ${esc(i)}</div>`).join('')}${x.ready?'<p>✓ Operational workflow is clear.</p>':''}<div class="promise muted">${x.promised_at?'Promised: '+esc(new Date(x.promised_at).toLocaleString()):'No promised time set'}</div></article>`).join(''):'<p class="muted">No vehicles currently waiting for delivery attention.</p>'}load();setInterval(load,30000);</script></body></html>
