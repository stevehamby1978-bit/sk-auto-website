<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garavex V2 | Shop Board</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#f4f6f7;font:14px Arial}.wrap{padding:20px;max-width:1500px;margin:auto}.muted{color:#89959e}.board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:10px;overflow-x:auto;padding-bottom:12px}.lane{background:#10151a;border:1px solid #29323a;border-radius:10px;padding:12px;min-height:420px}.lane h2{font-size:15px;text-transform:uppercase;letter-spacing:.5px}.job{background:#0b0f12;border:1px solid #303942;border-radius:8px;padding:12px;margin:9px 0}.job b{font-size:15px}.tech{margin:7px 0}.actions{display:flex;gap:5px}.actions button{flex:1;background:#252d34;color:#fff;border:1px solid #37414a;border-radius:5px;padding:6px;cursor:pointer;font-size:11px}.actions button:hover{border-color:#df3329}@media(max-width:900px){.board{grid-template-columns:repeat(6,250px)}}</style></head><body><script src="v2-navigation.js"></script><main class="wrap"><h1>Live Shop Board</h1><p class="muted">Every active vehicle, where it is in the workflow, and who is working on it.</p><div id="board" class="board"></div></main><script>let data;const names={waiting:'Waiting',diagnosis:'Diagnosis',approval:'Awaiting Approval',repair:'In Repair',quality:'Final QC',ready:'Ready'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function job(x){const i=data.lanes.indexOf(x.workflow_status);return `<article class="job"><b>RO #${x.id} · ${esc(x.customer_name)}</b><div class="muted">${esc([x.year,x.make,x.model].filter(Boolean).join(' '))}</div><div class="tech">${x.technician_name?'Tech: '+esc(x.technician_name):'<span class="muted">Unassigned</span>'}</div><div class="actions">${i>0?`<button onclick="move(${x.id},'${data.lanes[i-1]}')">← Back</button>`:''}${i<data.lanes.length-1?`<button onclick="move(${x.id},'${data.lanes[i+1]}')">Next →</button>`:''}</div></article>`}async function load(){const r=await fetch('/api/v2/status-board'),d=await r.json();if(!r.ok){board.textContent=d.error||'Unable to load board';return}data=d;board.innerHTML=d.lanes.map(s=>{const jobs=d.repair_orders.filter(x=>x.workflow_status===s);return `<section class="lane"><h2>${names[s]} <span class="muted">${jobs.length}</span></h2>${jobs.map(job).join('')||'<p class="muted">No vehicles</p>'}</section>`}).join('')}async function move(id,status){const r=await fetch('/api/v2/status-board/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({workflow_status:status})}),d=await r.json();if(!r.ok)alert(d.error||'Unable to update');load()}load();setInterval(load,30000);</script></body></html>
